<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ld" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M5,10 L0,0 L10,0 z" fill="#5a6b7c"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Viga W460×74, luz {{L:m}} m, w = {{w:tonf/m}} tonf/m → M_u = {{M_u:tonf*m}} tonf·m: un arriostre lo cambia todo</text>

  <!-- ============ ESQUEMA A: solo apoyos ============ -->
  <text x="60" y="56" font-size="11.5" fill="#c0392b" font-weight="bold">A) Arriostrada solo en los apoyos → L_b = {{L_bA:m}} m (elástico)</text>
  <!-- carga distribuida -->
  <g stroke="#5a6b7c" stroke-width="1">
    <line x1="90" y1="72" x2="90" y2="92" marker-end="url(#ld)"/><line x1="140" y1="72" x2="140" y2="92" marker-end="url(#ld)"/>
    <line x1="190" y1="72" x2="190" y2="92" marker-end="url(#ld)"/><line x1="240" y1="72" x2="240" y2="92" marker-end="url(#ld)"/>
    <line x1="290" y1="72" x2="290" y2="92" marker-end="url(#ld)"/><line x1="340" y1="72" x2="340" y2="92" marker-end="url(#ld)"/>
    <line x1="390" y1="72" x2="390" y2="92" marker-end="url(#ld)"/>
  </g>
  <text x="410" y="82" font-size="10" fill="#5a6b7c">w</text>
  <!-- viga -->
  <rect x="90" y="94" width="300" height="10" fill="#eef2f7" stroke="#333" stroke-width="1.4"/>
  <!-- apoyos -->
  <path d="M90,104 l-9,14 l18,0 z" fill="#fff" stroke="#333"/><path d="M390,104 l-9,14 l18,0 z" fill="#fff" stroke="#333"/>
  <!-- arriostres solo en apoyos (aspa) -->
  <g stroke="#c0392b" stroke-width="1.8"><path d="M84,90 l12,18 M96,90 l-12,18"/><path d="M384,90 l12,18 M396,90 l-12,18"/></g>
  <!-- cota Lb -->
  <line x1="90" y1="132" x2="390" y2="132" stroke="#555" stroke-width="0.8" marker-start="url(#ard)" marker-end="url(#ard)"/>
  <text x="240" y="146" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">L_b = {{L_bA:m}} m &gt; L_r = {{L_r:m}} m</text>
  <text x="240" y="161" font-size="9.5" text-anchor="middle" fill="#888">zona elástica: se vuelca sin haber fluido</text>

  <!-- ============ ESQUEMA B: + media luz ============ -->
  <text x="60" y="196" font-size="11.5" fill="#1c7c3c" font-weight="bold">B) + un arriostre a media luz → L_b = {{L_bB:m}} m (inelástico)</text>
  <rect x="90" y="224" width="300" height="10" fill="#eef2f7" stroke="#333" stroke-width="1.4"/>
  <path d="M90,234 l-9,14 l18,0 z" fill="#fff" stroke="#333"/><path d="M390,234 l-9,14 l18,0 z" fill="#fff" stroke="#333"/>
  <g stroke="#1c7c3c" stroke-width="1.8">
    <path d="M84,220 l12,18 M96,220 l-12,18"/>
    <path d="M234,220 l12,18 M246,220 l-12,18"/>
    <path d="M384,220 l12,18 M396,220 l-12,18"/>
  </g>
  <text x="240" y="215" font-size="9.5" text-anchor="middle" fill="#1c7c3c">arriostre lateral nuevo</text>
  <line x1="90" y1="260" x2="240" y2="260" stroke="#555" stroke-width="0.8" marker-start="url(#ard)" marker-end="url(#ard)"/>
  <line x1="240" y1="260" x2="390" y2="260" stroke="#555" stroke-width="0.8" marker-start="url(#ard)" marker-end="url(#ard)"/>
  <text x="165" y="273" font-size="10" text-anchor="middle" fill="#1c7c3c">{{L_bB:m}} m</text>
  <text x="315" y="273" font-size="10" text-anchor="middle" fill="#1c7c3c">{{L_bB:m}} m</text>
  <text x="240" y="288" font-size="9.5" text-anchor="middle" fill="#888">L_p = {{L_p:m}} m &lt; L_b ≤ L_r: zona inelástica</text>

  <!-- ============ BARRAS demanda/capacidad ============ -->
  <!-- escala 5 px/(tonf*m) desde x=470; anchos FIJOS a mano (un token en width rompe el SVG) -->
  <text x="470" y="56" font-size="11.5" fill="#1a63a8" font-weight="bold">φM_n vs M_u = {{M_u:tonf*m}} tonf·m</text>
  <!-- el umbral M_u va en segmentos, uno por banda de barra: una vertical continua
       tacharía los rótulos, que ocupan todo el ancho del gráfico -->
  <g stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="570" y1="72" x2="570" y2="86"/>
    <line x1="570" y1="98" x2="570" y2="120"/>
    <line x1="570" y1="150" x2="570" y2="172"/>
    <line x1="570" y1="202" x2="570" y2="224"/>
  </g>
  <text x="570" y="68" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">M_u = {{M_u:tonf*m}}</text>
  <line x1="470" y1="252" x2="810" y2="252" stroke="#333" stroke-width="1"/>
  <line x1="470" y1="80" x2="470" y2="252" stroke="#333" stroke-width="1"/>

  <!-- meta phiMp (faint) -->
  <text x="476" y="94" font-size="10" fill="#5a6b7c">meta φM_p = {{Rd_p:tonf*m}} tonf·m (bien arriostrada, uso {{round(u_p,2)}})</text>
  <rect x="470" y="100" width="262" height="18" fill="#f4f7fb" stroke="#9bb0c6" stroke-width="1.1"/>

  <!-- A: falla -->
  <text x="476" y="146" font-size="10" fill="#c0392b" font-weight="bold">A) L_b = {{L_bA:m}} m, elástico · C_b = {{round(C_bA,2)}} · φM_n = {{Rd_A:tonf*m}} tonf·m</text>
  <rect x="470" y="152" width="95" height="18" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="806" y="165" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">{{round(u_A,2)}} ✗</text>

  <!-- B: pasa -->
  <text x="476" y="198" font-size="10" fill="#1c7c3c" font-weight="bold">B) L_b = {{L_bB:m}} m, inelástico · C_b = {{round(C_bB,2)}} · φM_n = {{Rd_B:tonf*m}} tonf·m</text>
  <rect x="470" y="204" width="255" height="18" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.3"/>
  <text x="806" y="217" font-size="10" text-anchor="end" fill="#1c7c3c" font-weight="bold">{{round(u_B,2)}} ✓</text>

  <text x="476" y="244" font-size="9.5" fill="#888">sin el crédito C_b (= 1,0): φM_n = {{Rd_A1:tonf*m}} tonf·m</text>

  <!-- caja tesis -->
  <rect x="60" y="312" width="720" height="112" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="74" y="334" font-size="11.5" fill="#222" font-weight="bold">La palanca del LTB: arriostrar y el crédito C_b, no un perfil mayor</text>
  <text x="74" y="355" font-size="10.5" fill="#333">• Con L_b = {{L_bA:m}} m la viga pandea elástica: φM_n = {{Rd_A:tonf*m}} &lt; {{M_u:tonf*m}}, FALLA — aunque su φM_p = {{Rd_p:tonf*m}} sobra por lejos.</text>
  <text x="74" y="374" font-size="10.5" fill="#333">• C_b rescata algo: de {{Rd_A1:tonf*m}} (C_b = 1,0) a {{Rd_A:tonf*m}} (C_b = {{round(C_bA,2)}}), pero no alcanza.</text>
  <text x="74" y="393" font-size="10.5" fill="#333">• Un arriostre a media luz (L_b = {{L_bB:m}} m) sube φM_n a {{Rd_B:tonf*m}} → uso {{round(u_B,2)}}. Mismo perfil, mismo acero, misma carga.</text>
  <text x="74" y="414" font-size="10" fill="#888">Subir de perfil sube M_p (que ya sobra); lo que gobierna es la distancia entre arriostres.</text>

  <!-- =============== BANDA DE VALORES =============== -->
  <line x1="46" y1="452" x2="794" y2="452" stroke="#d5dbe2" stroke-width="1"/>
  <text x="46" y="474" font-size="11" fill="#333">Demanda M_u = {{M_u:tonf*m}} tonf·m · W460×74 con Z_x = {{Z_x:cm^3}} cm³ de tabla (las cuatro planchas dan {{Z_xpl:cm^3}} cm³: faltan los redondeos de unión).</text>
  <text x="46" y="492" font-size="11" fill="#333">La variable que habla es L_b contra L_p = {{L_p:m}} m y L_r = {{L_r:m}} m; el crédito por gradiente sube de C_b = {{C_bA}} a {{C_bB}} al partir la luz.</text>
  <text x="46" y="510" font-size="11" fill="#c0392b" font-weight="bold">Gobierna el LTB elástico (Ec. F2-3): φM_n = {{Rd_A:tonf*m}} tonf·m → uso {{round(u_A,2)}}, NO PASA. El arriostre lo lleva a {{Rd_B:tonf*m}}, un factor {{raz}}.</text>
</svg>
