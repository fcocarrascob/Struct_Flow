<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="system-ui, sans-serif">
  <!-- Esquema paramétrico de `pedestal-generico`: sección con las barras en el
       orden en que se colocan, elevación con los estribos y la profundidad del
       perno, y la columna de usos. Cada color lee la misma comparación que su v_*. -->

  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Pedestal de hormigón armado — sección y elevación a escala</text>

  <!-- =============== SECCIÓN =============== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">SECCIÓN</text>

  <rect x="{{px(-PED_X/2):svg}}" y="{{py(-PED_Y/2):svg}}" width="{{PED_X/(1 mm)*esc:svg}}" height="{{PED_Y/(1 mm)*esc:svg}}"
        fill="#f4f6f8" stroke="#333" stroke-width="1.6"/>

  <!-- Estribo perimetral, al eje de las barras -->
  <rect x="{{px(-(PED_X/2 - recub_ped)):svg}}" y="{{py(-(PED_Y/2 - recub_ped)):svg}}"
        width="{{(PED_X - 2*recub_ped)/(1 mm)*esc:svg}}" height="{{(PED_Y - 2*recub_ped)/(1 mm)*esc:svg}}"
        fill="none" stroke="{{col_est}}" stroke-width="1.3"/>

  <!-- Barras longitudinales, repartidas por el perímetro del núcleo -->
  <circle data-repetir="barras_px" cx="{{fila[1]:svg}}" cy="{{fila[2]:svg}}" r="{{r_barra_px:svg}}"
          fill="{{col_barras}}" stroke="none"/>

  <!-- Cotas de la sección -->
  <text x="230" y="{{py(-PED_Y/2) - 8:svg}}" font-size="10.5" text-anchor="middle" fill="#222"
        stroke="#fff" stroke-width="3" paint-order="stroke">PED_X = {{PED_X:mm}} mm</text>
  <text x="{{px(-PED_X/2) - 10:svg}}" y="175" font-size="10.5" text-anchor="end" fill="#222"
        stroke="#fff" stroke-width="3" paint-order="stroke">PED_Y = {{PED_Y:mm}} mm</text>
  <text x="{{px(PED_X/2) + 10:svg}}" y="{{py(-PED_Y/2) + 14:svg}}" font-size="10" fill="{{col_barras}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">{{n_barras}} ø{{db_long:mm}} · ρ = {{rho_long}}</text>
  <text x="{{px(PED_X/2) + 10:svg}}" y="{{py(-PED_Y/2) + 32:svg}}" font-size="10" fill="{{col_est}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">estribo ø{{db_est:mm}} @ {{sep_est:mm}} · {{n_ramas}} ramas</text>
  <text x="{{px(PED_X/2) + 10:svg}}" y="{{py(-PED_Y/2) + 50:svg}}" font-size="10" fill="#555"
        stroke="#fff" stroke-width="3" paint-order="stroke">recubrimiento al eje {{recub_ped:mm}} mm</text>

  <!-- El radio de conteo de la armadura de anclaje, a escala -->
  <line x1="{{px(PED_X/2) + 14:svg}}" x2="{{px(PED_X/2) + 14 + radio_cono/(1 mm)*esc:svg}}"
        y1="{{py(PED_Y/2) - 18:svg}}" y2="{{py(PED_Y/2) - 18:svg}}" stroke="{{col_anc}}" stroke-width="1.4"/>
  <line x1="{{px(PED_X/2) + 14:svg}}" x2="{{px(PED_X/2) + 14:svg}}" y1="{{py(PED_Y/2) - 23:svg}}" y2="{{py(PED_Y/2) - 13:svg}}" stroke="{{col_anc}}" stroke-width="1.4"/>
  <line x1="{{px(PED_X/2) + 14 + radio_cono/(1 mm)*esc:svg}}" x2="{{px(PED_X/2) + 14 + radio_cono/(1 mm)*esc:svg}}"
        y1="{{py(PED_Y/2) - 23:svg}}" y2="{{py(PED_Y/2) - 13:svg}}" stroke="{{col_anc}}" stroke-width="1.4"/>
  <text x="{{px(PED_X/2) + 14:svg}}" y="{{py(PED_Y/2) - 26:svg}}" font-size="10" fill="{{col_anc}}">0,5·h_ef = {{radio_cono:mm}} mm</text>
  <text x="{{px(PED_X/2) + 14:svg}}" y="{{py(PED_Y/2) + 2:svg}}" font-size="10" fill="{{col_anc}}">cuentan {{n_contables}} barras · hacen falta {{n_req}}</text>

  <!-- =============== ELEVACIÓN =============== -->
  <text x="40" y="{{ey(0 mm) - 32:svg}}" font-size="12" fill="#555" font-weight="bold">ELEVACIÓN</text>

  <!-- Placa base, esquemática -->
  <rect x="{{px(-PED_X/2*0.72):svg}}" y="{{ey(0 mm) - 8:svg}}" width="{{PED_X*0.72/(1 mm)*esc:svg}}" height="6" fill="#9aa3ab" stroke="none"/>

  <!-- Pedestal -->
  <rect x="{{px(-PED_X/2):svg}}" y="{{ey(0 mm):svg}}" width="{{PED_X/(1 mm)*esc:svg}}" height="{{PED_H/(1 mm)*esc:svg}}"
        fill="#f4f6f8" stroke="#333" stroke-width="1.6"/>

  <!-- Zapata bajo el pedestal, esquemática -->
  <rect x="{{px(-PED_X/2) - 26:svg}}" y="{{ey(PED_H):svg}}" width="{{PED_X/(1 mm)*esc + 52:svg}}" height="16"
        fill="#e7eaed" stroke="#888" stroke-width="1"/>

  <!-- Estribos -->
  <line data-repetir="estribos_px" x1="{{px(-(PED_X/2 - recub_ped)):svg}}" x2="{{px(PED_X/2 - recub_ped):svg}}"
        y1="{{fila[1]:svg}}" y2="{{fila[1]:svg}}" stroke="{{col_est}}" stroke-width="1"/>

  <!-- Barras longitudinales de borde. Con sdc_def = 1 bajan con GANCHO A 90° y
       el extremo libre hacia el eje del pedestal, que es lo que pide el
       §18.13.2.3 y lo que el panel afirma; sin él se dibujaban rectas. -->
  <path d="M {{px(-(PED_X/2 - recub_ped)):svg}} {{ey(0 mm):svg}} V {{ey(PED_H) + 12:svg}} h {{sdc_def == 1 ? 16 : 0:svg}}"
        fill="none" stroke="{{col_barras}}" stroke-width="1.8"/>
  <path d="M {{px(PED_X/2 - recub_ped):svg}} {{ey(0 mm):svg}} V {{ey(PED_H) + 12:svg}} h {{sdc_def == 1 ? -16 : 0:svg}}"
        fill="none" stroke="{{col_barras}}" stroke-width="1.8"/>
  <text x="{{px(-PED_X/2) - 26:svg}}" y="{{ey(PED_H) + 44:svg}}" font-size="9" fill="{{col_barras}}">{{sdc_def == 1 ? "ganchos a 90° hacia el eje (§18.13.2.3)" : "sin exigencia de gancho (SDC A, B o C)"}}</text>
  <line x1="{{px(-PED_X/2*0.55):svg}}" x2="{{px(-PED_X/2*0.55):svg}}" y1="{{ey(0 mm) - 8:svg}}" y2="{{ey(h_ef):svg}}" stroke="{{col_anc}}" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="{{px(PED_X/2*0.55):svg}}" x2="{{px(PED_X/2*0.55):svg}}" y1="{{ey(0 mm) - 8:svg}}" y2="{{ey(h_ef):svg}}" stroke="{{col_anc}}" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Cotas de elevación -->
  <text x="{{px(-PED_X/2) - 32:svg}}" y="{{ey(PED_H/2):svg}}" font-size="10.5" text-anchor="end" fill="#222"
        stroke="#fff" stroke-width="3" paint-order="stroke">PED_H = {{PED_H:mm}} mm</text>
  <text x="{{px(PED_X/2) + 34:svg}}" y="{{ey(h_ef):svg}}" font-size="10" fill="{{col_anc}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">h_ef = {{h_ef:mm}} mm</text>
  <text x="{{px(PED_X/2) + 34:svg}}" y="{{ey(PED_H) + 26:svg}}" font-size="10" fill="#777">zapata</text>

  <!-- =============== COLUMNA DE RESULTADOS =============== -->
  <line x1="600" y1="60" x2="600" y2="520" stroke="#ddd" stroke-width="1"/>
  <text x="620" y="66" font-size="11.5" fill="#222" font-weight="bold">Estados límite</text>

  <text x="620" y="92" font-size="10.5" fill="#333">Compresión axial</text>
  <text x="830" y="92" font-size="10.5" text-anchor="end" fill="{{cu(u_comp)}}" font-weight="bold">{{u_comp}}</text>
  <text x="620" y="112" font-size="10.5" fill="#333">Tracción axial</text>
  <text x="830" y="112" font-size="10.5" text-anchor="end" fill="{{cu(u_trac)}}" font-weight="bold">{{u_trac}}</text>
  <text x="620" y="132" font-size="10.5" fill="#333">Flexocompresión (peor punto)</text>
  <text x="830" y="132" font-size="10.5" text-anchor="end" fill="{{cu(u_pm)}}" font-weight="bold">{{u_pm}}</text>
  <text x="620" y="152" font-size="10.5" fill="#333">Flexión biaxial</text>
  <text x="830" y="152" font-size="10.5" text-anchor="end" fill="{{cu(u_biax)}}" font-weight="bold">{{u_biax}}</text>
  <text x="620" y="172" font-size="10.5" fill="#333">Corte en X</text>
  <text x="830" y="172" font-size="10.5" text-anchor="end" fill="{{cu(u_corte_X)}}" font-weight="bold">{{u_corte_X}}</text>
  <text x="620" y="192" font-size="10.5" fill="#333">Corte en Y</text>
  <text x="830" y="192" font-size="10.5" text-anchor="end" fill="{{cu(u_corte_Y)}}" font-weight="bold">{{u_corte_Y}}</text>
  <text x="620" y="212" font-size="10.5" fill="#333">Armadura de anclaje</text>
  <text x="830" y="212" font-size="10.5" text-anchor="end" fill="{{cu(u_anclaje)}}" font-weight="bold">{{u_anclaje}}</text>

  <text x="620" y="246" font-size="11.5" fill="#222" font-weight="bold">Cuantía y detallado</text>
  <text x="620" y="270" font-size="10" fill="#555">A_st = {{Ast:mm^2}} mm² (0,01·Ag = {{As_min:mm^2}})</text>
  <text x="620" y="288" font-size="10" fill="#555">cuantía entre 0,01 y 0,08</text>
  <text x="830" y="288" font-size="10" text-anchor="end" fill="#333">{{v_cuantia_min and v_cuantia_max}}</text>
  <text x="620" y="306" font-size="10" fill="#555">A_v ≥ mínima ({{Av_min:mm^2}} mm²)</text>
  <text x="830" y="306" font-size="10" text-anchor="end" fill="#333">{{v_Av}}</text>
  <text x="620" y="324" font-size="10" fill="#555">separación ≤ {{sep_est_max:mm}} mm</text>
  <text x="830" y="324" font-size="10" text-anchor="end" fill="#333">{{v_sep_est}}</text>
  <text x="620" y="342" font-size="10" fill="#555">diámetro de estribo mínimo</text>
  <text x="830" y="342" font-size="10" text-anchor="end" fill="#333">{{v_db_est}}</text>

  <text x="620" y="376" font-size="11.5" fill="#222" font-weight="bold">Materiales y extremos P–M</text>
  <text x="620" y="398" font-size="10" fill="#555">f'c = {{fc:MPa}} MPa · fy = {{fy:MPa}} MPa</text>
  <text x="620" y="416" font-size="10" fill="#555">φP_n,max = {{phiPn_max:kN}} kN · φP_nt = {{phiPnt:kN}} kN</text>
  <text x="620" y="434" font-size="10" fill="#555">{{sdc_def == 1 ? "rige §18.13.2 en la unión con la zapata" : "no rige §18.13.2 (SDC A, B o C)"}}</text>

  <!-- Franja de cierre -->
  <rect x="612" y="452" width="218" height="62" rx="4" fill="{{col_global}}" fill-opacity="0.10" stroke="{{col_global}}" stroke-width="1"/>
  <text x="622" y="470" font-size="9.5" fill="#777">Gobierna</text>
  <text x="622" y="486" font-size="9.5" fill="#333">{{gobierna}}</text>
  <text x="622" y="505" font-size="12" fill="{{col_global}}" font-weight="bold">u_max = {{u_max}}</text>
</svg>
