<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="system-ui, sans-serif">
  <!-- Esquema paramétrico de `anclaje-hormigon-generica`: planta con el área
       proyectada del cono y los pernos de la fila traccionada, elevación con el
       cono a 35°, la cabeza y la armadura de anclaje. -->

  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Grupo de pernos colados en tracción — área del cono y armadura de anclaje</text>

  <!-- =============== PLANTA =============== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">PLANTA · área proyectada A_Nc</text>

  <!-- Área proyectada del grupo -->
  <rect x="{{px(-lado_1/2):svg}}" y="{{py(-min(c_a2, 1.5*h_efc)):svg}}"
        width="{{lado_1/(1 mm)*esc:svg}}" height="{{lado_2/(1 mm)*esc:svg}}"
        fill="{{col_cono}}" fill-opacity="0.10" stroke="{{col_cono}}" stroke-width="1.3" stroke-dasharray="5 3"/>

  <!-- Borde del hormigón: a c_a2 de la fila y a c_a1 de los pernos extremos -->
  <line x1="{{px(-media_fila - c_a1) - 20:svg}}" x2="{{px(media_fila + c_a1) + 20:svg}}"
        y1="{{py(-c_a2):svg}}" y2="{{py(-c_a2):svg}}" stroke="#333" stroke-width="1.6"/>
  <line x1="{{px(-media_fila - c_a1):svg}}" x2="{{px(-media_fila - c_a1):svg}}"
        y1="{{py(-c_a2):svg}}" y2="{{py(1.5*h_efc):svg}}" stroke="#333" stroke-width="1.6"/>
  <line x1="{{px(media_fila + c_a1):svg}}" x2="{{px(media_fila + c_a1):svg}}"
        y1="{{py(-c_a2):svg}}" y2="{{py(1.5*h_efc):svg}}" stroke="#333" stroke-width="1.6"/>

  <!-- Pernos de la fila traccionada -->
  <circle data-repetir="pernos_px" cx="{{fila[1]:svg}}" cy="{{fila[2]:svg}}" r="{{max(2.5, d_a/(1 mm)*esc/2):svg}}"
          fill="{{col_acero}}" stroke="none"/>

  <!-- Cotas de planta -->
  <text x="{{px(0 mm):svg}}" y="{{py(-c_a2) - 8:svg}}" font-size="10" text-anchor="middle" fill="#555"
        stroke="#fff" stroke-width="3" paint-order="stroke">borde del hormigón · c_a2 = {{c_a2:mm}} mm</text>
  <text x="{{px(lado_1/2) + 12:svg}}" y="{{py(1.5*h_efc) - 6:svg}}" font-size="10" fill="{{col_cono}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">A_Nc = {{A_Nc/(1000 mm^2)}} ·10³ mm² · A_Nco = {{A_Nco/(1000 mm^2)}} ·10³ mm²</text>
  <text x="{{px(-media_fila - c_a1) - 6:svg}}" y="{{py(1.5*h_efc) + 16:svg}}" font-size="10" fill="#555">c_a1 = {{c_a1:mm}} mm</text>
  <!-- La nota de la fila va FUERA del área proyectada: dentro se leía como parte de A_Nc -->
  <text x="{{px(-media_fila - c_a1) - 6:svg}}" y="{{py(1.5*h_efc) + 32:svg}}" font-size="9.5" fill="{{col_sep}}">{{n_trac}} pernos ø{{d_a:mm}} @ s₁ = {{s_1:mm}} mm (mín. 4·d_a = {{4*d_a:mm}})</text>

  <!-- =============== ELEVACIÓN =============== -->
  <text x="40" y="{{ey(0 mm) - 26:svg}}" font-size="12" fill="#555" font-weight="bold">ELEVACIÓN · cono de arrancamiento a 35°</text>

  <!-- Hormigón -->
  <line x1="{{px(-1.5*h_ef) - 30:svg}}" x2="{{px(1.5*h_ef) + 30:svg}}" y1="{{ey(0 mm):svg}}" y2="{{ey(0 mm):svg}}" stroke="#333" stroke-width="1.6"/>

  <!-- Cono de arrancamiento -->
  <path d="M {{px(-1.5*h_ef):svg}} {{ey(0 mm):svg}} L {{px(-media_fila - d_a):svg}} {{ey(h_ef):svg}} L {{px(media_fila + d_a):svg}} {{ey(h_ef):svg}} L {{px(1.5*h_ef):svg}} {{ey(0 mm):svg}} Z"
        fill="{{col_cono}}" fill-opacity="0.10" stroke="{{col_cono}}" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- Armadura de anclaje: una barra por n_arm, dentro del cono -->
  <line data-repetir="armadura_px" x1="{{fila[1]:svg}}" x2="{{fila[1]:svg}}"
        y1="{{ey(0 mm) + 4:svg}}" y2="{{ey(h_ef) + 16:svg}}" stroke="{{col_arm}}" stroke-width="1.1"/>

  <!-- Pernos y cabezas: los n_trac de la fila, no solo los dos extremos. La
       planta dibujaba cuatro y la elevación dos, y nada lo decía. -->
  <line data-repetir="pernos_px" x1="{{fila[1]:svg}}" x2="{{fila[1]:svg}}"
        y1="{{ey(0 mm) - 14:svg}}" y2="{{ey(h_ef):svg}}" stroke="{{col_acero}}" stroke-width="2.4"/>
  <rect data-repetir="pernos_px" x="{{fila[1] - max(4, sqrt(A_brg/(1 mm^2))*esc/2):svg}}" y="{{ey(h_ef):svg}}"
        width="{{2*max(4, sqrt(A_brg/(1 mm^2))*esc/2):svg}}" height="5" fill="{{col_acero}}"/>

  <!-- Placa base, esquemática -->
  <rect x="{{px(-media_fila) - 10:svg}}" y="{{ey(0 mm) - 18:svg}}" width="{{2*media_fila/(1 mm)*esc + 20:svg}}" height="5" fill="#9aa3ab"/>

  <!-- Cotas de elevación -->
  <text x="{{px(1.5*h_ef) + 12:svg}}" y="{{ey(h_ef/2):svg}}" font-size="10" fill="#222"
        stroke="#fff" stroke-width="3" paint-order="stroke">h_ef = {{h_ef:mm}} mm</text>
  <text x="{{px(1.5*h_ef) + 12:svg}}" y="{{ey(h_ef) + 14:svg}}" font-size="10" fill="{{col_acero}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">cabeza A_brg = {{A_brg:mm^2}} mm²</text>
  <text x="{{px(-1.5*h_ef) - 26:svg}}" y="{{ey(h_ef) + 30:svg}}" font-size="10" fill="{{col_arm}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">{{usa_arm == 1 ? "armadura de anclaje" : "sin armadura de anclaje"}}</text>

  <!-- =============== COLUMNA DE RESULTADOS =============== -->
  <line x1="600" y1="60" x2="600" y2="520" stroke="#ddd" stroke-width="1"/>
  <text x="620" y="66" font-size="11.5" fill="#222" font-weight="bold">Modos de falla en tracción</text>

  <text x="620" y="92" font-size="10.5" fill="#333">Acero del perno</text>
  <text x="830" y="92" font-size="10.5" text-anchor="end" fill="{{cu(u_acero)}}" font-weight="bold">{{u_acero}}</text>
  <text x="620" y="112" font-size="10.5" fill="#333">{{usa_arm == 1 ? "Armadura de anclaje" : "Cono de hormigón"}}</text>
  <text x="830" y="112" font-size="10.5" text-anchor="end" fill="{{cu(u_cono)}}" font-weight="bold">{{u_cono}}</text>
  <text x="620" y="132" font-size="10.5" fill="#333">Extracción de la cabeza</text>
  <text x="830" y="132" font-size="10.5" text-anchor="end" fill="{{cu(u_pullout)}}" font-weight="bold">{{u_pullout}}</text>
  <text x="620" y="152" font-size="10.5" fill="#333">Descascaramiento lateral</text>
  <text x="830" y="152" font-size="10.5" text-anchor="end" fill="{{cu(u_blowout)}}" font-weight="bold">{{u_blowout}}</text>
  <text x="620" y="170" font-size="9" fill="#777">{{modo_sb}}</text>

  <text x="620" y="204" font-size="11.5" fill="#222" font-weight="bold">Armadura de anclaje</text>
  <!-- Con usa_arm = 0 la hoja anula la armadura: el panel no puede seguir dando
       una cuantía provista. Las dos ramas conmutan con una lista vacía. -->
  <g data-repetir="arm_si">
    <text x="620" y="226" font-size="10" fill="#555">exigida A_s,req = {{As_req:mm^2}} mm²</text>
    <text x="620" y="244" font-size="10" fill="#555">provista {{n_arm}} ø{{d_arm:mm}} = {{As_prov:mm^2}} mm²</text>
    <text x="620" y="262" font-size="10" fill="#555">la dimensiona: {{rige_armadura}}</text>
  </g>
  <g data-repetir="arm_no">
    <text x="620" y="226" font-size="10" fill="#555">no se dispone: el cono de hormigón gobierna</text>
  </g>

  <text x="620" y="296" font-size="11.5" fill="#222" font-weight="bold">Geometría y factores</text>
  <text x="620" y="318" font-size="10" fill="#555">separación ≥ 4·d_a</text>
  <text x="830" y="318" font-size="10" text-anchor="end" fill="#333">{{v_sep_min}}</text>
  <text x="620" y="336" font-size="10" fill="#555">{{n_bordes}} bordes · h_ef del cono = {{h_efc:mm}} mm</text>
  <text x="830" y="336" font-size="10" text-anchor="end" fill="#333">{{v_ca_max}}</text>
  <text x="620" y="354" font-size="10" fill="#555">f'c = {{fpc:MPa}} MPa · {{fisurado == 1 ? "fisurado" : "no fisurado"}}</text>
  <text x="620" y="372" font-size="10" fill="#555">φ_c = {{phi_c}} · ψ_a = {{psi_a}} · ψ_ed = {{psi_ed}}</text>
  <text x="620" y="390" font-size="10" fill="#555">{{sismo == 1 ? "sísmico: 0,75 sobre los modos del hormigón" : "sin reducción sísmica"}}</text>

  <!-- Franja de cierre -->
  <rect x="612" y="452" width="218" height="62" rx="4" fill="{{col_global}}" fill-opacity="0.10" stroke="{{col_global}}" stroke-width="1"/>
  <text x="622" y="470" font-size="9.5" fill="#777">Gobierna</text>
  <text x="622" y="486" font-size="9.5" fill="#333">{{gobierna}}</text>
  <text x="622" y="505" font-size="12" fill="{{col_global}}" font-weight="bold">u_max = {{u_max}}</text>
</svg>
