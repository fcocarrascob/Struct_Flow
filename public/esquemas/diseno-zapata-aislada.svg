<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 548" font-family="Segoe UI, Arial, sans-serif">
  <!--
    Esquema del módulo de diseño «zapata aislada rectangular».

    Dos dibujos y un panel. Arriba a la izquierda la PLANTA, con el perímetro
    crítico de punzonamiento y la banda central de 13.3.3.3; abajo el DIAGRAMA
    DE PRESIONES, que es donde se ve el momento: al crecer la excentricidad el
    rectángulo se vuelve trapecio, y al salirse del núcleo el borde de atrás
    llega a cero y la base se despega.

    El mapeo unidad→píxel lo define la hoja y acá solo se consumen píxeles, con
    el modificador `:svg`, que es obligatorio dentro de un atributo.

    La banda de 13.3.3.3 y el trapecio de presiones cambian de forma —la banda
    va en el sentido del lado largo, y el trapecio se inclina— así que las dos
    entran como matrices Nx2 que `formatSvg` vuelca a lista de puntos: un solo
    elemento SVG en vez de varios dibujos con visibilidades conmutadas.
  -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <pattern id="suelo" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c8cdd4" stroke-width="1"/>
    </pattern>
    <pattern id="banda" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#e0a800" stroke-width="1.4" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="840" height="548" fill="#ffffff"/>

  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Zapata {{B:cm}}×{{L:cm}}×{{h:cm}} cm · {{n_b_B}}φ{{d_b_B:mm}} en B · {{n_b_L}}φ{{d_b_L:mm}} en L</text>
  <text x="420" y="42" font-size="11" text-anchor="middle" fill="#666">ACI 318-25 (edición SI) — f’c = {{f_c:kgf/cm^2}} kgf/cm², f_y = {{f_y:kgf/cm^2}} kgf/cm² · columna {{c_1:cm}}×{{c_2:cm}} cm · P = {{P_serv:tonf}} tonf, M = {{M_serv:tonf*m}} tonf·m</text>

  <!-- =================== PLANTA =================== -->
  <text x="30" y="62" font-size="11.5" fill="#1a63a8" font-weight="bold">Planta — perímetro crítico a d/2 y banda central de 13.3.3.3</text>

  <rect x="{{x_z:svg}}" y="{{y_z:svg}}" width="{{B_px:svg}}" height="{{L_px:svg}}"
        fill="#f3f5f8" stroke="#333" stroke-width="1.6"/>

  <!-- La banda de γ_s: ancho igual al lado corto, centrada en la columna -->
  <polygon points="{{pts_banda:svg}}" fill="url(#banda)" stroke="#e0a800" stroke-width="1"/>

  <!-- Perímetro crítico de punzonamiento -->
  <rect x="{{x_per:svg}}" y="{{y_per:svg}}" width="{{anc_per:svg}}" height="{{alt_per:svg}}"
        fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 4"/>

  <!-- La columna -->
  <rect x="{{x_col:svg}}" y="{{y_col:svg}}" width="{{c1_px:svg}}" height="{{c2_px:svg}}"
        fill="#dfe6ee" stroke="#333" stroke-width="1.4"/>

  <!-- Cota de B, debajo -->
  <line x1="{{x_z:svg}}" y1="{{y_z + L_px + 18:svg}}" x2="{{x_z + B_px:svg}}" y2="{{y_z + L_px + 18:svg}}"
        stroke="#555" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="{{x_z + B_px/2:svg}}" y="{{y_z + L_px + 32:svg}}" font-size="11" text-anchor="middle" fill="#555">B = {{B:cm}} cm</text>

  <!-- Cota de L, a la izquierda -->
  <line x1="{{x_z - 20:svg}}" y1="{{y_z:svg}}" x2="{{x_z - 20:svg}}" y2="{{y_z + L_px:svg}}"
        stroke="#555" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="{{x_z - 28:svg}}" y="{{y_z + L_px/2:svg}}" font-size="11" text-anchor="middle" fill="#555"
        transform="rotate(-90 {{x_z - 28:svg}},{{y_z + L_px/2:svg}})">L = {{L:cm}} cm</text>

  <text x="30" y="282" font-size="10.5" fill="#555">Punzonamiento: b_0 = {{b_o:cm}} cm · α_s = {{alfa_s}} · β_c = {{beta_c}} · d = {{d_prom:cm}} cm</text>
  <text x="30" y="296" font-size="10.5" fill="#a07800">Banda central (13.3.3.3): γ_s = {{gam_s}} en un ancho de {{anc_banda:cm}} cm → {{A_s_banda:cm^2}} de {{A_s_corto:cm^2}} cm²</text>

  <!-- =================== DIAGRAMA DE PRESIONES =================== -->
  <text x="30" y="318" font-size="11.5" fill="#1a63a8" font-weight="bold">Presión de contacto en servicio (13.3.1.1)</text>

  <!-- La columna, centrada -->
  <rect x="{{x_cen_d - anc_col_d/2:svg}}" y="{{y_d0 - 24:svg}}" width="{{anc_col_d:svg}}" height="24"
        fill="#dfe6ee" stroke="#333" stroke-width="1.2"/>
  <!-- La zapata en elevación -->
  <rect x="{{x_d0:svg}}" y="{{y_d0:svg}}" width="{{anc_d:svg}}" height="{{alt_zap:svg}}"
        fill="#f3f5f8" stroke="#333" stroke-width="1.6"/>

  <!-- El trapecio de presiones, colgando de la base -->
  <polygon points="{{pts_pres:svg}}" fill="#1a63a8" opacity="0.18" stroke="#1a63a8" stroke-width="1.4"/>

  <!-- La presión admisible, para ver el margen de un vistazo -->
  <line x1="{{x_d0 - 8:svg}}" y1="{{y_adm:svg}}" x2="{{x_d0 + anc_d + 8:svg}}" y2="{{y_adm:svg}}"
        stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="{{x_d0 + anc_d + 12:svg}}" y="{{y_adm + 4:svg}}" font-size="10" fill="#b91c1c">q_a</text>

  <!-- La resultante y su excentricidad -->
  <line x1="{{x_res:svg}}" y1="{{y_d0 - 44:svg}}" x2="{{x_res:svg}}" y2="{{y_d0 - 4:svg}}"
        stroke="#c0392b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="{{x_cen_d:svg}}" y1="{{y_d0 - 34:svg}}" x2="{{x_res:svg}}" y2="{{y_d0 - 34:svg}}"
        stroke="#c0392b" stroke-width="1"/>
  <line x1="{{x_cen_d:svg}}" y1="{{y_d0 - 44:svg}}" x2="{{x_cen_d:svg}}" y2="{{y_d0:svg}}"
        stroke="#888" stroke-width="0.8" stroke-dasharray="3 3"/>

  <text x="{{x_d0:svg}}" y="{{y_base + 100:svg}}" font-size="10.5" fill="#1a63a8">q_máx = {{q_max:kgf/cm^2}} kgf/cm²</text>
  <text x="{{x_d0 + anc_d:svg}}" y="{{y_base + 100:svg}}" font-size="10.5" text-anchor="end" fill="#1a63a8">q_mín = {{q_min:kgf/cm^2}}</text>
  <text x="30" y="522" font-size="10.5" fill="#888">e = {{exc:cm}} cm · núcleo B/6 = {{exc_lim:cm}} cm · q_u,máx uniforme (+{{sobre_q*100}} %)</text>

  <!-- =================== PANEL DE RESULTADOS =================== -->
  <text x="430" y="62" font-size="11.5" fill="#1a63a8" font-weight="bold">Verificaciones</text>
  <line x1="430" y1="70" x2="810" y2="70" stroke="#d1d5db" stroke-width="1"/>

  <text x="430" y="90" font-size="11" fill="#333">Presión de contacto ≤ admisible (13.3.1.1)</text>
  <text x="810" y="90" font-size="11" text-anchor="end" fill="{{v_q ? '#15803d' : '#b91c1c'}}" font-weight="bold">{{q_max:kgf/cm^2}} / {{q_a:kgf/cm^2}} {{v_q}}</text>

  <text x="430" y="108" font-size="11" fill="#333">Resultante dentro del núcleo central</text>
  <text x="810" y="108" font-size="11" text-anchor="end" fill="{{v_nucleo ? '#15803d' : '#b45309'}}" font-weight="bold">{{exc:cm}} / {{exc_lim:cm}} cm {{v_nucleo}}</text>

  <text x="430" y="126" font-size="11" fill="#333">Área en planta provista / requerida</text>
  <text x="810" y="126" font-size="11" text-anchor="end" fill="#333" font-weight="bold">{{A_zap:m^2}} / {{A_req:m^2}} m²</text>

  <text x="430" y="144" font-size="11" fill="#333">Altura útil ≥ 150 mm (13.3.1.2)</text>
  <text x="810" y="144" font-size="11" text-anchor="end" fill="{{v_d_min ? '#15803d' : '#b91c1c'}}" font-weight="bold">d = {{d_L:cm}} cm {{v_d_min}}</text>

  <text x="430" y="162" font-size="11" fill="#333">Armadura mínima 0,0018·A_g (8.6.1.1)</text>
  <text x="810" y="162" font-size="11" text-anchor="end" fill="{{v_As ? '#15803d' : '#b91c1c'}}" font-weight="bold">{{A_s_B:cm^2}} y {{A_s_L:cm^2}} cm² {{v_As}}</text>

  <text x="430" y="180" font-size="11" fill="#333">Separación ≤ mín(2h, 450 mm) (8.7.2.2)</text>
  <text x="810" y="180" font-size="11" text-anchor="end" fill="{{v_sep ? '#15803d' : '#b91c1c'}}" font-weight="bold">s_máx = {{s_max:cm}} cm {{v_sep}}</text>

  <text x="430" y="198" font-size="11" fill="#333">Controlada por tracción · √f’c ≤ 8,3 MPa</text>
  <text x="810" y="198" font-size="11" text-anchor="end" fill="{{v_duct and v_rfc ? '#15803d' : '#b91c1c'}}" font-weight="bold">ε_t = {{min(eps_t_B, eps_t_L)}} {{v_duct and v_rfc}}</text>

  <line x1="430" y1="210" x2="810" y2="210" stroke="#d1d5db" stroke-width="1"/>

  <!-- Presión de contacto -->
  <text x="430" y="228" font-size="11" fill="#333" font-weight="bold">Presión de contacto — 13.3.1.1</text>
  <text x="810" y="228" font-size="11" text-anchor="end" fill="{{v_q ? '#15803d' : '#b91c1c'}}" font-weight="bold">FU = {{u_q}}</text>
  <rect x="430" y="233" width="380" height="10" fill="#eef2f7" stroke="#d1d5db" stroke-width="0.8"/>
  <rect x="430" y="233" width="{{min(u_q, 1.5)*253.3:svg}}" height="10" fill="{{v_q ? '#15803d' : '#b91c1c'}}" opacity="0.85"/>
  <line x1="683.3" y1="230" x2="683.3" y2="246" stroke="#333" stroke-width="1"/>

  <!-- Punzonamiento -->
  <text x="430" y="264" font-size="11" fill="#333" font-weight="bold">Punzonamiento — v_u = {{v_uv:kgf/cm^2}} · φv_c = {{Rd_v:kgf/cm^2}} kgf/cm²</text>
  <text x="810" y="264" font-size="11" text-anchor="end" fill="{{v_p ? '#15803d' : '#b91c1c'}}" font-weight="bold">FU = {{u_p}}</text>
  <rect x="430" y="269" width="380" height="10" fill="#eef2f7" stroke="#d1d5db" stroke-width="0.8"/>
  <rect x="430" y="269" width="{{min(u_p, 1.5)*253.3:svg}}" height="10" fill="{{v_p ? '#15803d' : '#b91c1c'}}" opacity="0.85"/>
  <line x1="683.3" y1="266" x2="683.3" y2="282" stroke="#333" stroke-width="1"/>

  <!-- Corte en una dirección -->
  <text x="430" y="300" font-size="11" fill="#333" font-weight="bold">Corte en una dirección — φV_c = {{Rd_V1_B:tonf}} / {{Rd_V1_L:tonf}} tonf</text>
  <text x="810" y="300" font-size="11" text-anchor="end" fill="{{v_V1 ? '#15803d' : '#b91c1c'}}" font-weight="bold">FU = {{u_V1}}</text>
  <rect x="430" y="305" width="380" height="10" fill="#eef2f7" stroke="#d1d5db" stroke-width="0.8"/>
  <rect x="430" y="305" width="{{min(u_V1, 1.5)*253.3:svg}}" height="10" fill="{{v_V1 ? '#15803d' : '#b91c1c'}}" opacity="0.85"/>
  <line x1="683.3" y1="302" x2="683.3" y2="318" stroke="#333" stroke-width="1"/>

  <!-- Flexión -->
  <text x="430" y="336" font-size="11" fill="#333" font-weight="bold">Flexión — φM_n = {{Rd_M_B:tonf*m}} / {{Rd_M_L:tonf*m}} tonf·m</text>
  <text x="810" y="336" font-size="11" text-anchor="end" fill="{{v_M ? '#15803d' : '#b91c1c'}}" font-weight="bold">FU = {{u_M}}</text>
  <rect x="430" y="341" width="380" height="10" fill="#eef2f7" stroke="#d1d5db" stroke-width="0.8"/>
  <rect x="430" y="341" width="{{min(u_M, 1.5)*253.3:svg}}" height="10" fill="{{v_M ? '#15803d' : '#b91c1c'}}" opacity="0.85"/>
  <line x1="683.3" y1="338" x2="683.3" y2="354" stroke="#333" stroke-width="1"/>

  <!-- Armadura mínima -->
  <text x="430" y="372" font-size="11" fill="#333" font-weight="bold">Armadura mínima — 8.6.1.1</text>
  <text x="810" y="372" font-size="11" text-anchor="end" fill="{{v_As ? '#15803d' : '#b91c1c'}}" font-weight="bold">FU = {{u_As}}</text>
  <rect x="430" y="377" width="380" height="10" fill="#eef2f7" stroke="#d1d5db" stroke-width="0.8"/>
  <rect x="430" y="377" width="{{min(u_As, 1.5)*253.3:svg}}" height="10" fill="{{v_As ? '#15803d' : '#b91c1c'}}" opacity="0.85"/>
  <line x1="683.3" y1="374" x2="683.3" y2="390" stroke="#333" stroke-width="1"/>

  <!-- Desarrollo de la barra -->
  <text x="430" y="408" font-size="11" fill="#333" font-weight="bold">Desarrollo de la barra — ℓ_d = {{l_d:cm}} de {{l_disp:cm}} cm</text>
  <text x="810" y="408" font-size="11" text-anchor="end" fill="{{v_ld ? '#15803d' : '#b91c1c'}}" font-weight="bold">FU = {{u_ld}}</text>
  <rect x="430" y="413" width="380" height="10" fill="#eef2f7" stroke="#d1d5db" stroke-width="0.8"/>
  <rect x="430" y="413" width="{{min(u_ld, 1.5)*253.3:svg}}" height="10" fill="{{v_ld ? '#15803d' : '#b91c1c'}}" opacity="0.85"/>
  <line x1="683.3" y1="410" x2="683.3" y2="426" stroke="#333" stroke-width="1"/>

  <!-- Veredicto -->
  <line x1="430" y1="438" x2="810" y2="438" stroke="#d1d5db" stroke-width="1"/>
  <text x="430" y="459" font-size="12.5" fill="{{v_cumple ? '#15803d' : '#b91c1c'}}" font-weight="bold">{{v_cumple ? 'CUMPLE' : 'NO CUMPLE'}} — FU máximo {{u_max}}</text>
  <text x="430" y="477" font-size="11" fill="#666">Gobierna: {{gobierna}}</text>
  <text x="430" y="493" font-size="10.5" fill="#888">Manda la {{dir_critica}}</text>

  <text x="430" y="512" font-size="10.5" fill="#b45309">{{v_nucleo ? '' : '⚠ e fuera del núcleo: la base se despega y el trapecio no vale.'}}</text>
  <text x="430" y="528" font-size="10.5" fill="#b45309">{{v_rigida ? '' : '⚠ Relajación de 13.2.6.2 invocada (R13.2.6.2: puede no aplicar).'}}</text>

  <text x="420" y="543" font-size="10" text-anchor="middle" fill="#999">Los valores se recalculan con el mismo motor que evalúa la memoria exportada.</text>
</svg>
