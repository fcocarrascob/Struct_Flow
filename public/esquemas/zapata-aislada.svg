<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,10 L10,10 L5,0 z" fill="#1a63a8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Zapata {{B:m}}×{{B:m}}×{{h:m}} m sobre columna {{c_col:cm}}×{{c_col:cm}} cm: qué fija el canto</text>

  <!-- =============== PANEL A: seccion y secciones criticas =============== -->
  <text x="60" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Sección: presión mayorada y las tres secciones críticas</text>

  <!-- columna -->
  <rect x="201" y="104" width="58" height="46" fill="#eef2f7" stroke="#333" stroke-width="1.4"/>
  <text x="230" y="98" font-size="10.5" text-anchor="middle" fill="#333">columna {{c_col:cm}}×{{c_col:cm}}</text>
  <!-- zapata -->
  <rect x="70" y="150" width="320" height="58" fill="#f4f7fb" stroke="#333" stroke-width="1.6"/>
  <!-- armadura inferior -->
  <g fill="#1c7c3c"><circle cx="90" cy="199" r="3"/><circle cx="128" cy="199" r="3"/><circle cx="166" cy="199" r="3"/><circle cx="204" cy="199" r="3"/><circle cx="242" cy="199" r="3"/><circle cx="280" cy="199" r="3"/><circle cx="318" cy="199" r="3"/><circle cx="356" cy="199" r="3"/></g>
  <!-- presion hacia arriba -->
  <g stroke="#1a63a8" stroke-width="1.3">
    <line x1="90" y1="238" x2="90" y2="212" marker-end="url(#up)"/>
    <line x1="140" y1="238" x2="140" y2="212" marker-end="url(#up)"/>
    <line x1="190" y1="238" x2="190" y2="212" marker-end="url(#up)"/>
    <line x1="240" y1="238" x2="240" y2="212" marker-end="url(#up)"/>
    <line x1="290" y1="238" x2="290" y2="212" marker-end="url(#up)"/>
    <line x1="340" y1="238" x2="340" y2="212" marker-end="url(#up)"/>
  </g>
  <line x1="70" y1="238" x2="390" y2="238" stroke="#1a63a8" stroke-width="1.2"/>
  <text x="230" y="252" font-size="11" text-anchor="middle" fill="#1a63a8" font-weight="bold">q_u = {{q_u:tonf/m^2}} tonf/m² (N_u = {{N_u:tonf}} tonf / {{A_zap:m^2}} m²)</text>
  <text x="230" y="316" font-size="10.5" text-anchor="middle" fill="#1c7c3c">{{n_b}} φ{{d_b:mm}} @ {{sep:cm}} cm — A_s = {{A_s:cm^2}} cm² (cada dirección)</text>

  <!-- secciones criticas -->
  <line x1="201" y1="150" x2="201" y2="104" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="259" y1="150" x2="259" y2="104" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="168" y1="150" x2="168" y2="132" stroke="#c07a00" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="292" y1="150" x2="292" y2="132" stroke="#c07a00" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="230" y="128" font-size="9.5" text-anchor="middle" fill="#c07a00">punz. a d/2</text>
  <line x1="134" y1="150" x2="134" y2="208" stroke="#c0392b" stroke-width="2"/>
  <line x1="326" y1="150" x2="326" y2="208" stroke="#c0392b" stroke-width="2"/>
  <text x="102" y="146" font-size="9.5" fill="#c0392b" font-weight="bold">corte 1-dir a d</text>

  <!-- cotas -->
  <line x1="70" y1="276" x2="390" y2="276" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="230" y="290" font-size="11" text-anchor="middle" fill="#555">B = L = {{B:m}} m — volado {{vol:cm}} cm</text>
  <line x1="404" y1="150" x2="404" y2="208" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="418" y="179" font-size="10.5" text-anchor="middle" fill="#555" transform="rotate(-90 418,179)">h = {{h:cm}} · d = {{d:cm}}</text>

  <!-- =============== PANEL B: usos =============== -->
  <text x="470" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Uso demanda/capacidad de cada verificación</text>

  <line x1="760" y1="66" x2="760" y2="230" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="760" y="63" font-size="10" text-anchor="middle" fill="#c0392b">1,0</text>
  <line x1="560" y1="230" x2="560" y2="66" stroke="#333" stroke-width="1"/>

  <!-- barras: 200 px = 1,0 desde x=560; anchos fijos a mano -->
  <rect x="560" y="74" width="186" height="18" fill="#eef2f7" stroke="#5a6b7c" stroke-width="1.2"/>
  <text x="565" y="87" font-size="10.5" fill="#4a5b6c">Presión de contacto (servicio)</text>
  <text x="832" y="87" font-size="10.5" text-anchor="end" fill="#4a5b6c">{{u_q}}</text>

  <rect x="560" y="104" width="124" height="18" fill="#fff5e6" stroke="#c07a00" stroke-width="1.2"/>
  <text x="565" y="117" font-size="10.5" fill="#a56a00">Punzonamiento (2 dir, con λ_s)</text>
  <text x="832" y="117" font-size="10.5" text-anchor="end" fill="#a56a00">{{u_V2}}</text>

  <rect x="560" y="134" width="153" height="18" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="565" y="147" font-size="10.5" fill="#c0392b" font-weight="bold">Corte 1 dir (piso 22.5.5.1.1)</text>
  <text x="832" y="147" font-size="10.5" text-anchor="end" fill="#c0392b" font-weight="bold">◄ {{u_V1}}</text>

  <rect x="560" y="164" width="114" height="18" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.2"/>
  <text x="565" y="177" font-size="10.5" fill="#1c7c3c">Flexión (acero mínimo gobierna)</text>
  <text x="832" y="177" font-size="10.5" text-anchor="end" fill="#1c7c3c">{{u_M}}</text>

  <rect x="560" y="194" width="173" height="18" fill="#eef2f7" stroke="#5a6b7c" stroke-width="1.2"/>
  <text x="565" y="207" font-size="10.5" fill="#4a5b6c">Desarrollo de la barra</text>
  <text x="832" y="207" font-size="10.5" text-anchor="end" fill="#4a5b6c">{{u_ld}}</text>

  <!-- caja del giro -->
  <rect x="440" y="256" width="380" height="166" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="452" y="278" font-size="11.5" fill="#222" font-weight="bold">Los tres tramos del V_c en una dirección</text>
  <text x="452" y="298" font-size="10.5" fill="#888">Fila (a) clásica, {{k_clas}}√f'c·b·d: φV_c = {{Rd_clas:tonf}} → uso {{u_clas}}</text>
  <text x="452" y="316" font-size="10.5" fill="#c0392b">Fila (c), {{k_1d}}·ρw^⅓·√f'c con λ_s = 1: φV_c = {{Rd_ls1:tonf}} → {{u_ls1}}</text>
  <text x="452" y="334" font-size="10.5" fill="#c0392b">× λ_s = {{lam_s}} (efecto de tamaño): bajaría a φV_c = {{Rd_bruto:tonf}}</text>
  <text x="452" y="356" font-size="10.5" fill="#1a63a8" font-weight="bold">pero 22.5.5.1.1 no obliga a bajar de {{k_piso}}√f'c·b·d:</text>
  <text x="452" y="374" font-size="10.5" fill="#1a63a8" font-weight="bold">φV_c = {{Rd_V1:tonf}} tonf → uso {{u_V1}}</text>
  <text x="452" y="396" font-size="10" fill="#555">El cambio de expresión pone −{{round(caida_expr*100, 1)}} %; el efecto de tamaño,</text>
  <text x="452" y="411" font-size="10" fill="#555">que a secas sería −{{round(caida_lams_bruta*100, 1)}} %, el piso lo deja en −{{round(caida_lams_real*100, 1)}} %.</text>

  <!-- =============== banda de valores =============== -->
  <line x1="60" y1="452" x2="820" y2="452" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="476" font-size="11.5" fill="#333">Demanda a d de la cara: V_u = {{V_u1:tonf}} tonf · capacidad φV_c = {{Rd_V1:tonf}} tonf</text>
  <text x="60" y="496" font-size="11.5" fill="#333">La variable que hace hablar al ejemplo: ρ_w = {{rho_w}} → λ_s = {{lam_s}}, y con esa</text>
  <text x="60" y="512" font-size="11.5" fill="#333">cuantía tan baja la fila (c) cae bajo el piso de la propia tabla.</text>
  <text x="60" y="534" font-size="11.5" fill="#c0392b" font-weight="bold">Gobierna el canto: {{gob_canto}}, uso {{u_canto}} · uso máximo de la hoja: {{u_max}} ({{gobierna}})</text>
</svg>
