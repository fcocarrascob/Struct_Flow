<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="su" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a63a8"/>
    </marker>
    <marker id="vt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="840" height="600" fill="#ffffff"/>
  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Galpón de chancado en el altiplano — presiones de viento NCh432:2025</text>
  <text x="420" y="42" font-size="10.5" text-anchor="middle" fill="#555">zona I-B · V = {{V:m/s}} m/s · {{z_e:m}} msnm · exposición D · K_zt = {{K_zt}} · categoría de ocupación II</text>

  <!-- ================= PANEL A: sección transversal ================= -->
  <text x="40" y="70" font-size="11.5" fill="#1a63a8" font-weight="bold">A · Sección transversal — procedimiento direccional (cl. 6, Ec. 4)</text>

  <!-- viento entrante -->
  <line x1="46" y1="150" x2="96" y2="150" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#vt)"/>
  <line x1="46" y1="200" x2="96" y2="200" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#vt)"/>
  <line x1="46" y1="250" x2="96" y2="250" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#vt)"/>
  <text x="70" y="128" font-size="10.5" text-anchor="middle" fill="#2e7d32" font-weight="bold">viento</text>

  <!-- galpon -->
  <path d="M110,330 L110,150 L230,129 L350,150 L350,330 Z" fill="#f4f7fa" stroke="#333" stroke-width="1.8"/>
  <line x1="230" y1="129" x2="230" y2="330" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4 4"/>
  <!-- suelo -->
  <line x1="80" y1="330" x2="390" y2="330" stroke="#333" stroke-width="2"/>
  <path d="M86,330 l-7,9 M104,330 l-7,9 M122,330 l-7,9 M140,330 l-7,9 M158,330 l-7,9 M176,330 l-7,9 M194,330 l-7,9 M212,330 l-7,9 M230,330 l-7,9 M248,330 l-7,9 M266,330 l-7,9 M284,330 l-7,9 M302,330 l-7,9 M320,330 l-7,9 M338,330 l-7,9 M356,330 l-7,9 M374,330 l-7,9" stroke="#999" stroke-width="0.9"/>

  <!-- perfil de presion en barlovento (qz variable) -->
  <path d="M110,330 L92,330 L74,150 L110,150 Z" fill="#c0392b" fill-opacity="0.13" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="82" y1="158" x2="108" y2="158" stroke="#c0392b" stroke-width="1.6" marker-end="url(#pr)"/>
  <line x1="97" y1="322" x2="108" y2="322" stroke="#c0392b" stroke-width="1.6" marker-end="url(#pr)"/>
  <text x="66" y="150" font-size="9.5" text-anchor="end" fill="#c0392b" font-weight="bold">{{p_bar18:N/m^2}}</text>
  <text x="86" y="326" font-size="9.5" text-anchor="end" fill="#c0392b" font-weight="bold">{{p_bar2:N/m^2}}</text>
  <text x="120" y="243" font-size="9.5" fill="#c0392b" font-weight="bold">barlovento</text>
  <text x="120" y="256" font-size="9" fill="#c0392b">C_p = +0,8 — el único que usa q_z variable</text>

  <!-- succion sotavento -->
  <line x1="356" y1="240" x2="392" y2="240" stroke="#1a63a8" stroke-width="1.8" marker-end="url(#su)"/>
  <text x="398" y="236" font-size="9.5" fill="#1a63a8" font-weight="bold">{{p_sotx:N/m^2}}</text>
  <text x="398" y="249" font-size="9" fill="#1a63a8">sotavento, C_p = −0,5</text>

  <!-- succion techo barlovento -->
  <line x1="168" y1="136" x2="150" y2="100" stroke="#1a63a8" stroke-width="1.8" marker-end="url(#su)"/>
  <text x="146" y="94" font-size="9.5" text-anchor="middle" fill="#1a63a8" font-weight="bold">{{p_tsuc:N/m^2}}</text>
  <text x="150" y="82" font-size="9" text-anchor="middle" fill="#1a63a8">C_p = {{Cp_tsuc}}</text>

  <!-- succion techo sotavento -->
  <line x1="292" y1="136" x2="310" y2="104" stroke="#1a63a8" stroke-width="1.8" marker-end="url(#su)"/>
  <text x="322" y="98" font-size="9.5" text-anchor="middle" fill="#1a63a8" font-weight="bold">{{p_tsot:N/m^2}}</text>

  <!-- presion interna -->
  <line x1="200" y1="250" x2="200" y2="214" stroke="#e08a00" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="262" y1="250" x2="262" y2="214" stroke="#e08a00" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="231" y="268" font-size="9.5" text-anchor="middle" fill="#b36b00" font-weight="bold">p_i = {{p_i:N/m^2}} N/m²</text>
  <text x="231" y="281" font-size="9" text-anchor="middle" fill="#b36b00">(GC_pi) = ±{{GC_pi}} · R_i = {{R_i}}</text>
  <text x="231" y="294" font-size="9" text-anchor="middle" fill="#b36b00">parcialmente cerrado (portón abierto)</text>

  <!-- cotas -->
  <line x1="378" y1="150" x2="378" y2="330" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="384" y="292" font-size="10" fill="#555">h = {{h:m}} m</text>
  <line x1="110" y1="352" x2="350" y2="352" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="230" y="366" font-size="10" text-anchor="middle" fill="#555">B = {{B_t:m}} m · θ = {{theta:deg}}°</text>

  <!-- ================= PANEL B: planta ================= -->
  <text x="470" y="70" font-size="11.5" fill="#1a63a8" font-weight="bold">B · Planta — zonas de borde y fuerza longitudinal</text>

  <rect x="490" y="90" width="300" height="120" fill="#f4f7fa" stroke="#333" stroke-width="1.6"/>
  <line x1="490" y1="150" x2="790" y2="150" stroke="#bbb" stroke-width="0.9" stroke-dasharray="4 4"/>
  <text x="640" y="146" font-size="8.5" text-anchor="middle" fill="#999">cumbrera</text>

  <!-- zonas de borde a -->
  <rect x="490" y="90" width="12" height="120" fill="#c0392b" fill-opacity="0.16" stroke="#c0392b" stroke-width="0.9"/>
  <rect x="778" y="90" width="12" height="120" fill="#c0392b" fill-opacity="0.16" stroke="#c0392b" stroke-width="0.9"/>
  <rect x="490" y="90" width="300" height="12" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b" stroke-width="0.7"/>
  <rect x="490" y="198" width="300" height="12" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b" stroke-width="0.7"/>
  <text x="496" y="228" font-size="9" text-anchor="middle" fill="#c0392b">a = {{a_v:m}} m</text>

  <!-- porton -->
  <rect x="490" y="132" width="6" height="36" fill="#fff" stroke="#e08a00" stroke-width="1.8"/>
  <text x="470" y="154" font-size="9" text-anchor="end" fill="#b36b00">portón</text>
  <text x="470" y="166" font-size="9" text-anchor="end" fill="#b36b00">8 × 8 m</text>

  <!-- marcos -->
  <g stroke="#888" stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="520" y1="90" x2="520" y2="210"/><line x1="550" y1="90" x2="550" y2="210"/>
    <line x1="580" y1="90" x2="580" y2="210"/><line x1="610" y1="90" x2="610" y2="210"/>
    <line x1="640" y1="90" x2="640" y2="210"/><line x1="670" y1="90" x2="670" y2="210"/>
    <line x1="700" y1="90" x2="700" y2="210"/><line x1="730" y1="90" x2="730" y2="210"/>
    <line x1="760" y1="90" x2="760" y2="210"/>
  </g>
  <text x="640" y="228" font-size="9" text-anchor="middle" fill="#666">n = {{n_m}} marcos @ {{s_m:m}} m · L = {{L_t:m}} m</text>

  <!-- fuerza longitudinal -->
  <line x1="446" y1="255" x2="500" y2="255" stroke="#2e7d32" stroke-width="2.6" marker-end="url(#vt)"/>
  <text x="510" y="252" font-size="10.5" fill="#2e7d32" font-weight="bold">F = {{F_longkn}} kN  (Ec. 9 y 10)</text>
  <text x="510" y="266" font-size="9" fill="#2e7d32">K_B = {{K_B}} · K_S = {{K_S}} · Δ(GC_pf) = {{d_gcpf}}</text>
  <text x="510" y="279" font-size="9" fill="#666">K_S es el único blindaje que la norma cuantifica: crece con n</text>
  <text x="446" y="296" font-size="9" fill="#666">sobre el arriostramiento longitudinal, aplicada en el centroide de A_E</text>

  <!-- ================= PANEL C: cadena y resultados ================= -->
  <line x1="40" y1="386" x2="800" y2="386" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="406" font-size="11.5" fill="#1a63a8" font-weight="bold">C · La cadena, y qué manda</text>

  <text x="40" y="428" font-size="10.5" fill="#222">q_h = 0,613 · I · K_h · K_zt · K_e · V²  =  0,613 · {{I_w}} · {{K_h}} · {{K_zt}} · {{K_e}} · {{V:m/s}}²  =  <tspan font-weight="bold" fill="#c0392b">{{q_h:N/m^2}} N/m²</tspan></text>
  <text x="40" y="444" font-size="9.5" fill="#666">K_e = e^(−0,000119 · {{z_e:m}}) = {{K_e}} — a 3 400 msnm el aire pesa un tercio menos, y es el único factor que siempre alivia</text>

  <rect x="40" y="456" width="368" height="120" fill="#fafbfc" stroke="#ddd" stroke-width="1"/>
  <text x="52" y="474" font-size="10" fill="#222" font-weight="bold">SPRFV</text>
  <text x="52" y="491" font-size="9.5" fill="#555">presión neta de muros (transversal)</text>
  <text x="396" y="491" font-size="9.5" text-anchor="end" fill="#222" font-weight="bold">{{p_netax:N/m^2}} N/m²</text>
  <text x="52" y="507" font-size="9.5" fill="#555">succión neta de techo (ext. + interna)</text>
  <text x="396" y="507" font-size="9.5" text-anchor="end" fill="#1a63a8" font-weight="bold">{{p_tneta:N/m^2}} N/m²</text>
  <text x="52" y="523" font-size="9.5" fill="#555">borde de techo 2E (envolvente, cl. 7)</text>
  <text x="396" y="523" font-size="9.5" text-anchor="end" fill="#1a63a8" font-weight="bold">{{p_e2E:N/m^2}} N/m²</text>
  <text x="52" y="539" font-size="9.5" fill="#555">fuerza por marco interior</text>
  <text x="396" y="539" font-size="9.5" text-anchor="end" fill="#222" font-weight="bold">{{F_marcokn}} kN</text>
  <text x="52" y="558" font-size="9" fill="#666">mínimos de 6.1.5: 0,25 kN/m² muros · 0,13 kN/m² techo — los supera el cálculo</text>

  <rect x="432" y="456" width="368" height="120" fill="#fafbfc" stroke="#ddd" stroke-width="1"/>
  <text x="444" y="474" font-size="10" fill="#222" font-weight="bold">Componentes y revestimiento (cl. 9)</text>
  <text x="444" y="491" font-size="9.5" fill="#555">costanera de techo en esquina (Fig. 27 z3)</text>
  <text x="788" y="491" font-size="9.5" text-anchor="end" fill="#c0392b" font-weight="bold">{{p_cost:N/m^2}} N/m²</text>
  <text x="444" y="507" font-size="9.5" fill="#555">revestimiento de muro en esquina (Fig. 24 z5)</text>
  <text x="788" y="507" font-size="9.5" text-anchor="end" fill="#1a63a8" font-weight="bold">{{p_mur:N/m^2}} N/m²</text>
  <text x="444" y="523" font-size="9" fill="#666">área efectiva {{A_ef:m^2}} m² ≠ área tributaria {{A_trib:m^2}} m² (§3.4)</text>
  <text x="444" y="539" font-size="9" fill="#666">Fig. 24 Nota 5: −10 % en muros por θ ≤ 10°</text>
  <text x="444" y="558" font-size="9" fill="#666">cercha: {{A_cercha:m^2}} m² &gt; 65 m² → se permite diseñarla como SPRFV (9.2.3)</text>

  <text x="40" y="592" font-size="10.5" fill="#222">La mayor presión de diseño de la hoja: <tspan font-weight="bold" fill="#c0392b">{{p_max:N/m^2}} N/m²</tspan> — {{manda}}.  Mayorada a LRFD (NCh3171 9.1): × 1,6.</text>
</svg>
