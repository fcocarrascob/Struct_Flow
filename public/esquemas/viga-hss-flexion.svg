<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ld" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M5,10 L0,0 L10,0 z" fill="#5a6b7c"/>
    </marker>
  </defs>
  <rect width="880" height="800" fill="#ffffff"/>
  <text x="440" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Viga de tubo, luz {{L:m}} m, w = {{w:tonf/m}} tonf/m → M_u = {{M_u:tonf*m}} tonf·m: acá el que diseña es el ancho de pared</text>

  <!-- ============ LA VIGA ============ -->
  <text x="40" y="62" font-size="11.5" fill="#222" font-weight="bold">La misma viga del ejemplo LTB, ahora en tubo</text>
  <g stroke="#5a6b7c" stroke-width="1">
    <line x1="80" y1="78" x2="80" y2="94" marker-end="url(#ld)"/><line x1="130" y1="78" x2="130" y2="94" marker-end="url(#ld)"/>
    <line x1="180" y1="78" x2="180" y2="94" marker-end="url(#ld)"/><line x1="230" y1="78" x2="230" y2="94" marker-end="url(#ld)"/>
    <line x1="280" y1="78" x2="280" y2="94" marker-end="url(#ld)"/><line x1="330" y1="78" x2="330" y2="94" marker-end="url(#ld)"/>
    <line x1="380" y1="78" x2="380" y2="94" marker-end="url(#ld)"/>
  </g>
  <text x="398" y="88" font-size="10" fill="#5a6b7c">w</text>
  <rect x="80" y="96" width="300" height="11" fill="#eef2f7" stroke="#333" stroke-width="1.4"/>
  <path d="M80,107 l-9,14 l18,0 z" fill="#fff" stroke="#333"/><path d="M380,107 l-9,14 l18,0 z" fill="#fff" stroke="#333"/>
  <line x1="80" y1="136" x2="380" y2="136" stroke="#555" stroke-width="0.8" marker-start="url(#ard)" marker-end="url(#ard)"/>
  <text x="230" y="151" font-size="10.5" text-anchor="middle" fill="#1c7c3c" font-weight="bold">L_b = L = {{L:m}} m ≤ L_p = {{Lp_A:m}} m</text>
  <text x="230" y="166" font-size="9.5" text-anchor="middle" fill="#888">sin arriostres intermedios · M_u = {{M_u:tonf*m}} tonf·m · V_u = {{V_u:tonf}} tonf</text>

  <!-- ============ CAJA: POR QUÉ NO HAY LTB ============ -->
  <rect x="430" y="48" width="430" height="126" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="444" y="68" font-size="11.5" fill="#222" font-weight="bold">Por qué en el tubo cuadrado el LTB deja de mandar</text>
  <text x="444" y="88" font-size="10.5" fill="#333">• Sección cerrada: J = {{raz_J}} veces el de la W460×74 del ejemplo hermano.</text>
  <text x="444" y="106" font-size="10.5" fill="#333">• Ec. F7-10: L_p = {{Lp_A:m}} m, más largo que el vano → F7.4(a): no aplica.</text>
  <text x="444" y="124" font-size="10.5" fill="#333">• Es {{raz_lp}} veces el L_p = 1,78 m de la W460×74, que fallaba por volcarse.</text>
  <text x="444" y="142" font-size="10.5" fill="#333">• Ec. F7-11: L_r = {{Lr_A:m}} m. Perder el 10 % de M_p pide L_b = {{Lb10:m}} m.</text>
  <text x="444" y="163" font-size="10" fill="#888">El User Note de F7.4 lo dice en palabras: en sección cuadrada no ocurre.</text>

  <!-- ============ LAS CINCO SECCIONES, A ESCALA ============ -->
  <text x="40" y="200" font-size="11.5" fill="#222" font-weight="bold">Las cinco secciones a escala. El ala comprimida es la de arriba, y su λ = (B − 3t)/t decide la rama de F7.2</text>
  <line x1="40" y1="371" x2="700" y2="371" stroke="#ccc" stroke-width="1"/>

  <!-- A · □250×250×10 -->
  <text x="103" y="{{370 - H_A*esc - 9:svg}}" font-size="10" text-anchor="middle" fill="#1c7c3c" font-weight="bold">□250×250×10</text>
  <rect x="60" y="{{370 - H_A*esc:svg}}" width="{{B_A*esc:svg}}" height="{{H_A*esc:svg}}" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.2"/>
  <rect x="{{60 + t_A*esc:svg}}" y="{{370 - (H_A - t_A)*esc:svg}}" width="{{(B_A - 2*t_A)*esc:svg}}" height="{{(H_A - 2*t_A)*esc:svg}}" fill="#ffffff" stroke="#1c7c3c" stroke-width="0.7"/>
  <text x="103" y="388" font-size="10" text-anchor="middle" fill="#333">λ = {{lambda_fA}}</text>
  <text x="103" y="402" font-size="10" text-anchor="middle" fill="#1c7c3c" font-weight="bold">compacta</text>
  <text x="103" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ec. F7-1</text>
  <text x="103" y="430" font-size="9.5" text-anchor="middle" fill="#888">{{m_A:kg/m}} kg/m</text>

  <!-- B · □250×250×8 -->
  <text x="238" y="{{370 - H_B*esc - 9:svg}}" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">□250×250×8</text>
  <rect x="195" y="{{370 - H_B*esc:svg}}" width="{{B_B*esc:svg}}" height="{{H_B*esc:svg}}" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="{{195 + t_B*esc:svg}}" y="{{370 - (H_B - t_B)*esc:svg}}" width="{{(B_B - 2*t_B)*esc:svg}}" height="{{(H_B - 2*t_B)*esc:svg}}" fill="#ffffff" stroke="#c0392b" stroke-width="0.7"/>
  <text x="238" y="388" font-size="10" text-anchor="middle" fill="#333">λ = {{lambda_fB}}</text>
  <text x="238" y="402" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">no compacta</text>
  <text x="238" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ec. F7-2</text>
  <text x="238" y="430" font-size="9.5" text-anchor="middle" fill="#888">{{m_B:kg/m}} kg/m</text>

  <!-- C · □250×250×6 -->
  <text x="373" y="{{370 - H_C*esc - 9:svg}}" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">□250×250×6</text>
  <rect x="330" y="{{370 - H_C*esc:svg}}" width="{{B_C*esc:svg}}" height="{{H_C*esc:svg}}" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="{{330 + t_C*esc:svg}}" y="{{370 - (H_C - t_C)*esc:svg}}" width="{{(B_C - 2*t_C)*esc:svg}}" height="{{(H_C - 2*t_C)*esc:svg}}" fill="#ffffff" stroke="#c0392b" stroke-width="0.7"/>
  <text x="373" y="388" font-size="10" text-anchor="middle" fill="#333">λ = {{lambda_fC}}</text>
  <text x="373" y="402" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">esbelta</text>
  <text x="373" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ecs. F7-4 y F7-3</text>
  <text x="373" y="430" font-size="9.5" text-anchor="middle" fill="#888">{{m_C:kg/m}} kg/m</text>

  <!-- D · □300×200×6 -->
  <text x="505" y="{{370 - H_D*esc - 9:svg}}" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">□300×200×6</text>
  <rect x="470" y="{{370 - H_D*esc:svg}}" width="{{B_D*esc:svg}}" height="{{H_D*esc:svg}}" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="{{470 + t_D*esc:svg}}" y="{{370 - (H_D - t_D)*esc:svg}}" width="{{(B_D - 2*t_D)*esc:svg}}" height="{{(H_D - 2*t_D)*esc:svg}}" fill="#ffffff" stroke="#c0392b" stroke-width="0.7"/>
  <text x="505" y="388" font-size="10" text-anchor="middle" fill="#333">λ = {{lambda_fD}}</text>
  <text x="505" y="402" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">no compacta</text>
  <text x="505" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ec. F7-2</text>
  <text x="505" y="430" font-size="9.5" text-anchor="middle" fill="#888">{{m_D:kg/m}} kg/m</text>

  <!-- E · □400×200×6 -->
  <text x="635" y="{{370 - H_E*esc - 9:svg}}" font-size="10" text-anchor="middle" fill="#1c7c3c" font-weight="bold">□400×200×6</text>
  <rect x="600" y="{{370 - H_E*esc:svg}}" width="{{B_E*esc:svg}}" height="{{H_E*esc:svg}}" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.2"/>
  <rect x="{{600 + t_E*esc:svg}}" y="{{370 - (H_E - t_E)*esc:svg}}" width="{{(B_E - 2*t_E)*esc:svg}}" height="{{(H_E - 2*t_E)*esc:svg}}" fill="#ffffff" stroke="#1c7c3c" stroke-width="0.7"/>
  <text x="635" y="388" font-size="10" text-anchor="middle" fill="#333">λ = {{lambda_fE}}</text>
  <text x="635" y="402" font-size="10" text-anchor="middle" fill="#1c7c3c" font-weight="bold">no compacta</text>
  <text x="635" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ecs. F7-2 y F7-6</text>
  <text x="635" y="430" font-size="9.5" text-anchor="middle" fill="#888">{{m_E:kg/m}} kg/m</text>

  <text x="712" y="252" font-size="10" fill="#888">Los tres primeros son</text>
  <text x="712" y="266" font-size="10" fill="#888">el mismo contorno con</text>
  <text x="712" y="280" font-size="10" fill="#888">10, 8 y 6 mm de pared.</text>
  <text x="712" y="302" font-size="10" fill="#888">D tiene EXACTAMENTE</text>
  <text x="712" y="316" font-size="10" fill="#888">la misma área que C:</text>
  <text x="712" y="330" font-size="10" fill="#888">{{A_gC:cm^2}} cm², repartida</text>
  <text x="712" y="344" font-size="10" fill="#888">de otra manera.</text>

  <!-- ============ DETALLE: EL ANCHO EFECTIVO DEL CASO C ============ -->
  <text x="40" y="466" font-size="11.5" fill="#222" font-weight="bold">Detalle · Ec. F7-4: qué parte del ala comprimida del □250×250×6 sigue trabajando</text>
  <rect x="60" y="480" width="{{b_C*escd:svg}}" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="60" y="480" width="{{be_C*escd/2:svg}}" height="24" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.2"/>
  <rect x="{{60 + (b_C - be_C/2)*escd:svg}}" y="480" width="{{be_C*escd/2:svg}}" height="24" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.2"/>
  <text x="{{60 + be_C*escd/4:svg}}" y="497" font-size="9.5" text-anchor="middle" fill="#1c7c3c">b_e/2 efectivo</text>
  <text x="{{60 + b_C*escd/2:svg}}" y="497" font-size="9" text-anchor="middle" fill="#c0392b">{{b_C - be_C:cm}} cm</text>
  <text x="{{60 + (b_C - be_C/4)*escd:svg}}" y="497" font-size="9.5" text-anchor="middle" fill="#1c7c3c">b_e/2 efectivo</text>
  <text x="60" y="521" font-size="10" fill="#888">ancho plano b = {{b_C:cm}} cm (§B4.1b(d): B − 3t) → b_e = {{be_C:cm}} cm, un {{pbe_C}} % menos.</text>
  <text x="60" y="536" font-size="10" fill="#888">Lo inefectivo es la franja del medio; las esquinas son el apoyo del elemento y siguen trabajando.</text>
  <text x="600" y="480" font-size="10" fill="#333">Al perder ala arriba, el</text>
  <text x="600" y="495" font-size="10" fill="#333">centroide baja {{abs(ybar_C):cm}} cm y la</text>
  <text x="600" y="510" font-size="10" fill="#333">fibra comprimida se aleja:</text>
  <text x="600" y="525" font-size="10" fill="#333">S_e = {{S_eC:cm^3}} cm³ contra los</text>
  <text x="600" y="540" font-size="10" fill="#333">S_x = {{S_xC:cm^3}} cm³ brutos, {{pse_C}} % menos.</text>

  <!-- ============ BARRAS φM_n ============ -->
  <text x="40" y="574" font-size="11.5" fill="#222" font-weight="bold">φM_n contra M_u = {{M_u:tonf*m}} tonf·m — el contorno punteado es el φM_p que F7 no deja usar</text>
  <line x1="610" y1="584" x2="610" y2="702" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="610" y="718" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">M_u = {{M_u:tonf*m}}</text>
  <line x1="250" y1="584" x2="250" y2="702" stroke="#333" stroke-width="1"/>

  <rect x="250" y="588" width="{{phi*M_pA*escM:svg}}" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="588" width="{{Rd_A*escM:svg}}" height="16" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.3"/>
  <text x="245" y="600" font-size="10" text-anchor="end" fill="#333">A □250×250×10</text>
  <text x="855" y="600" font-size="10" text-anchor="end" fill="#1c7c3c" font-weight="bold">{{Rd_A:tonf*m}} → uso {{round(u_A,2)}} ✓</text>

  <rect x="250" y="611" width="{{phi*M_pB*escM:svg}}" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="611" width="{{Rd_B*escM:svg}}" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="245" y="623" font-size="10" text-anchor="end" fill="#333">B □250×250×8</text>
  <text x="855" y="623" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">{{Rd_B:tonf*m}} → uso {{round(u_B,2)}} ✗</text>

  <rect x="250" y="634" width="{{phi*M_pC*escM:svg}}" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="634" width="{{Rd_C*escM:svg}}" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="245" y="646" font-size="10" text-anchor="end" fill="#333">C □250×250×6</text>
  <text x="855" y="646" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">{{Rd_C:tonf*m}} → uso {{round(u_C,2)}} ✗</text>

  <rect x="250" y="657" width="{{phi*M_pD*escM:svg}}" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="657" width="{{Rd_D*escM:svg}}" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="245" y="669" font-size="10" text-anchor="end" fill="#333">D □300×200×6</text>
  <text x="855" y="669" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">{{Rd_D:tonf*m}} → uso {{round(u_D,2)}} ✗</text>

  <rect x="250" y="680" width="{{phi*M_pE*escM:svg}}" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="680" width="{{Rd_E*escM:svg}}" height="16" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.8"/>
  <text x="245" y="692" font-size="10" text-anchor="end" fill="#333">E □400×200×6</text>
  <text x="855" y="692" font-size="10" text-anchor="end" fill="#1c7c3c" font-weight="bold">{{Rd_E:tonf*m}} → uso {{round(u_E,2)}} ✓</text>

  <!-- =============== BANDA DE VALORES =============== -->
  <line x1="40" y1="732" x2="840" y2="732" stroke="#d5dbe2" stroke-width="1"/>
  <text x="40" y="750" font-size="11" fill="#333">Demanda M_u = {{M_u:tonf*m}} tonf·m y V_u = {{V_u:tonf}} tonf sobre {{L:m}} m · A500 Gr. C, pared de diseño 0,93·t_nominal (B4.2).</text>
  <text x="40" y="768" font-size="11" fill="#333">El LTB de F7.4 no gobierna en ninguna de las cinco: lo que decide es λ contra la Tabla B4.1b caso 17.</text>
  <text x="40" y="786" font-size="11" fill="#1c7c3c" font-weight="bold">Gobierna en □400×200×6: {{gobierna}} → φM_n = {{Rd_E:tonf*m}} tonf·m, uso {{round(u_E,2)}}, con {{m_E:kg/m}} kg/m.</text>
</svg>
