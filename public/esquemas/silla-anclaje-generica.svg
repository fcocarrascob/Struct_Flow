<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="system-ui, sans-serif">
  <!-- Esquema paramétrico de `silla-anclaje-generica`: elevación lateral con el
       camino de carga (perno → chapa superior → nervio → ala) y planta del ala
       extendida con la fila de pernos. -->

  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Silla de anclaje — elevación lateral y planta del ala a escala</text>

  <!-- =============== ELEVACIÓN =============== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">ELEVACIÓN · el camino de carga</text>

  <defs>
    <!-- Trama del mortero de nivelación: sin ella, placa y mortero eran dos
         bandas grises iguales y el brazo que la llave entrega no se leía. -->
    <pattern id="silla-mortero" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e6dcc6"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a9997e" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Mortero y placa base: acero gris, mortero tramado -->
  <rect x="{{ex(-L_bp/2):svg}}" y="{{ey(0 mm):svg}}" width="{{L_bp/(1 mm)*esc:svg}}" height="{{max(2, t_bp/(1 mm)*esc):svg}}" fill="#9aa3ab"/>
  <rect x="{{ex(-L_bp/2):svg}}" y="{{ey(t_bp):svg}}" width="{{L_bp/(1 mm)*esc:svg}}" height="{{max(3, t_mort/(1 mm)*esc):svg}}" fill="url(#silla-mortero)" stroke="#a9997e" stroke-width="0.8"/>
  <text x="{{ex(L_bp/2) + 8:svg}}" y="{{ey(t_bp/2) + 4:svg}}" font-size="9.5" fill="#6d757d">placa base {{t_bp:mm}} mm</text>
  <text x="{{ex(L_bp/2) + 8:svg}}" y="{{ey(t_bp + t_mort) + 4:svg}}" font-size="9.5" fill="#8a7a5e">mortero {{t_mort:mm}} mm</text>

  <!-- Ala de la columna (en corte) y alma -->
  <rect x="{{ex(-COL_B/2):svg}}" y="{{ey(-NER_H - CH_T - 60 mm):svg}}" width="{{COL_B/(1 mm)*esc:svg}}" height="{{max(2, COL_TF/(1 mm)*esc):svg}}" fill="{{col_ala}}"/>
  <rect x="{{ex(-COL_TW/2):svg}}" y="{{ey(-NER_H - CH_T - 60 mm):svg}}" width="{{max(1.5, COL_TW/(1 mm)*esc):svg}}" height="{{(NER_H + CH_T + 60 mm)/(1 mm)*esc:svg}}" fill="#c9ced3"/>

  <!-- Nervio: proyección NER_L desde la cara del ala, altura NER_H -->
  <rect x="{{ex(COL_B/2):svg}}" y="{{ey(-NER_H):svg}}" width="{{NER_L/(1 mm)*esc:svg}}" height="{{NER_H/(1 mm)*esc:svg}}"
        fill="{{col_nervio}}" fill-opacity="0.25" stroke="{{col_nervio}}" stroke-width="1.4"/>
  <rect x="{{ex(-COL_B/2 - NER_L):svg}}" y="{{ey(-NER_H):svg}}" width="{{NER_L/(1 mm)*esc:svg}}" height="{{NER_H/(1 mm)*esc:svg}}"
        fill="{{col_nervio}}" fill-opacity="0.25" stroke="{{col_nervio}}" stroke-width="1.4"/>

  <!-- Chapa superior de la silla -->
  <rect x="{{ex(COL_B/2):svg}}" y="{{ey(-NER_H - CH_T):svg}}" width="{{CH_L/(1 mm)*esc:svg}}" height="{{max(2, CH_T/(1 mm)*esc):svg}}" fill="{{col_chapa}}"/>
  <rect x="{{ex(-COL_B/2 - CH_L):svg}}" y="{{ey(-NER_H - CH_T):svg}}" width="{{CH_L/(1 mm)*esc:svg}}" height="{{max(2, CH_T/(1 mm)*esc):svg}}" fill="{{col_chapa}}"/>

  <!-- Perno: del amarre en la chapa superior hacia abajo, a y_fila del eje -->
  <line x1="{{ex(y_fila):svg}}" x2="{{ex(y_fila):svg}}" y1="{{ey(-NER_H - CH_T):svg}}" y2="{{ey(t_bp + t_mort + 90 mm):svg}}" stroke="#1a63a8" stroke-width="2.4"/>
  <line x1="{{ex(-y_fila):svg}}" x2="{{ex(-y_fila):svg}}" y1="{{ey(-NER_H - CH_T):svg}}" y2="{{ey(t_bp + t_mort + 90 mm):svg}}" stroke="#1a63a8" stroke-width="2.4"/>
  <line x1="{{ex(y_fila) - 8:svg}}" x2="{{ex(y_fila) + 8:svg}}" y1="{{ey(-NER_H - CH_T) - 5:svg}}" y2="{{ey(-NER_H - CH_T) - 5:svg}}" stroke="#1a63a8" stroke-width="4"/>
  <line x1="{{ex(-y_fila) - 8:svg}}" x2="{{ex(-y_fila) + 8:svg}}" y1="{{ey(-NER_H - CH_T) - 5:svg}}" y2="{{ey(-NER_H - CH_T) - 5:svg}}" stroke="#1a63a8" stroke-width="4"/>
  <text x="{{ex(y_fila) + 12:svg}}" y="{{ey(-NER_H - CH_T) - 10:svg}}" font-size="10" fill="#1a63a8">P por perno = {{P_perno:kN}} kN</text>
  <!-- La cota va bajo el perno IZQUIERDO: a la derecha tocaba «placa + mortero» -->
  <text x="{{ex(-y_fila):svg}}" y="{{ey(t_bp + t_mort + 90 mm) + 16:svg}}" font-size="10" text-anchor="middle" fill="#555">y_fila = {{y_fila:mm}} mm</text>

  <!-- Cotas de la silla -->
  <text x="{{ex(COL_B/2 + NER_L) + 8:svg}}" y="{{ey(-NER_H - CH_T) + 4:svg}}" font-size="10" fill="{{col_chapa}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">chapa {{CH_T:mm}} mm (exige {{t_chapa_req:mm}})</text>
  <text x="{{ex(COL_B/2 + NER_L) + 8:svg}}" y="{{ey(-NER_H/2) + 4:svg}}" font-size="10" fill="{{col_nervio}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">nervio {{NER_H:mm}} × {{NER_L:mm}} × {{NER_T:mm}} · cordón ø{{w_sold:mm}}</text>
  <text x="{{ex(-COL_B/2 - NER_L):svg}}" y="{{ey(-NER_H - CH_T - 70 mm):svg}}" font-size="10" fill="{{col_ala}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">ala {{COL_B:mm}} × {{COL_TF:mm}} mm</text>

  <!-- =============== PLANTA =============== -->
  <text x="40" y="{{py(-ALA_EXT/2) - 16:svg}}" font-size="12" fill="#555" font-weight="bold">PLANTA DEL ALA</text>

  <!-- Ala extendida y ala original -->
  <rect x="{{px(-CH_L - COL_B/2):svg}}" y="{{py(-ALA_EXT/2):svg}}" width="{{(2*CH_L + COL_B)/(1 mm)*esc:svg}}" height="{{ALA_EXT/(1 mm)*esc:svg}}"
        fill="{{col_ala}}" fill-opacity="0.10" stroke="{{col_ala}}" stroke-width="1.2"/>
  <line x1="{{px(-CH_L - COL_B/2):svg}}" x2="{{px(CH_L + COL_B/2):svg}}" y1="{{py(-COL_B/2):svg}}" y2="{{py(-COL_B/2):svg}}" stroke="#888" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="{{px(-CH_L - COL_B/2):svg}}" x2="{{px(CH_L + COL_B/2):svg}}" y1="{{py(COL_B/2):svg}}" y2="{{py(COL_B/2):svg}}" stroke="#888" stroke-width="1" stroke-dasharray="5 3"/>

  <!-- Alma, en planta -->
  <rect x="{{px(-COL_TW/2):svg}}" y="{{py(-ALA_EXT/2):svg}}" width="{{max(1.5, COL_TW/(1 mm)*esc):svg}}" height="{{ALA_EXT/(1 mm)*esc:svg}}" fill="#c9ced3"/>

  <!-- Chapa superior de la silla, en planta -->
  <rect x="{{px(COL_B/2):svg}}" y="{{py(-CH_B/2):svg}}" width="{{CH_L/(1 mm)*esc:svg}}" height="{{CH_B/(1 mm)*esc:svg}}"
        fill="none" stroke="{{col_chapa}}" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Cotas de planta -->
  <text x="{{px(0 mm):svg}}" y="{{py(ALA_EXT/2) + 16:svg}}" font-size="10" text-anchor="middle" fill="{{col_ala}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">ala extendida {{ALA_EXT:mm}} mm · junta a tope a {{ext_ancho:mm}} mm de cada lado</text>
  <text x="{{px(CH_L + COL_B/2) + 8:svg}}" y="{{py(-CH_B/2) + 10:svg}}" font-size="10" fill="{{col_chapa}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">chapa superior {{CH_B:mm}} × {{CH_L:mm}} mm</text>
  <text x="{{px(CH_L + COL_B/2) + 8:svg}}" y="{{py(0 mm):svg}}" font-size="10" fill="{{col_rig}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">rigidizador {{rig_ancho:mm}} × {{RIG_T:mm}} mm · b/t = {{bt_rig}}</text>

  <!-- =============== COLUMNA DE RESULTADOS =============== -->
  <line x1="600" y1="60" x2="600" y2="520" stroke="#ddd" stroke-width="1"/>
  <text x="620" y="66" font-size="11.5" fill="#222" font-weight="bold">El camino de carga</text>

  <text x="620" y="92" font-size="10.5" fill="#333">Chapa superior</text>
  <text x="830" y="92" font-size="10.5" text-anchor="end" fill="{{cu(u_chapa)}}" font-weight="bold">{{u_chapa}}</text>
  <text x="620" y="112" font-size="10.5" fill="#333">Corte del nervio</text>
  <text x="830" y="112" font-size="10.5" text-anchor="end" fill="{{cu(u_ner)}}" font-weight="bold">{{u_ner}}</text>
  <text x="620" y="132" font-size="10.5" fill="#333">Soldadura en L</text>
  <text x="830" y="132" font-size="10.5" text-anchor="end" fill="{{cu(u_sold)}}" font-weight="bold">{{u_sold}}</text>
  <text x="620" y="152" font-size="10.5" fill="#333">Junta a tope de la extensión</text>
  <text x="830" y="152" font-size="10.5" text-anchor="end" fill="{{cu(u_ext)}}" font-weight="bold">{{u_ext}}</text>
  <text x="620" y="172" font-size="10.5" fill="#333">Ala a tracción</text>
  <text x="830" y="172" font-size="10.5" text-anchor="end" fill="{{cu(u_ala)}}" font-weight="bold">{{u_ala}}</text>
  <text x="620" y="192" font-size="10.5" fill="#333">Esbeltez del rigidizador</text>
  <text x="830" y="192" font-size="10.5" text-anchor="end" fill="{{cu(u_rig)}}" font-weight="bold">{{u_rig}}</text>

  <text x="620" y="226" font-size="11.5" fill="#222" font-weight="bold">Rigidizador · §J10.8</text>
  <text x="620" y="248" font-size="10" fill="#555">(a) ancho + t_w/2 ≥ CH_B/3</text>
  <text x="830" y="248" font-size="10" text-anchor="end" fill="#333">{{v_rig1}}</text>
  <text x="620" y="266" font-size="10" fill="#555">(b) t ≥ t_f/2 y ≥ CH_T/2</text>
  <text x="830" y="266" font-size="10" text-anchor="end" fill="#333">{{v_rig2a and v_rig2b}}</text>
  <text x="620" y="284" font-size="10" fill="#555">(b) t ≥ ancho/16</text>
  <text x="830" y="284" font-size="10" text-anchor="end" fill="#333">{{v_rig3}}</text>
  <text x="620" y="302" font-size="10" fill="#555">(c) extensión ≥ media altura</text>
  <text x="830" y="302" font-size="10" text-anchor="end" fill="#333">{{v_rig_largo}}</text>

  <text x="620" y="336" font-size="11.5" fill="#222" font-weight="bold">Hipótesis y coherencia</text>
  <text x="620" y="358" font-size="10" fill="#555">ancho eficaz b_eff = {{b_eff:mm}} mm</text>
  <text x="620" y="376" font-size="10" fill="#555">reparto: {{frac_nervio}} perno(s) por nervio</text>
  <text x="620" y="394" font-size="10" fill="#555">la chapa cubre el nervio</text>
  <text x="830" y="394" font-size="10" text-anchor="end" fill="#333">{{v_chapa_cubre}}</text>
  <text x="620" y="412" font-size="10" fill="#555">rotación de la base θ = {{theta_base}}</text>

  <!-- Franja de cierre -->
  <rect x="612" y="452" width="218" height="62" rx="4" fill="{{col_global}}" fill-opacity="0.10" stroke="{{col_global}}" stroke-width="1"/>
  <text x="622" y="470" font-size="9.5" fill="#777">Gobierna</text>
  <text x="622" y="486" font-size="9" fill="#333">{{gobierna}}</text>
  <text x="622" y="505" font-size="12" fill="{{col_global}}" font-weight="bold">u_max = {{u_max}}</text>
</svg>
