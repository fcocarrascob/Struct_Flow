<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="vr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c07a00"/>
    </marker>
    <pattern id="grout" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b9a06a" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>
  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El pedestal según NCh2369: el hormigón no se diseña para la carga, se diseña para el perno</text>

  <!-- =============== PANEL A: sección del pedestal detallado =============== -->
  <text x="40" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Sección del pedestal (2 px/cm)</text>

  <!-- columna de acero -->
  <rect x="190" y="62" width="40" height="41" fill="#dfe5ec" stroke="#333" stroke-width="1.3"/>
  <text x="238" y="78" font-size="9" fill="#8a94a3">columna de acero</text>
  <!-- placa base 60 cm -->
  <rect x="150" y="103" width="120" height="7" fill="#c8d2de" stroke="#333" stroke-width="1.2"/>
  <!-- mortero de nivelación -->
  <rect x="150" y="110" width="120" height="10" fill="url(#grout)" stroke="#8a7a4a" stroke-width="0.9"/>

  <!-- pedestal -->
  <rect x="110" y="120" width="200" height="240" fill="#f4f7fb" stroke="#333" stroke-width="1.6"/>
  <!-- zona de protección superior (9.5.3) -->
  <rect x="110" y="120" width="200" height="200" fill="#1a63a8" opacity="0.07"/>
  <line x1="110" y1="320" x2="310" y2="320" stroke="#1a63a8" stroke-width="1.3" stroke-dasharray="7 4"/>
  <!-- zapata -->
  <rect x="70" y="360" width="280" height="26" fill="#e8ecf2" stroke="#333" stroke-width="1.2"/>

  <!-- armadura de anclaje (4 barras en el plano de la sección) -->
  <g stroke="#2c7a4b" stroke-width="2.1" fill="none">
    <path d="M126 132 q0 -8 8 -8 l8 0"/><line x1="126" y1="132" x2="126" y2="374"/>
    <path d="M144 132 q0 -8 -8 -8 l-8 0"/><line x1="144" y1="132" x2="144" y2="374"/>
    <path d="M276 132 q0 -8 8 -8 l8 0"/><line x1="276" y1="132" x2="276" y2="374"/>
    <path d="M294 132 q0 -8 -8 -8 l-8 0"/><line x1="294" y1="132" x2="294" y2="374"/>
  </g>

  <!-- llave de corte: 30 cm de ancho, 15 cm embebidos + 5 de mortero -->
  <rect x="180" y="110" width="60" height="40" fill="#e0a53a" stroke="#8a5c00" stroke-width="1.1"/>
  <!-- plano a 45° desde el pie de la llave hasta la cara (criterio b de 9.5.3) -->
  <line x1="180" y1="150" x2="110" y2="220" stroke="#1a63a8" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- pernos de anclaje con plancha de cabeza -->
  <g stroke="#333" stroke-width="2.6">
    <line x1="160" y1="96" x2="160" y2="200"/>
    <line x1="260" y1="96" x2="260" y2="200"/>
  </g>
  <g fill="#8a2f24">
    <rect x="152" y="198" width="16" height="5"/>
    <rect x="252" y="198" width="16" height="5"/>
  </g>
  <g fill="#333">
    <rect x="154" y="97" width="12" height="6"/>
    <rect x="254" y="97" width="12" height="6"/>
  </g>

  <!-- estribos (por delante de todo): 5,0 | 11,2 | 17,4 | 23,6 | 43,6 | 63,6 | 83,6 | 100 cm -->
  <g stroke="#c0392b" stroke-width="1.9">
    <line x1="118" y1="130.0" x2="302" y2="130.0"/>
    <line x1="118" y1="142.4" x2="302" y2="142.4"/>
    <line x1="118" y1="154.8" x2="302" y2="154.8"/>
    <line x1="118" y1="167.2" x2="302" y2="167.2"/>
    <line x1="118" y1="207.2" x2="302" y2="207.2"/>
    <line x1="118" y1="247.2" x2="302" y2="247.2"/>
    <line x1="118" y1="287.2" x2="302" y2="287.2"/>
    <line x1="118" y1="320.0" x2="302" y2="320.0"/>
  </g>

  <!-- corte aplicado -->
  <line x1="286" y1="106" x2="330" y2="106" stroke="#c07a00" stroke-width="2.4" marker-end="url(#vr)"/>
  <text x="286" y="98" font-size="10" fill="#c07a00" font-weight="bold">V = {{V_d:tonf}} tonf</text>

  <!-- cotas -->
  <line x1="326" y1="120" x2="326" y2="320" stroke="#1a63a8" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="332" y="212" font-size="9.5" fill="#1a63a8">zona de protección</text>
  <text x="332" y="225" font-size="9.5" fill="#1a63a8">{{zp:cm}} cm</text>
  <line x1="392" y1="120" x2="392" y2="360" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="386" y="244" font-size="9.5" text-anchor="end" fill="#555">h = {{h_p:cm}}</text>
  <line x1="110" y1="398" x2="310" y2="398" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="210" y="412" font-size="10" text-anchor="middle" fill="#555">b = {{b_p:cm}} cm (lado menor)</text>
  <line x1="172" y1="120" x2="172" y2="200" stroke="#8a2f24" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="178" y="188" font-size="9" fill="#8a2f24">h_ef = {{h_ef:cm}}</text>

  <!-- leyenda del panel A -->
  <g font-size="9.5">
    <rect x="40" y="424" width="14" height="7" fill="#e0a53a" stroke="#8a5c00" stroke-width="0.9"/>
    <text x="60" y="431" fill="#333">llave de corte 300 × 30 mm, {{h_sl:cm}} cm embebidos (8.5.3)</text>
    <line x1="40" y1="441" x2="54" y2="441" stroke="#c0392b" stroke-width="1.9"/>
    <text x="60" y="445" fill="#333">estribos φ12: tres a {{s_libre:cm}} cm libres ({{s_eje:cm}} entre ejes) y el resto a {{s_zp:cm}} cm</text>
    <line x1="40" y1="455" x2="54" y2="455" stroke="#2c7a4b" stroke-width="2.1"/>
    <text x="60" y="459" fill="#333">armadura de anclaje {{n_bar}}φ16 = {{A_sprov:cm^2}} cm² (17.5.2.1)</text>
    <line x1="40" y1="469" x2="54" y2="469" stroke="#1a63a8" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="60" y="473" fill="#333">plano a 45° desde el pie de la llave: criterio (b) de 9.5.3 = {{zp_b:cm}} cm, no gobierna</text>
  </g>

  <!-- =============== PANEL B: los dos niveles de carga =============== -->
  <text x="430" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Los dos niveles de carga de 4.5 (0,9·D + SA + E)</text>

  <g font-size="10">
    <text x="436" y="72" fill="#555">estado</text>
    <text x="668" y="72" text-anchor="end" fill="#555">P</text>
    <text x="730" y="72" text-anchor="end" fill="#555">V</text>
    <text x="806" y="72" text-anchor="end" fill="#555">T por perno</text>
    <line x1="430" y1="78" x2="810" y2="78" stroke="#ccc"/>
    <text x="436" y="94" fill="#333">E sin amplificar (8.5.2 vía a)</text>
    <text x="668" y="94" text-anchor="end" fill="#333">{{P_A:tonf}}</text>
    <text x="730" y="94" text-anchor="end" fill="#333">{{V_A:tonf}}</text>
    <text x="806" y="94" text-anchor="end" fill="#333">{{Ti_A:tonf}}</text>
    <text x="436" y="112" fill="#c0392b">E × 0,7R₁ = {{amp}} (todo lo demás)</text>
    <text x="668" y="112" text-anchor="end" fill="#c0392b">{{P_B:tonf}}</text>
    <text x="730" y="112" text-anchor="end" fill="#c0392b">{{V_B:tonf}}</text>
    <text x="806" y="112" text-anchor="end" fill="#c0392b" font-weight="bold">{{Ti_B:tonf}}</text>
    <text x="436" y="126" font-size="8.5" fill="#888">tonf y tonf·m; M pasa de {{M_A:tonf*m}} a {{M_B:tonf*m}} tonf·m</text>
  </g>
  <text x="430" y="146" font-size="10" fill="#c0392b">Amplificar el sismo {{amp}} veces multiplica la tracción del perno por {{factor_T}}: el peso</text>
  <text x="430" y="159" font-size="10" fill="#c0392b">estabilizador de 0,9·D no se amplifica, y el perno toma el desbalance entero.</text>

  <!-- lista de verificaciones -->
  <text x="430" y="186" font-size="11.5" fill="#1a63a8" font-weight="bold">Demanda vs. capacidad del diseño adoptado</text>
  <g font-size="10.5">
    <text x="436" y="207" fill="#333">Perno en tracción (8.5.2 vía a)</text>
    <text x="806" y="207" text-anchor="end" fill="#555">{{Ti_A:tonf}} / {{Rd_Nsa:tonf}} tonf → {{u_pa}}</text>
    <text x="436" y="226" fill="#333">Llave: aplastamiento (17.11.2)</text>
    <text x="806" y="226" text-anchor="end" fill="#555">{{V_d:tonf}} / {{Rd_brg:tonf}} tonf → {{u_brg}}</text>
    <text x="436" y="245" fill="#c0392b" font-weight="bold">Llave: breakout (17.11.3)</text>
    <text x="806" y="245" text-anchor="end" fill="#c0392b" font-weight="bold">{{V_d:tonf}} / {{Rd_cbsl:tonf}} tonf → {{u_cbsl}} ◄</text>
    <text x="436" y="264" fill="#333">Llave: flexión de la plancha</text>
    <text x="806" y="264" text-anchor="end" fill="#555">{{M_usl:tonf*cm}} / {{Rd_Msl:tonf*cm}} tonf·cm → {{u_Msl}}</text>
    <text x="436" y="283" fill="#333">Pullout con plancha de cabeza</text>
    <text x="806" y="283" text-anchor="end" fill="#555">{{D_ACIi:tonf}} / {{N_pnp:tonf}} tonf → {{u_popA}}</text>
    <text x="436" y="302" fill="#333">Armadura de anclaje (17.5.2.1)</text>
    <text x="806" y="302" text-anchor="end" fill="#555">{{A_sreq:cm^2}} / {{A_sprov:cm^2}} cm² → {{u_arm}}</text>
  </g>

  <!-- el giro: el hormigón se diseña para el perno -->
  <text x="430" y="332" font-size="11.5" fill="#1a63a8" font-weight="bold">El hormigón se diseña para el perno (9.5.2 · ACI 17.10.5.3)</text>
  <g font-size="10.5">
    <text x="436" y="353" fill="#333">Demanda del grupo con 0,7R₁</text>
    <text x="806" y="353" text-anchor="end" fill="#555">{{Tg_B:tonf}} tonf</text>
    <text x="436" y="372" fill="#333">Capacidad esperada (8.3.1) ← el techo</text>
    <text x="806" y="372" text-anchor="end" fill="#555">2 × {{T_ye:tonf}} = {{T_yeg:tonf}} tonf</text>
    <text x="436" y="391" fill="#333">1,2 · N_sa · 2 (ACI 17.10.5.3(a))</text>
    <text x="806" y="391" text-anchor="end" fill="#555">{{D_ACI:tonf}} tonf = {{veces_ACI}} × la demanda de ACI</text>
    <text x="436" y="410" fill="#c0392b">Breakout del grupo, sobre la nominal</text>
    <text x="806" y="410" text-anchor="end" fill="#c0392b" font-weight="bold">{{D_ACI:tonf}} / {{N_cbg:tonf}} tonf → {{u_btA}} ✗</text>
    <text x="436" y="429" fill="#c0392b">Pullout con tuerca, sobre la nominal</text>
    <text x="806" y="429" text-anchor="end" fill="#c0392b" font-weight="bold">{{D_ACIi:tonf}} / {{N_pn:tonf}} tonf → {{u_poA}} ✗</text>
    <text x="436" y="448" fill="#555">Roce que 8.5.4 prohíbe contar</text>
    <text x="806" y="448" text-anchor="end" fill="#555">{{roce:tonf}} tonf = {{frac_roce}} % del corte</text>
  </g>

  <!-- =============== BANDA DE VALORES =============== -->
  <line x1="40" y1="492" x2="800" y2="492" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="510" font-size="10.5" fill="#c0392b" font-weight="bold">Gobierna: {{gobierna}} — uso {{u_max}}</text>
  <text x="40" y="526" font-size="10.5" fill="#333">La llave toma el total del corte ({{V_kN:kN}} kN &gt; 75 kN, 8.5.3) y con eso la interacción N–V del perno deja de aplicar, pero trae su propio cono.</text>
  <text x="40" y="542" font-size="10.5" fill="#333">Los tres modos que fallan se cosen con armadura en los {{zp:cm}} cm de zona de protección ({{frac_zp}} % de la altura), que es lo que manda C9.5.2.</text>
</svg>
