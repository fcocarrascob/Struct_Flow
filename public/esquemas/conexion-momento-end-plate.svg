<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="Segoe UI, Arial, sans-serif">
  <!-- Esquema paramétrico de la planilla `conexion-momento-end-plate`.
       Derivado de /ejemplos/end-plate-esquema.svg (la figura del post, estática):
       misma composición, pero los rótulos leen la hoja con tokens. -->
  <defs>
    <marker id="ep-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ep-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ep-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f4a"/>
    </marker>
    <marker id="ep-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c07a00"/>
    </marker>
  </defs>
  <rect width="840" height="460" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Placa de extremo extendida (4E): el momento se vuelve un par, y la placa entra al cálculo</text>

  <!-- ================= elevacion ================= -->
  <!-- columna -->
  <rect x="150" y="55" width="30" height="345" fill="#dfe5ec" stroke="#333" stroke-width="1.4"/>
  <text x="165" y="416" font-size="10" text-anchor="middle" fill="#555">columna</text>
  <text x="165" y="429" font-size="10" text-anchor="middle" fill="#555">W360×162</text>

  <!-- placa de extremo -->
  <rect x="180" y="73" width="22" height="274" fill="#eef2f7" stroke="#333" stroke-width="1.6"/>
  <text x="191" y="365" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">t_p = {{t_p:mm}}</text>

  <!-- viga: alas y alma -->
  <rect x="202" y="110" width="230" height="7" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <rect x="202" y="303" width="230" height="7" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <rect x="202" y="117" width="230" height="186" fill="#f4f7fa" stroke="#c8d2dd" stroke-width="1"/>
  <text x="330" y="212" font-size="11" text-anchor="middle" fill="#7a8ba0">viga W460×74</text>
  <text x="330" y="227" font-size="10" text-anchor="middle" fill="#7a8ba0">M_u = {{M_u:tonf*m}} tonf·m</text>

  <!-- soldaduras de filete ala-placa -->
  <path d="M202,110 l9,0 -9,-9 z M202,117 l9,0 -9,9 z M202,303 l9,0 -9,-9 z M202,310 l9,0 -9,9 z" fill="#c07a00"/>
  <text x="243" y="99" font-size="9.5" fill="#c07a00">filete {{w_s:mm}} mm E70</text>

  <!-- pernos -->
  <g fill="#333">
    <circle cx="191" cy="91" r="6"/><circle cx="191" cy="137" r="6"/>
    <circle cx="191" cy="283" r="6"/><circle cx="191" cy="329" r="6"/>
  </g>
  <!-- zona traccionada resaltada -->
  <rect x="176" y="78" width="30" height="66" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="212" y="76" font-size="10" fill="#c0392b" font-weight="bold">4 Ø{{d_b:mm}} A490 a tracción</text>
  <text x="212" y="352" font-size="10" fill="#1f6f4a">4 Ø{{d_b:mm}} a corte (V_u = {{V_u:tonf}} tonf)</text>

  <!-- fuerzas del par -->
  <line x1="330" y1="113" x2="452" y2="113" stroke="#c0392b" stroke-width="2.6" marker-end="url(#ep-t)"/>
  <text x="400" y="106" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="bold">T = {{T_f:tonf}} tonf</text>
  <line x1="330" y1="307" x2="208" y2="307" stroke="#1f6f4a" stroke-width="2.6" marker-end="url(#ep-c)"/>
  <text x="290" y="326" font-size="11.5" text-anchor="middle" fill="#1f6f4a" font-weight="bold">C = {{T_f:tonf}} tonf</text>

  <!-- brazo del par -->
  <line x1="452" y1="117" x2="452" y2="303" stroke="#555" stroke-width="0.8" marker-start="url(#ep-a)" marker-end="url(#ep-a)"/>
  <text x="444" y="206" font-size="10" text-anchor="end" fill="#555">d − t_f</text>
  <text x="444" y="219" font-size="10" text-anchor="end" fill="#555">= {{d_v - t_fv:mm}} mm</text>

  <!-- cotas p_f y L_e -->
  <line x1="140" y1="91" x2="140" y2="113" stroke="#555" stroke-width="0.8" marker-start="url(#ep-a)" marker-end="url(#ep-a)"/>
  <text x="132" y="106" font-size="9.5" text-anchor="end" fill="#555">p_f = {{p_f:mm}}</text>
  <line x1="140" y1="73" x2="140" y2="91" stroke="#555" stroke-width="0.8" marker-start="url(#ep-a)" marker-end="url(#ep-a)"/>
  <text x="132" y="84" font-size="9.5" text-anchor="end" fill="#555">L_e = {{L_e:mm}}</text>

  <!-- ================= detalle T-stub ================= -->
  <rect x="500" y="52" width="322" height="330" rx="6" fill="#f8fafc" stroke="#9bb0c6"/>
  <text x="661" y="72" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">Detalle: el modelo T-stub y la palanca</text>

  <!-- ala de la columna (rigida) -->
  <rect x="528" y="90" width="16" height="220" fill="#dfe5ec" stroke="#333" stroke-width="1.2"/>
  <text x="536" y="325" font-size="9.5" text-anchor="middle" fill="#555">ala de la</text>
  <text x="536" y="337" font-size="9.5" text-anchor="middle" fill="#555">columna</text>

  <!-- placa deformada (flecta y apoya en los bordes) -->
  <path d="M544,100 C560,104 566,140 566,170 C566,200 560,236 544,240
           L544,252 C568,248 578,206 578,170 C578,134 568,92 544,88 z"
        fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="300" font-size="10" fill="#333">placa flectada (exagerada)</text>

  <!-- ala de la viga (stem) tirando -->
  <rect x="572" y="163" width="120" height="14" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <line x1="692" y1="170" x2="792" y2="170" stroke="#c0392b" stroke-width="2.6" marker-end="url(#ep-t)"/>
  <text x="742" y="162" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">T/2 = {{T_2:tonf}} tonf</text>

  <!-- pernos -->
  <rect x="524" y="136" width="52" height="7" fill="#333"/>
  <rect x="524" y="197" width="52" height="7" fill="#333"/>
  <line x1="600" y1="139" x2="584" y2="139" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ep-t)"/>
  <text x="606" y="143" font-size="10.5" fill="#c0392b" font-weight="bold">B = T/4 + q   (T/4 = {{T_4:tonf}})</text>
  <line x1="600" y1="201" x2="584" y2="201" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ep-t)"/>
  <text x="606" y="205" font-size="10.5" fill="#c0392b" font-weight="bold">B</text>

  <!-- fuerzas de palanca q en los bordes -->
  <line x1="566" y1="95" x2="548" y2="95" stroke="#c07a00" stroke-width="2.4" marker-end="url(#ep-q)"/>
  <text x="572" y="99" font-size="10.5" fill="#c07a00" font-weight="bold">q (palanca)</text>
  <line x1="566" y1="245" x2="548" y2="245" stroke="#c07a00" stroke-width="2.4" marker-end="url(#ep-q)"/>
  <text x="572" y="249" font-size="10.5" fill="#c07a00" font-weight="bold">q</text>

  <!-- cotas b' y a' -->
  <line x1="512" y1="139" x2="512" y2="170" stroke="#555" stroke-width="0.8" marker-start="url(#ep-a)" marker-end="url(#ep-a)"/>
  <text x="506" y="158" font-size="9.5" text-anchor="end" fill="#555">b' = {{b_pr:mm}}</text>
  <line x1="512" y1="95" x2="512" y2="139" stroke="#555" stroke-width="0.8" marker-start="url(#ep-a)" marker-end="url(#ep-a)"/>
  <text x="506" y="120" font-size="9.5" text-anchor="end" fill="#555">a' = {{a_pr:mm}}</text>

  <text x="516" y="356" font-size="10" fill="#888">La placa flecta, apoya en su borde contra la columna</text>
  <text x="516" y="370" font-size="10" fill="#888">y le devuelve q al perno: el perno ve T/4 + q.</text>

  <!-- la palanca de diseño, con los numeros vivos de la hoja -->
  <text x="500" y="402" font-size="10" fill="#333">t_c = {{t_c:mm}} mm es el espesor crítico: con t_p ≥ t_c no hay palanca.</text>
  <text x="500" y="418" font-size="10" fill="#1f6f4a">Con t_p = {{t_p:mm}} mm: α = {{alp_22}} y el perno rinde {{T_22:tonf}} tonf</text>
  <text x="500" y="434" font-size="10" fill="#1f6f4a">frente a T/4 = {{T_4:tonf}} tonf → uso {{u_pal}}</text>

  <text x="150" y="446" font-size="9.5" fill="#888">(dimensiones en mm)</text>
</svg>
