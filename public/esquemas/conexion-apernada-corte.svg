<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 452" font-family="Segoe UI, Arial, sans-serif">
  <!-- Esquema paramétrico de la planilla `conexion-apernada-corte`.
       Derivado de /ejemplos/conexion-apernada-esquema.svg: misma composición
       (elevación de la shear tab, plano de rotura en rojo, bloque de corte en
       ocre) y mismos colores, redibujado a 0,7 px/mm y con la leyenda estática
       reemplazada por la cadena que la hoja calcula. -->
  <defs>
    <marker id="ct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="fz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="cr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="700" height="452" fill="#ffffff"/>
  <text x="350" y="22" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Shear tab: la plancha gobierna la cadena; la excentricidad gobierna el perno</text>

  <!-- columna (ala) y soldadura de taller plancha-columna -->
  <rect x="100" y="58" width="18" height="240" fill="#dfe5ec" stroke="#333" stroke-width="1.3"/>
  <text x="109" y="50" font-size="9.5" text-anchor="middle" fill="#555">columna</text>
  <path d="M118,80 l5,-4 0,8 z M118,92 l5,-4 0,8 z M118,104 l5,-4 0,8 z M118,116 l5,-4 0,8 z M118,128 l5,-4 0,8 z M118,140 l5,-4 0,8 z M118,152 l5,-4 0,8 z M118,164 l5,-4 0,8 z M118,176 l5,-4 0,8 z M118,188 l5,-4 0,8 z M118,200 l5,-4 0,8 z M118,212 l5,-4 0,8 z M118,224 l5,-4 0,8 z M118,236 l5,-4 0,8 z M118,248 l5,-4 0,8 z M118,260 l5,-4 0,8 z M118,272 l5,-4 0,8 z" fill="#c07a00"/>

  <!-- la plancha, a 0,7 px/mm -->
  <rect x="118" y="75" width="70" height="196" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <!-- el bloque que se arranca: del perno superior al borde inferior, hacia L_eh -->
  <polygon points="160,99.5 188,99.5 188,271 160,271" fill="#fdf0e6" stroke="#c07a00" stroke-width="1.1" stroke-dasharray="4 2"/>
  <!-- el plano de rotura por corte: toda la profundidad, por los agujeros -->
  <line x1="160" y1="75" x2="160" y2="271" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 3"/>
  <g fill="#333">
    <circle cx="160" cy="99.5" r="6"/><circle cx="160" cy="148.5" r="6"/>
    <circle cx="160" cy="197.5" r="6"/><circle cx="160" cy="246.5" r="6"/>
  </g>
  <text x="196" y="70" font-size="10" fill="#333" font-weight="bold">{{n_b}} Ø{{d_b:mm}} A325-N, corte simple</text>

  <!-- el alma de la viga y la reacción, que entra por la cara de la columna -->
  <line x1="188" y1="173" x2="336" y2="173" stroke="#9bb0c6" stroke-width="9" stroke-linecap="butt"/>
  <text x="272" y="194" font-size="9.5" fill="#7a8ba0">alma de la viga</text>
  <line x1="272" y1="122" x2="272" y2="166" stroke="#c0392b" stroke-width="2.4" marker-end="url(#fz)"/>
  <text x="272" y="115" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">V_u = {{V_u:tonf}} tonf</text>

  <!-- cotas verticales: L_ev y s (la profundidad total va en el rótulo de pie) -->
  <line x1="88" y1="75" x2="88" y2="99.5" stroke="#555" stroke-width="0.8" marker-start="url(#ct)" marker-end="url(#ct)"/>
  <text x="82" y="92" font-size="9" text-anchor="end" fill="#555">L_ev = {{L_ev:mm}}</text>
  <line x1="88" y1="99.5" x2="88" y2="148.5" stroke="#555" stroke-width="0.8" marker-start="url(#ct)" marker-end="url(#ct)"/>
  <text x="82" y="128" font-size="9" text-anchor="end" fill="#555">s = {{s:mm}}</text>
  <line x1="88" y1="246.5" x2="88" y2="271" stroke="#555" stroke-width="0.8" marker-start="url(#ct)" marker-end="url(#ct)"/>
  <text x="82" y="263" font-size="9" text-anchor="end" fill="#555">L_ev = {{L_ev:mm}}</text>

  <!-- cotas horizontales: L_eh y la excentricidad a -->
  <line x1="160" y1="286" x2="188" y2="286" stroke="#555" stroke-width="0.8" marker-start="url(#ct)" marker-end="url(#ct)"/>
  <text x="174" y="299" font-size="9" text-anchor="middle" fill="#555">L_eh = {{L_eh:mm}}</text>
  <line x1="118" y1="314" x2="160" y2="314" stroke="#c0392b" stroke-width="0.9" marker-start="url(#cr)" marker-end="url(#cr)"/>
  <text x="139" y="327" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">a = {{a:mm}}</text>
  <text x="139" y="339" font-size="9" text-anchor="middle" fill="#c0392b">excentricidad</text>
  <text x="60" y="356" font-size="9.5" fill="#333">plancha PL {{t:mm}}×{{b_pl:mm}} (A36) · cotas en mm</text>
  <text x="60" y="368" font-size="9.5" fill="#333">profundidad d_pl = 3s + 2L_ev = {{d_pl:mm}}</text>

  <!-- la cadena de transferencia, con lo que la hoja calcula -->
  <rect x="366" y="52" width="322" height="176" rx="6" fill="#f8fafc" stroke="#9bb0c6"/>
  <text x="378" y="70" font-size="10.5" fill="#222" font-weight="bold">La cadena, eslabón a eslabón — φR_n y uso</text>
  <text x="378" y="90" font-size="9.5" fill="#333">Pernos, corte simple (J3-1)</text>
  <text x="680" y="90" font-size="9.5" text-anchor="end" fill="#333">{{Rd_per:tonf}} tonf · {{u_per}}</text>
  <text x="378" y="107" font-size="9.5" fill="#333">Grupo, resistencia efectiva (J3.7)</text>
  <text x="680" y="107" font-size="9.5" text-anchor="end" fill="#333">{{Rd_grp:tonf}} tonf · {{u_grp}}</text>
  <text x="378" y="124" font-size="9.5" fill="#333">Aplastamiento / desgarre (J3.11)</text>
  <text x="680" y="124" font-size="9.5" text-anchor="end" fill="#333">{{Rd_apo:tonf}} tonf · {{u_apo}}</text>
  <text x="378" y="141" font-size="9.5" fill="#333">Plancha, corte por fluencia (J4-3)</text>
  <text x="680" y="141" font-size="9.5" text-anchor="end" fill="#333">{{Rd_pfl:tonf}} tonf · {{u_pfl}}</text>
  <text x="378" y="158" font-size="9.5" fill="#c0392b" font-weight="bold">Plancha, corte por rotura (J4-4) ← gobierna</text>
  <text x="680" y="158" font-size="9.5" text-anchor="end" fill="#c0392b" font-weight="bold">{{Rd_pro:tonf}} tonf · {{u_pro}}</text>
  <text x="378" y="175" font-size="9.5" fill="#333">Rotura en bloque (J4-5)</text>
  <text x="680" y="175" font-size="9.5" text-anchor="end" fill="#333">{{Rd_bc:tonf}} tonf · {{u_bc}}</text>
  <line x1="378" y1="186" x2="680" y2="186" stroke="#c8d2dd" stroke-width="1"/>
  <text x="378" y="202" font-size="9" fill="#888">Declarado, fuera de la cadena: apoyo en el alma</text>
  <text x="680" y="202" font-size="9" text-anchor="end" fill="#888">{{Rd_alm:tonf}} tonf · {{u_alm}}</text>
  <text x="378" y="219" font-size="9" fill="#888">La palanca: la misma plancha en {{t2:mm}} mm sube la rotura a</text>
  <text x="680" y="219" font-size="9" text-anchor="end" fill="#888">{{Rd_pro2:tonf}} tonf</text>

  <!-- lo que la cadena supone calladamente -->
  <rect x="366" y="240" width="322" height="118" rx="6" fill="#fff6f4" stroke="#c0392b"/>
  <text x="378" y="258" font-size="10.5" fill="#c0392b" font-weight="bold">Lo que la cadena supone: la carga sobre la línea de pernos</text>
  <text x="378" y="277" font-size="9.5" fill="#333">M_u = V_u·a = {{M_u:tonf*m}} tonf·m, y se lo reparten los dos</text>
  <text x="378" y="295" font-size="9.5" fill="#333">Plancha en flexión (J4.5, Z_neto = {{Z_n:cm^3}} cm³)</text>
  <text x="680" y="295" font-size="9.5" text-anchor="end" fill="#333">uso {{u_mro}}</text>
  <text x="378" y="313" font-size="9.5" fill="#333">Perno extremo, método elástico: r = {{r_b:kgf}} kgf</text>
  <text x="680" y="313" font-size="9.5" text-anchor="end" fill="#333">φr_n = {{Rd_b1:kgf}} kgf</text>
  <text x="378" y="333" font-size="10.5" fill="#c0392b" font-weight="bold">→ margen del perno extremo</text>
  <text x="680" y="333" font-size="10.5" text-anchor="end" fill="#c0392b" font-weight="bold">{{(1-u_exc)*100}} %</text>
  <text x="378" y="350" font-size="9" fill="#888">Con A490 (Grupo 150, 470 MPa) el mismo perno baja a {{u_e490}}</text>

  <!-- banda de valores: lo que la hoja concluye -->
  <line x1="60" y1="378" x2="688" y2="378" stroke="#c8d2dd" stroke-width="1"/>
  <text x="60" y="394" font-size="9.5" fill="#333">Demanda V_u = {{V_u:tonf}} tonf · {{n_b}} pernos Ø{{d_b:mm}} en corte simple · plancha PL {{t:mm}}×{{b_pl:mm}}, profundidad d_pl = {{d_pl:mm}} mm</text>
  <text x="60" y="411" font-size="9.5" fill="#c0392b">Gobierna la cadena la ROTURA POR CORTE de la plancha: φR_n = {{Rd_pro:tonf}} tonf → uso {{u_pro}} (el corte de los pernos parecía sobrar: {{u_per}})</text>
  <text x="60" y="428" font-size="9.5" fill="#c0392b" font-weight="bold">Pero el más cargado es el PERNO EXTREMO: con a = {{a:mm}} mm el margen cae a {{(1-u_exc)*100}} % — la holgura de la cadena era aparente</text>
  <text x="60" y="444" font-size="9" fill="#888">Fuera de alcance: soldadura plancha-columna (que además toma M_u) y pandeo de la plancha.</text>
</svg>
