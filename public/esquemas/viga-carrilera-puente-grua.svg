<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="840" height="640" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Viga carrilera 20 t — gobierna la flexión biaxial; el canal es la palanca</text>

  <!-- =============== PANEL A: sección combinada =============== -->
  <text x="40" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Sección combinada: W610×155 + C310×45 + riel A55</text>

  <!-- carga vertical -->
  <line x1="210" y1="72" x2="210" y2="112" stroke="#c0392b" stroke-width="2.4" marker-end="url(#fr)"/>
  <text x="222" y="84" font-size="11" fill="#c0392b" font-weight="bold">P_v = {{P_v:tonf}} tonf</text>
  <text x="222" y="97" font-size="9.5" fill="#a5432f">(+25 % impacto)</text>

  <!-- rueda -->
  <rect x="198" y="112" width="24" height="16" rx="2" fill="#d7dde5" stroke="#333" stroke-width="1.3"/>
  <!-- riel -->
  <rect x="194" y="128" width="32" height="14" fill="#c9d2dc" stroke="#333" stroke-width="1.3"/>
  <text x="140" y="139" font-size="10" fill="#555" text-anchor="end">riel A55</text>
  <line x1="142" y1="135" x2="192" y2="135" stroke="#888" stroke-width="0.7"/>

  <!-- empuje lateral en cabeza de riel -->
  <line x1="226" y1="135" x2="290" y2="135" stroke="#c0392b" stroke-width="2.4" marker-end="url(#fr)"/>
  <text x="298" y="132" font-size="11" fill="#c0392b" font-weight="bold">H = {{H:tonf}} tonf</text>
  <text x="298" y="145" font-size="9.5" fill="#a5432f">en la cabeza del riel</text>

  <!-- canal (plano sobre ala superior) -->
  <rect x="142" y="150" width="136" height="14" fill="#dbe6d8" stroke="#333" stroke-width="1.4"/>
  <text x="298" y="163" font-size="10.5" fill="#3a6b34" font-weight="bold">canal C310×45</text>

  <!-- ala superior -->
  <rect x="150" y="164" width="120" height="13" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <!-- alma -->
  <rect x="204" y="177" width="12" height="180" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <!-- ala inferior -->
  <rect x="150" y="357" width="120" height="13" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <text x="298" y="290" font-size="11" fill="#333" font-weight="bold">W610×155</text>

  <!-- eje neutro combinado -->
  <line x1="128" y1="248" x2="290" y2="248" stroke="#1a63a8" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text x="298" y="245" font-size="10" fill="#1a63a8">eje neutro</text>
  <text x="298" y="258" font-size="10" fill="#1a63a8">combinado</text>

  <!-- cota altura -->
  <line x1="118" y1="164" x2="118" y2="370" stroke="#888" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="110" y="270" font-size="10" fill="#666" text-anchor="end">{{d:cm}} cm</text>

  <!-- propiedades compuestas -->
  <text x="40" y="398" font-size="10.5" fill="#1a63a8" font-weight="bold">Las seis compuestas, que ninguna tabla trae:</text>
  <text x="40" y="414" font-size="10" fill="#333">I_x = {{I_x:cm^4}} · S_x,inf = {{S_xinf:cm^3}} · I_y = {{I_y:cm^4}} cm⁴</text>
  <text x="40" y="429" font-size="10" fill="#333">r_y = {{r_y:cm}} cm · I_y,top = {{I_ytop:cm^4}} cm⁴ · S_y,top = {{S_ytop:cm^3}} cm³</text>
  <text x="40" y="447" font-size="10" fill="#555">El canal aporta al eje débil su inercia fuerte: {{I_cf:cm^4}} cm⁴.</text>
  <text x="40" y="462" font-size="10" fill="#555">Eje neutro compuesto a {{y_NA:cm}} cm del ala inferior, con el canal</text>
  <text x="40" y="477" font-size="10" fill="#555">sobre su dorso. Ignorar el x̄ lo bajaría a {{y_2:cm}} cm.</text>

  <!-- =============== PANEL B: demanda vs capacidad =============== -->
  <text x="430" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Uso (demanda / capacidad) — límite = 1.0</text>
  <line x1="560" y1="66" x2="560" y2="326" stroke="#bbb" stroke-width="1"/>
  <line x1="810" y1="66" x2="810" y2="332" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="810" y="346" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="bold">1.0</text>

  <!-- LTB -->
  <text x="553" y="84" font-size="10" fill="#333" text-anchor="end">LTB (F2-2)</text>
  <rect x="560" y="74" width="183" height="14" fill="#8fb4d9"/>
  <text x="748" y="85" font-size="9.5" fill="#333">{{u_ltb}}</text>
  <!-- biaxial -->
  <text x="553" y="114" font-size="10" fill="#c0392b" text-anchor="end" font-weight="bold">flexión biaxial (H1-1b)</text>
  <rect x="560" y="104" width="242" height="14" fill="#c0392b"/>
  <text x="560" y="132" font-size="9.5" fill="#c0392b" font-weight="bold">gobierna: {{H1}} = {{u_ltb}} vertical + {{u_lat}} lateral</text>
  <!-- corte -->
  <text x="553" y="158" font-size="10" fill="#333" text-anchor="end">corte (G2-1, φ = 1,00)</text>
  <rect x="560" y="148" width="91" height="14" fill="#8fb4d9"/>
  <text x="657" y="159" font-size="9.5" fill="#333">{{u_v}}</text>
  <!-- J10-2 -->
  <text x="553" y="182" font-size="10" fill="#333" text-anchor="end">fluencia local alma (J10-2)</text>
  <rect x="560" y="172" width="80" height="14" fill="#8fb4d9"/>
  <text x="646" y="183" font-size="9.5" fill="#333">{{u_j2}}</text>
  <!-- J10-4 -->
  <text x="553" y="206" font-size="10" fill="#333" text-anchor="end">aplastamiento alma (J10-4)</text>
  <rect x="560" y="196" width="61" height="14" fill="#8fb4d9"/>
  <text x="627" y="207" font-size="9.5" fill="#333">{{u_j4}}</text>
  <!-- flecha vertical -->
  <text x="553" y="230" font-size="10" fill="#333" text-anchor="end">flecha vert. (L/600)</text>
  <rect x="560" y="220" width="107" height="14" fill="#a8c4a0"/>
  <text x="673" y="231" font-size="9.5" fill="#333">{{u_dv}}</text>
  <!-- flecha lateral -->
  <text x="553" y="254" font-size="10" fill="#333" text-anchor="end">flecha lat. (L/400)</text>
  <rect x="560" y="244" width="77" height="14" fill="#a8c4a0"/>
  <text x="643" y="255" font-size="9.5" fill="#333">{{u_dh}}</text>
  <!-- fatiga -->
  <text x="553" y="278" font-size="10" fill="#333" text-anchor="end">fatiga Cat. C, Clase C</text>
  <rect x="560" y="268" width="116" height="14" fill="#d9b98f"/>
  <text x="682" y="279" font-size="9.5" fill="#333">{{u_fatC}}</text>
  <!-- fatiga vida infinita -->
  <text x="553" y="302" font-size="10" fill="#8a6d3b" text-anchor="end">vida infinita (CAFL)</text>
  <rect x="560" y="292" width="241" height="14" fill="#8a6d3b"/>
  <text x="560" y="320" font-size="9.5" fill="#8a6d3b">en servicio severo empata, sin desplazarla: {{u_fatInf}}</text>

  <!-- caja: sin canal -->
  <rect x="430" y="362" width="380" height="88" rx="4" fill="#fdf6ec" stroke="#d9b98f" stroke-width="1"/>
  <text x="444" y="382" font-size="10.5" fill="#8a6d3b" font-weight="bold">La misma viga SIN el canal — la cadena B</text>
  <text x="444" y="400" font-size="9.5" fill="#5f4d2e">L_r = {{Lr_d:m}} m &gt; 8 m: el LTB NO se cae (uso {{u_ltbd}}).</text>
  <text x="444" y="416" font-size="9.5" fill="#5f4d2e">Lo que se cae es el eje débil: φM_ny baja de {{Rd_Mny:tonf*m}} a {{Rd_Mnyd:tonf*m}} tonf·m</text>
  <text x="444" y="432" font-size="9.5" fill="#5f4d2e">y la interacción se va a H1 = {{H1_d}}: por eso va el canal, y va por</text>
  <text x="444" y="444" font-size="9.5" fill="#5f4d2e">el eje débil, no por el LTB.</text>

  <!-- =============== BANDA DE VALORES =============== -->
  <line x1="40" y1="500" x2="800" y2="500" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="522" font-size="11" fill="#222" font-weight="bold">Demanda: M_u = {{M_u:tonf*m}} tonf·m · M_uy = {{M_uy:tonf*m}} tonf·m · V_u = {{V_u:tonf}} tonf</text>
  <text x="40" y="542" font-size="11" fill="#222">La variable que habla: S_y,top — el canal la lleva de {{S_yala:cm^3}} a {{S_ytop:cm^3}} cm³, o sea ×{{razon_Sy}}.</text>
  <text x="40" y="562" font-size="11" fill="#c0392b" font-weight="bold">Gobierna la flexión biaxial (Ec. H1-1b): uso {{H1}}, con {{(1-H1)*100}} % de margen.</text>
  <text x="40" y="584" font-size="10.5" fill="#555">Carga móvil derivada por barrido: M_máx = {{coef_M}}·P (m) y V_máx = {{coef_V}}·P — o sea</text>
  <text x="40" y="600" font-size="10.5" fill="#555">{{exceso*100}} % más que la intuición de una rueda al centro.</text>
  <text x="40" y="620" font-size="10.5" fill="#555">Fatiga: Δσ = {{D_sigma:kgf/cm^2}} kgf/cm² contra F_SR = {{F_srC:kgf/cm^2}} kgf/cm² (Cat. C, 5·10⁵ ciclos).</text>
</svg>
