<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 545" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="840" height="545" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Columna de galpón a compresión: el eje fuerte (cantilever) gobierna</text>

  <!-- =============== PANEL A: la columna y sus dos ejes =============== -->
  <text x="60" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Columna W250×73: base empotrada, tope arriostrado solo fuera del plano</text>

  <!-- fuerza Pu -->
  <line x1="170" y1="66" x2="170" y2="86" stroke="#c0392b" stroke-width="2.4" marker-end="url(#fr)"/>
  <text x="170" y="62" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">P_u = {{P_u:tonf}} tonf</text>

  <!-- columna -->
  <rect x="157" y="90" width="26" height="270" fill="#eef2f7" stroke="#333" stroke-width="1.6"/>

  <!-- forma pandeada eje fuerte (cantilever) -->
  <path d="M170,360 C 214,286 220,158 202,92" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="250" y="120" font-size="10.5" fill="#c0392b" font-weight="bold">eje fuerte X</text>
  <text x="250" y="134" font-size="10" fill="#c0392b">cantilever, K_x = {{K_x}}</text>

  <!-- base empotrada -->
  <line x1="120" y1="360" x2="220" y2="360" stroke="#333" stroke-width="2.4"/>
  <path d="M124,360 l-8,10 M138,360 l-8,10 M152,360 l-8,10 M166,360 l-8,10 M180,360 l-8,10 M194,360 l-8,10 M208,360 l-8,10 M222,360 l-8,10" stroke="#333" stroke-width="1"/>
  <text x="170" y="386" font-size="10.5" text-anchor="middle" fill="#333">base empotrada</text>

  <!-- arriostramiento a media altura (eje debil) -->
  <path d="M110,225 l30,-8 0,16 z" fill="#1a63a8" stroke="#1a63a8"/>
  <line x1="140" y1="225" x2="157" y2="225" stroke="#1a63a8" stroke-width="1.4"/>
  <circle cx="170" cy="225" r="2.6" fill="#1a63a8"/>
  <text x="104" y="212" font-size="10" text-anchor="middle" fill="#1a63a8">arriostramiento</text>
  <text x="104" y="242" font-size="10" text-anchor="middle" fill="#1a63a8">eje débil Y</text>

  <!-- cota L -->
  <line x1="240" y1="90" x2="240" y2="360" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="248" y="228" font-size="11" fill="#555">L = {{L:m}} m</text>

  <!-- bloque de esbelteces -->
  <text x="46" y="410" font-size="10.5" fill="#c0392b" font-weight="bold">Eje fuerte X:  L_cx = {{K_x}}·{{L:m}} = {{L_cx:m}} m → L_cx/r_x = {{lam_x}}  ◄ gobierna</text>
  <text x="46" y="428" font-size="10.5" fill="#1c7c3c">Eje débil Y:   L_cy = {{K_y}}·{{L_y:m}} = {{L_cy:m}} m → L_cy/r_y = {{lam_y}}</text>
  <text x="46" y="448" font-size="10" fill="#888">r_x = {{r_x:cm}} &gt; r_y = {{r_y:cm}} cm, pero manda el eje fuerte: la longitud efectiva pesa más.</text>

  <!-- =============== PANEL B: demanda vs capacidad =============== -->
  <text x="500" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Estados de pandeo (φP_n vs P_u = {{P_u:tonf}} tonf)</text>

  <!-- Escala 0.92 px/tonf, origen en x = 500. Los anchos van FIJOS a mano: un token
       no puede ir en un atributo numérico porque formatValor sale con coma decimal
       (width="211,4" es SVG inválido). Los rótulos sí son paramétricos. -->
  <g transform="translate(500,0)">
    <line x1="60" y1="70" x2="60" y2="238" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="60" y="66" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">P_u = {{P_u:tonf}}</text>

    <line x1="0" y1="238" x2="315" y2="238" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="80" x2="0" y2="238" stroke="#333" stroke-width="1"/>

    <!-- eje debil (E3-2): 0.92 x 229.7 -->
    <rect x="0" y="92" width="211" height="20" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.3"/>
    <text paint-order="stroke" stroke="#eef7ee" stroke-width="2.6" stroke-linejoin="round" x="6" y="106" font-size="10.5" fill="#1c7c3c">Eje débil Y (E3-2)  φP_n = {{Rd_y:tonf}}</text>
    <text x="307" y="106" font-size="10" text-anchor="end" fill="#1c7c3c">{{u_y}}</text>

    <!-- torsional (E4-2): 0.92 x 245.1 -->
    <rect x="0" y="130" width="226" height="20" fill="#f4f7fb" stroke="#5a6b7c" stroke-width="1.3"/>
    <text paint-order="stroke" stroke="#f4f7fb" stroke-width="2.6" stroke-linejoin="round" x="6" y="144" font-size="10.5" fill="#4a5b6c">Torsional (E4-2)  φP_n = {{Rd_z:tonf}}</text>
    <text x="307" y="144" font-size="10" text-anchor="end" fill="#4a5b6c">{{P_u/Rd_z}}</text>

    <!-- eje fuerte (E3-3): gobierna. 0.92 x 79.3 -->
    <rect x="0" y="168" width="73" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
    <text paint-order="stroke" stroke="#fdecea" stroke-width="2.6" stroke-linejoin="round" x="6" y="182" font-size="10.5" fill="#c0392b" font-weight="bold">Eje fuerte X (E3-3)  φP_n = {{Rd_x:tonf}}</text>
    <text x="307" y="182" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">{{u_x}} ◄</text>

    <!-- pandeo local -->
    <rect x="0" y="206" width="211" height="20" fill="#eef2f7" stroke="#5a6b7c" stroke-width="1.3"/>
    <text x="6" y="220" font-size="10.5" fill="#4a5b6c">Pandeo local (E7): no esbelto → A_e = A_g</text>
  </g>

  <!-- caja lever -->
  <rect x="490" y="330" width="325" height="112" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="502" y="352" font-size="11.5" fill="#222" font-weight="bold">La palanca: bajar L_c/r, no subir F_y</text>
  <text x="502" y="372" font-size="11" fill="#333">El eje fuerte pandea elástico (F_n = 0.877·F_e),</text>
  <text x="502" y="388" font-size="11" fill="#333">y F_e no depende de F_y — solo de E y la geometría:</text>
  <text x="502" y="408" font-size="11" fill="#c0392b">  Cantilever K_x = {{K_x}}:  L_c/r = {{lam_x}} → φP_n = {{Rd_x:tonf}} tonf</text>
  <text x="502" y="426" font-size="11" fill="#1c7c3c">  Arriostrar K_x = {{K_x1}}:  L_c/r = {{lam_x1}} → φP_n = {{Rd_x1:tonf}} tonf</text>

  <!-- =============== BANDA DE VALORES =============== -->
  <line x1="46" y1="472" x2="794" y2="472" stroke="#d5dbe2" stroke-width="1"/>
  <text x="46" y="494" font-size="11" fill="#333">Demanda P_u = {{P_u:tonf}} tonf · W250×73 con A_g = {{A_g:cm^2}} cm² de tabla (las cuatro planchas dan {{A_pl:cm^2}} cm²: faltan los redondeos de unión).</text>
  <text x="46" y="512" font-size="11" fill="#333">La variable que habla es L_c/r: {{lam_x}} en el eje fuerte contra {{lam_y}} en el débil, y por eso F_n cae de {{F_ny:kgf/cm^2}} a {{F_nx:kgf/cm^2}} kgf/cm².</text>
  <text x="46" y="530" font-size="11" fill="#c0392b" font-weight="bold">Gobierna el pandeo por flexión del eje fuerte (Ec. E3-3): φP_n = {{Rd_x:tonf}} tonf → uso {{u_x}}. Arriostrar el marco lo lleva a {{Rd_x1:tonf}} tonf, un factor {{raz_pal}}.</text>
</svg>
