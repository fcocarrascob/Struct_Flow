<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="840" height="620" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Diagonal HSS en los dos sentidos: AISC 360-22 (tracción y compresión) + NCh2369</text>

  <!-- =============== PANEL A: detalle de conexión =============== -->
  <text x="60" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Conexión: HSS ranurado a plancha gusset concéntrica (soldada)</text>

  <!-- tubo HSS (vista lateral) -->
  <rect x="250" y="150" width="215" height="62" fill="#eef2f7" stroke="#333" stroke-width="1.6"/>
  <line x1="250" y1="162" x2="465" y2="162" stroke="#9bb0c6" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="250" y1="200" x2="465" y2="200" stroke="#9bb0c6" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="440" y="142" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">HSS 4×4×1/4</text>

  <!-- plancha gusset entrando por la ranura -->
  <rect x="70" y="174" width="245" height="14" fill="#dfe5ec" stroke="#333" stroke-width="1.3"/>
  <text x="150" y="169" font-size="10.5" text-anchor="middle" fill="#555">plancha gusset t = {{t_p:mm}} mm</text>
  <text x="120" y="205" font-size="10.5" text-anchor="middle" fill="#555">(al marco)</text>

  <!-- cordones de filete a lo largo de l -->
  <path d="M250,174 l6,-6 6,6 6,-6 6,6 6,-6 6,6 6,-6 6,6 6,-6 6,6 6,-6 6,6" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <path d="M250,188 l6,6 6,-6 6,6 6,-6 6,6 6,-6 6,6 6,-6 6,6 6,-6 6,6 6,-6" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <text x="322" y="234" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">4 cordones de filete, w = {{w_s:mm}} mm</text>

  <!-- cota l -->
  <line x1="250" y1="248" x2="322" y2="248" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="286" y="262" font-size="11" text-anchor="middle" fill="#555">l = {{l_w:cm}} cm</text>

  <!-- fuerza Pu -->
  <line x1="465" y1="181" x2="520" y2="181" stroke="#c0392b" stroke-width="2.4" marker-end="url(#fr)"/>
  <text x="500" y="172" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">P_u = {{P_u:tonf}} tonf</text>

  <!-- ranura marcada -->
  <line x1="250" y1="181" x2="315" y2="181" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="250" y="128" font-size="10" text-anchor="middle" fill="#888">ranura</text>
  <line x1="250" y1="150" x2="250" y2="132" stroke="#888" stroke-width="0.7"/>

  <!-- corte A-A: seccion del HSS con plancha -->
  <text x="130" y="278" font-size="11" text-anchor="middle" fill="#555" font-weight="bold">Corte A–A (retraso de cortante, Caso 5)</text>
  <rect x="80" y="292" width="100" height="100" fill="none" stroke="#333" stroke-width="1.6"/>
  <rect x="90" y="302" width="80" height="80" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="130" y1="288" x2="130" y2="396" stroke="#333" stroke-width="1.4"/>
  <text x="130" y="408" font-size="10.5" text-anchor="middle" fill="#333">plancha (plano de conexión)</text>
  <circle cx="130" cy="342" r="2.6" fill="#1a63a8"/>
  <line x1="130" y1="342" x2="164" y2="342" stroke="#1a63a8" stroke-width="1" marker-end="url(#ar)"/>
  <text x="200" y="338" font-size="10.5" fill="#1a63a8">x̄ = {{x_bar:cm}} cm</text>
  <text x="200" y="352" font-size="9.5" fill="#888">(centroide del semi-perfil)</text>
  <!-- La cota va DEBAJO del rótulo de la plancha: a y=404 la línea le pasaba
       por encima al texto y lo tachaba. -->
  <line x1="80" y1="428" x2="180" y2="428" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="130" y="442" font-size="10" text-anchor="middle" fill="#555">B = H = {{B:cm}} cm</text>

  <text x="300" y="300" font-size="10.5" fill="#333">U = 1 − x̄/l = {{U_5}}</text>
  <text x="300" y="318" font-size="10.5" fill="#333">A_g = {{A_g:cm^2}} cm² (catálogo)</text>
  <text x="300" y="342" font-size="10.5" fill="#333">A_n = A_g − 2·t·w_r = {{A_n:cm^2}} cm²</text>
  <text x="300" y="378" font-size="10.5" fill="#1a63a8" font-weight="bold">A_e = A_n·U = {{A_e:cm^2}} cm²</text>

  <!-- =============== PANEL B: demanda vs capacidad =============== -->
  <text x="560" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Estados límite (φP_n vs P_u = {{P_u:tonf}} tonf)</text>

  <!-- linea de demanda -->
  <line x1="694" y1="70" x2="694" y2="250" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="694" y="66" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">P_u = {{P_u:tonf}}</text>

  <!-- eje -->
  <line x1="560" y1="250" x2="810" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="560" y1="80" x2="560" y2="250" stroke="#333" stroke-width="1"/>

  <!-- barras: scale 3.2 px/tonf desde x=560 (geometría estática; los rótulos leen la hoja) -->
  <rect x="560" y="92" width="220" height="20" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.3"/>
  <text paint-order="stroke" stroke="#eef7ee" stroke-width="2.6" stroke-linejoin="round" x="565" y="106" font-size="10.5" fill="#1c7c3c">Fluencia bruta  φP_n = {{Rd_flu:tonf}}</text>
  <text x="800" y="106" font-size="10" text-anchor="end" fill="#1c7c3c">{{u_flu}}</text>
  <rect x="560" y="130" width="155" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text paint-order="stroke" stroke="#fdecea" stroke-width="2.6" stroke-linejoin="round" x="565" y="144" font-size="10.5" fill="#c0392b" font-weight="bold">Rotura (Caso 5)  φP_n = {{Rd_ro:tonf}}</text>
  <text x="800" y="144" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">{{u_ro}} ◄</text>
  <rect x="560" y="168" width="180" height="20" fill="#fff5e6" stroke="#c07a00" stroke-width="1.3"/>
  <text paint-order="stroke" stroke="#fff5e6" stroke-width="2.6" stroke-linejoin="round" x="565" y="182" font-size="10.5" fill="#a56a00">Soldadura de filete  φR_n = {{Rd_sol:tonf}}</text>
  <text x="800" y="182" font-size="10" text-anchor="end" fill="#a56a00">{{u_sol}}</text>
  <rect x="560" y="206" width="180" height="20" fill="#eef2f7" stroke="#5a6b7c" stroke-width="1.3"/>
  <text paint-order="stroke" stroke="#eef2f7" stroke-width="2.6" stroke-linejoin="round" x="565" y="220" font-size="10.5" fill="#4a5b6c">Corte de bloque  φR_n = {{Rd_bc:tonf}}</text>
  <text x="800" y="220" font-size="10" text-anchor="end" fill="#4a5b6c">{{u_bc}}</text>

  <!-- caja: la palanca del acto 1 -->
  <rect x="490" y="272" width="330" height="88" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="502" y="292" font-size="11.5" fill="#222" font-weight="bold">Acto 1 · la palanca es la longitud l</text>
  <text x="502" y="312" font-size="11" fill="#1c7c3c">l = {{l_w:cm}} cm → U = {{U_5}} → φP_n = {{Rd_ro:tonf}} tonf</text>
  <text x="502" y="330" font-size="11" fill="#1c7c3c">l = {{l_alt:cm}} cm → U = {{U_20}} → φP_n = {{Rd_ro20:tonf}} tonf</text>
  <text x="502" y="350" font-size="10" fill="#888">Agrandar el HSS no ayuda: la falla vive en la conexión.</text>

  <!-- caja: acto 2, compresión -->
  <rect x="490" y="372" width="330" height="92" rx="6" fill="#f0f7f2" stroke="#1c7c3c"/>
  <text x="502" y="392" font-size="11.5" fill="#222" font-weight="bold">Acto 2 · la palanca es la longitud efectiva</text>
  <text x="502" y="412" font-size="11" fill="#1c7c3c">con el cruce (8.6.4): L_c = {{L_c:m}} m → λ = {{lam_c}} → {{Rd_com:tonf}} tonf</text>
  <text x="502" y="430" font-size="11" fill="#c0392b">sin el cruce: L_c = {{L:m}} m → λ = {{lam_0}} → {{Rd_com0:tonf}} tonf (uso {{u_com0}})</text>
  <text x="502" y="452" font-size="10" fill="#888">pandeo local: b/t = {{lam_w}} contra λ_r = {{lam_r}} (Tabla B4.1a c.6)</text>

  <!-- =============== PANEL C: la capa NCh2369 =============== -->
  <text x="60" y="492" font-size="11.5" fill="#a56a00" font-weight="bold">Acto 3 · NCh2369 8.6.3 y 8.6.8: la conexión desarrolla la capacidad esperada</text>

  <rect x="56" y="504" width="380" height="98" rx="6" fill="#fdf6ee" stroke="#e8c9a0"/>
  <text x="68" y="524" font-size="11" fill="#7d5320">8.6.3 · ductilidad: b/t = {{lam_w}} &lt; λ_md = {{lam_md}}  (uso {{u_md}})</text>
  <text x="68" y="542" font-size="11" fill="#7d5320">8.6.3 · esbeltez: λ = {{lam_c}} &lt; 1,5π√(E/F_y) = {{lam_nch}}</text>
  <text x="68" y="562" font-size="11" fill="#7d5320">8.6.8 · exige T_ye = {{T_ye:tonf}} tonf   y   P_ne = {{P_ne:tonf}} tonf</text>
  <text x="68" y="580" font-size="11" fill="#7d5320">techo 0,7R₁ = {{P_ex:tonf}} tonf → no muerde; manda T_ye</text>
  <text x="68" y="596" font-size="10" fill="#a08060">tope de la ranura con U = 1: {{Rd_tope:tonf}} tonf — haría falta U ≥ {{U_req}}</text>

  <rect x="452" y="504" width="368" height="98" rx="6" fill="#f0f7f2" stroke="#a9cdb6"/>
  <text x="464" y="524" font-size="11" fill="#2f5c40">refuerzo: 4 planchuelas de {{t_pl:mm}} × {{b_pl:mm}} mm → +{{A_pl:cm^2}} cm²</text>
  <text x="464" y="542" font-size="11" fill="#2f5c40">cordón l = {{l_w2:cm}} cm → U = {{U_2}} → A_e = {{Ae_ref:cm^2}} cm²</text>
  <text x="464" y="562" font-size="11" fill="#1c7c3c" font-weight="bold">φF_ue·A_e = {{Rd_ref:tonf}} tonf ≥ {{T_req:tonf}} tonf</text>
  <text x="464" y="582" font-size="11.5" fill="#222" font-weight="bold">u_max = {{u_max}}</text>
  <text x="464" y="597" font-size="10" fill="#555">gobierna: {{gobierna}}</text>
</svg>
