<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Viga {{b_w:cm}}×{{h:cm}} cm, luz {{L:m}} m, w_u = {{w_u:tonf/m}} tonf/m: del modelo de cargas al par interno</text>

  <!-- =================== PANEL A: cargas + diagramas =================== -->
  <text x="90" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Modelo de cargas (vano simplemente apoyado)</text>

  <line x1="90" y1="66" x2="390" y2="66" stroke="#c0392b" stroke-width="1.5"/>
  <g stroke="#c0392b" stroke-width="1.2">
    <line x1="110" y1="66" x2="110" y2="86" marker-end="url(#dn)"/>
    <line x1="150" y1="66" x2="150" y2="86" marker-end="url(#dn)"/>
    <line x1="190" y1="66" x2="190" y2="86" marker-end="url(#dn)"/>
    <line x1="230" y1="66" x2="230" y2="86" marker-end="url(#dn)"/>
    <line x1="270" y1="66" x2="270" y2="86" marker-end="url(#dn)"/>
    <line x1="310" y1="66" x2="310" y2="86" marker-end="url(#dn)"/>
    <line x1="350" y1="66" x2="350" y2="86" marker-end="url(#dn)"/>
  </g>
  <text x="240" y="62" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">w_u = 1,2D + 1,6L = {{w_u:tonf/m}} tonf/m</text>

  <rect x="90" y="90" width="300" height="9" fill="#eef2f7" stroke="#333" stroke-width="1.2"/>
  <path d="M90,99 L80,114 L100,114 z" fill="#dfe5ec" stroke="#333" stroke-width="1.1"/>
  <path d="M390,99 L380,114 L400,114 z" fill="#dfe5ec" stroke="#333" stroke-width="1.1"/>
  <circle cx="384" cy="118" r="3" fill="none" stroke="#333"/>
  <circle cx="396" cy="118" r="3" fill="none" stroke="#333"/>
  <line x1="90" y1="130" x2="390" y2="130" stroke="#555" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="240" y="145" font-size="12" text-anchor="middle" fill="#555">L = {{L:m}} m</text>

  <!-- diagrama de momento -->
  <line x1="90" y1="185" x2="390" y2="185" stroke="#333" stroke-width="1"/>
  <text x="80" y="189" font-size="11" text-anchor="end" fill="#333">M</text>
  <path d="M90,185 Q240,289 390,185 Z" fill="#eaf1fb" stroke="#1a63a8" stroke-width="1.6"/>
  <text x="240" y="262" font-size="12" text-anchor="middle" fill="#1a63a8" font-weight="bold">M_u = w_u·L²/8 = {{M_u:tonf*m}} tonf·m</text>

  <!-- diagrama de corte -->
  <line x1="90" y1="345" x2="390" y2="345" stroke="#333" stroke-width="1"/>
  <text x="80" y="349" font-size="11" text-anchor="end" fill="#333">V</text>
  <polygon points="90,305 240,345 90,345" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.4"/>
  <polygon points="240,345 390,385 390,345" fill="#fbeaea" stroke="#c0392b" stroke-width="1.4"/>
  <line x1="90" y1="305" x2="390" y2="385" stroke="#555" stroke-width="1"/>
  <text x="86" y="300" font-size="11.5" fill="#1c7c3c" font-weight="bold">V_u = {{V_uap:tonf}} tonf</text>
  <circle cx="117" cy="312" r="3" fill="#1c7c3c"/>
  <text x="124" y="309" font-size="11" fill="#1c7c3c">V_u@d = {{V_ud:tonf}} tonf (9.4.3.2)</text>
  <text x="396" y="388" font-size="11.5" fill="#c0392b">−{{V_uap:tonf}} tonf</text>

  <!-- =================== PANEL B: sección + par interno =================== -->
  <text x="500" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Sección y equilibrio a flexión</text>

  <rect x="500" y="80" width="90" height="180" fill="none" stroke="#333" stroke-width="1.6"/>
  <rect x="512" y="92" width="66" height="156" fill="none" stroke="#1c7c3c" stroke-width="1.4" rx="4"/>
  <circle cx="521" cy="240" r="6" fill="#333"/>
  <circle cx="545" cy="240" r="6" fill="#333"/>
  <circle cx="569" cy="240" r="6" fill="#333"/>

  <line x1="500" y1="70" x2="590" y2="70" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="545" y="66" font-size="10.5" text-anchor="middle" fill="#555">b_w = {{b_w:cm}} cm</text>
  <line x1="486" y1="80" x2="486" y2="240" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="482" y="164" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold" transform="rotate(-90 482,164)">d = {{d:cm}} cm</text>
  <line x1="604" y1="80" x2="604" y2="260" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="608" y="172" font-size="10.5" text-anchor="middle" fill="#555" transform="rotate(-90 608,172)">h = {{h:cm}} cm</text>

  <text x="545" y="284" font-size="11" text-anchor="middle" fill="#333">{{n_b}} φ{{d_b:mm}} = {{A_s:cm^2}} cm² (A_s,mín = {{A_smin:cm^2}} cm²)</text>
  <text x="545" y="300" font-size="11" text-anchor="middle" fill="#1c7c3c">Estribo φ{{d_v:mm}} @ {{s:cm}} ({{n_r}} ramas)</text>

  <!-- diagrama de deformaciones -->
  <text x="700" y="70" font-size="11" text-anchor="middle" fill="#555">deformaciones</text>
  <line x1="700" y1="80" x2="700" y2="260" stroke="#333" stroke-width="1"/>
  <polygon points="700,80 664,80 700,124" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
  <polygon points="700,124 762,260 700,260" fill="#eaf1fb" stroke="#1a63a8" stroke-width="1.3"/>
  <line x1="656" y1="124" x2="780" y2="124" stroke="#555" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="708" y="94" font-size="10.5" fill="#c0392b">ε_cu = {{eps_cu}}</text>
  <text x="780" y="140" font-size="10.5" text-anchor="end" fill="#555">L.N.  c = {{c:cm}} cm  (a = {{a:cm}} cm)</text>
  <text x="742" y="284" font-size="10.5" text-anchor="middle" fill="#1a63a8" font-weight="bold">ε_t = {{eps_t}} ≥ {{eps_lim}} ✓</text>

  <!-- resultado -->
  <rect x="470" y="320" width="340" height="104" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="482" y="341" font-size="11.5" fill="#222">Bloque (22.2.2.4):  a = A_s·f_y/(0,85·f'c·b_w) = {{a:cm}} cm</text>
  <text x="482" y="361" font-size="11.5" fill="#222">φM_n = {{phi_chk}}·A_s·f_y·(d − a/2) = {{Rd_M:tonf*m}} tonf·m</text>
  <text x="482" y="381" font-size="11.5" fill="#1c7c3c" font-weight="bold">φM_n = {{Rd_M:tonf*m}} ≥ M_u = {{M_u:tonf*m}} tonf·m  ✓  (9.5.1.1a)</text>
  <text x="482" y="401" font-size="11" fill="#555">controlada por tracción: c/d_t = {{cdt}} ≤ {{cdt_lim}} (Tabla 21.2.2)</text>
  <text x="482" y="418" font-size="11" fill="#555">corte: φV_n = {{Rd_V:tonf}} ≥ V_u@d = {{V_ud:tonf}} tonf</text>

  <!-- =============== BANDA DE VALORES =============== -->
  <line x1="46" y1="452" x2="794" y2="452" stroke="#d5dbe2" stroke-width="1"/>
  <text x="46" y="474" font-size="11" fill="#333">Demanda M_u = {{M_u:tonf*m}} tonf·m y V_u@d = {{V_ud:tonf}} tonf. La altura útil no se declara: sale de h − rec − estribo − φ/2 = {{d:cm}} cm.</text>
  <text x="46" y="492" font-size="11" fill="#333">Ductilidad: ε_t = {{eps_t}} contra el límite {{eps_lim}} → la Tabla 21.2.2 concede φ = {{phi_chk}}.</text>
  <text x="46" y="510" font-size="11" fill="#c0392b" font-weight="bold">Gobierna la FLEXIÓN: uso {{round(u_M,3)}} contra {{round(u_V,3)}} al corte. Y el estribo lo fija el detallado: la resistencia pedía s = {{s_req:cm}} cm, la Tabla 9.7.6.2.2 deja {{s_max:cm}} cm.</text>
  <text x="46" y="530" font-size="10.5" fill="#888">Coeficientes de la edición SI: V_c = 0,17λ√f'c (MPa) ≡ 0,543√f'c (kgf/cm²) = {{V_c:tonf}} tonf. Con el 0,53 de la edición inch-pound saldría {{0.53*sqrt(f_c/(1 kgf/cm^2))*kgf/cm^2*b_w*d:tonf}} tonf, un 2,4 % menos.</text>
</svg>
