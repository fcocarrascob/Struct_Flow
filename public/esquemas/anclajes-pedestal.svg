<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 548" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="vr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c07a00"/>
    </marker>
  </defs>
  <rect width="840" height="548" fill="#ffffff"/>
  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Grupo de anclajes en pedestal: el pedestal capa el embebido, y la interacción gobierna</text>

  <!-- =============== PANEL A: planta =============== -->
  <text x="40" y="50" font-size="11.5" fill="#1a63a8" font-weight="bold">Planta del pedestal ({{B_2:cm}} × {{B_2:cm}} cm)</text>

  <rect x="150" y="74" width="120" height="120" fill="#f4f7fb" stroke="#333" stroke-width="1.6"/>
  <!-- area proyectada del grupo traccionado con el h'ef limitado: 50 x 100 cm -->
  <rect x="150" y="74" width="60" height="120" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>

  <g stroke="#333" stroke-width="1.2">
    <circle cx="180" cy="104" r="5" fill="#c0392b"/>
    <circle cx="180" cy="164" r="5" fill="#c0392b"/>
    <circle cx="240" cy="104" r="5" fill="#dfe5ec"/>
    <circle cx="240" cy="164" r="5" fill="#dfe5ec"/>
  </g>
  <text x="180" y="66" font-size="9.5" text-anchor="middle" fill="#c0392b">fila traccionada · T = {{T_i:tonf}} tonf c/u</text>
  <text x="40" y="112" font-size="9.5" fill="#c0392b">A_Nc =</text>
  <text x="40" y="126" font-size="9.5" fill="#c0392b">{{A_Nc:cm^2}} cm²</text>
  <line x1="97" y1="120" x2="146" y2="128" stroke="#c0392b" stroke-width="0.7"/>

  <line x1="275" y1="134" x2="315" y2="134" stroke="#c07a00" stroke-width="2.4" marker-end="url(#vr)"/>
  <text x="318" y="130" font-size="10.5" fill="#c07a00" font-weight="bold">V = {{V_u:tonf}} tonf</text>

  <line x1="180" y1="215" x2="240" y2="215" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="210" y="230" font-size="10" text-anchor="middle" fill="#555">s = {{s_g:cm}}</text>
  <line x1="150" y1="215" x2="180" y2="215" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="146" y="219" font-size="10" text-anchor="end" fill="#555">c_a = {{c_a:cm}}</text>
  <line x1="150" y1="248" x2="270" y2="248" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="210" y="262" font-size="10" text-anchor="middle" fill="#555">B₂ = {{B_2:cm}} cm</text>

  <!-- =============== PANEL A2: seccion, los dos conos =============== -->
  <text x="40" y="294" font-size="11.5" fill="#1a63a8" font-weight="bold">Sección: 17.6.2.1.2 sube la superficie de falla</text>
  <text x="40" y="310" font-size="9.5" fill="#555">Tres bordes a {{c_a:cm}} cm quedan bajo 1,5·h_ef = {{proy_real:cm}} cm, así que el h_ef de cálculo baja a {{h_efT:cm}} cm.</text>

  <!-- pedestal: 240 px = 100 cm (2,4 px/cm); se dibujan los 50 cm superiores -->
  <rect x="110" y="330" width="240" height="120" fill="#f8fafc" stroke="#333" stroke-width="1.2"/>
  <!-- cono real (h_ef = 40 cm): su traza a la superficie caeria fuera del pedestal por la izquierda -->
  <path d="M26,330 L314,330" stroke="#9aa7b4" stroke-width="1.1" stroke-dasharray="5 4" fill="none"/>
  <path d="M26,330 L170,426 L314,330" fill="none" stroke="#9aa7b4" stroke-width="1.1" stroke-dasharray="5 4"/>
  <!-- cono que limita h_ef: su borde izquierdo cae justo en la cara del pedestal -->
  <path d="M110,330 L230,330 L170,370 Z" fill="#eaf1fb" stroke="#1a63a8" stroke-width="1.4"/>

  <line x1="170" y1="322" x2="170" y2="426" stroke="#333" stroke-width="2.4"/>
  <rect x="162" y="422" width="16" height="9" fill="#333"/>
  <circle cx="110" cy="330" r="3.5" fill="#c0392b"/>
  <text x="118" y="322" font-size="9" fill="#c0392b">punto A</text>

  <line x1="192" y1="330" x2="192" y2="426" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="199" y="382" font-size="9.5" fill="#555">h_ef = {{h_ef:cm}} cm</text>
  <line x1="148" y1="330" x2="148" y2="370" stroke="#1a63a8" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="143" y="354" font-size="9.5" text-anchor="end" fill="#1a63a8">h'_ef = {{h_efT:cm}}</text>
  <text x="180" y="444" font-size="8.5" fill="#333">tuerca hex. pesada · A_brg = {{A_brg:cm^2}} cm²</text>

  <!-- leyenda de la seccion -->
  <path d="M42,464 L70,464" stroke="#1a63a8" stroke-width="1.4"/>
  <text x="76" y="468" font-size="9.5" fill="#333">superficie que limita h_ef: su borde cae justo en la cara, y eso fija h'_ef = {{h_efT:cm}} cm</text>
  <path d="M42,480 L70,480" stroke="#9aa7b4" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="76" y="484" font-size="9.5" fill="#333">superficie real: pediría {{proy_real:cm}} cm de hormigón a cada lado y hay {{c_a:cm}}</text>

  <!-- =============== PANEL B: interaccion =============== -->
  <text x="430" y="50" font-size="11.5" fill="#1a63a8" font-weight="bold">Interacción tracción–corte (17.8.3, ley de potencia 5/3)</text>

  <line x1="575" y1="235" x2="575" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="575" y1="235" x2="775" y2="235" stroke="#333" stroke-width="1"/>
  <text x="775" y="269" font-size="10" text-anchor="end" fill="#333">N / φN_n,cg</text>
  <text x="568" y="74" font-size="10" text-anchor="end" fill="#333">V / φV_n,cg</text>

  <path d="M575,235 L575,95 L590,97 L605,101 L620,107 L635,114 L650,123 L665,135 L680,149 L695,166 L710,188 L718,204 L725,235 Z"
        fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.6"/>
  <text x="606" y="212" font-size="10" fill="#1c7c3c">seguro</text>

  <text x="598" y="86" font-size="9.5" fill="#1c7c3c">(N/φN)<tspan font-size="7" dy="-4">5/3</tspan><tspan dy="4"> + (V/φV)</tspan><tspan font-size="7" dy="-4">5/3</tspan><tspan dy="4"> = 1</tspan></text>

  <line x1="725" y1="233" x2="725" y2="239" stroke="#888"/>
  <text x="725" y="251" font-size="8" text-anchor="middle" fill="#888">1,0</text>
  <text x="571" y="251" font-size="8" text-anchor="middle" fill="#888">0</text>
  <line x1="571" y1="95" x2="579" y2="95" stroke="#888"/>
  <text x="566" y="99" font-size="8" text-anchor="end" fill="#888">1,0</text>

  <!-- punto de diseno: (u_bt, u_vb) sobre los mismos ejes, 150 px y 140 px por unidad -->
  <circle cx="652.5" cy="157.4" r="4.5" fill="#c0392b"/>
  <line x1="575" y1="157.4" x2="652.5" y2="157.4" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="3 2"/>
  <line x1="652.5" y1="235" x2="652.5" y2="157.4" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="662" y="150" font-size="10" fill="#c0392b" font-weight="bold">({{u_bt}} ; {{u_vb}})</text>
  <text x="662" y="163" font-size="9.5" fill="#c0392b">{{i_N}} + {{i_V}} = {{I_c}} ≤ 1 ✓</text>

  <!-- lista de modos -->
  <text x="430" y="294" font-size="11.5" fill="#1a63a8" font-weight="bold">Modos del hormigón (φ·Ψ_a = {{phiPsi}}, fisurado)</text>
  <g font-size="10.5">
    <text x="436" y="317" fill="#333">Breakout tracción (17.6.2)</text><text x="806" y="317" text-anchor="end" fill="#c0392b" font-weight="bold">{{T_g:tonf}} / {{Rd_bt:tonf}} tonf → {{u_bt}} ◄</text>
    <text x="436" y="338" fill="#333">Pullout (17.6.3)</text><text x="806" y="338" text-anchor="end" fill="#555">{{T_i:tonf}} / {{Rd_po:tonf}} tonf → {{u_po}}</text>
    <text x="436" y="359" fill="#333">Side-face blowout (17.6.4)</text><text x="806" y="359" text-anchor="end" fill="#555">no aplica (h_ef &lt; 2,5·c_a = {{gatillo_sb:cm}} cm)</text>
    <text x="436" y="380" fill="#333">Breakout de corte (17.7.2)</text><text x="806" y="380" text-anchor="end" fill="#c07a00" font-weight="bold">{{V_u:tonf}} / {{Rd_vb:tonf}} tonf → {{u_vb}} ◄</text>
    <text x="436" y="401" fill="#333">Pryout (17.7.3)</text><text x="806" y="401" text-anchor="end" fill="#555">{{V_u:tonf}} / {{Rd_pry:tonf}} tonf → {{u_pry}}</text>
    <text x="436" y="422" fill="#333">Acero del perno (17.8.4, ζ = 2)</text><text x="806" y="422" text-anchor="end" fill="#555">{{I_s}} ≤ 1</text>
    <text x="436" y="443" fill="#c0392b" font-weight="bold">Interacción N–V (17.8.3)</text><text x="806" y="443" text-anchor="end" fill="#c0392b" font-weight="bold">{{I_c}} ≤ 1 → gobierna</text>
  </g>

  <!-- =============== BANDA DE VALORES =============== -->
  <line x1="40" y1="500" x2="800" y2="500" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="516" font-size="10.5" fill="#c0392b" font-weight="bold">Gobierna: {{gobierna}} — uso {{u_max}} ≤ 1</text>
  <text x="40" y="530" font-size="10.5" fill="#333">Usos: breakout N {{u_bt}} · breakout V {{u_vb}} · pullout {{u_po}} · pryout {{u_pry}} · acero {{I_s}}</text>
  <text x="40" y="544" font-size="10.5" fill="#333">h_ef de cálculo {{h_efT:cm}} cm de los {{h_ef:cm}} embebidos: {{n_bordes}} bordes bajo 1,5·h_ef = {{proy_real:cm}} cm (17.6.2.1.2).</text>
</svg>
