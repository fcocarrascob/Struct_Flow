<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" font-family="Segoe UI, Arial, sans-serif">
  <!-- Esquema paramétrico de la planilla `conexion-doble-angulo`.
       Derivado de /ejemplos/doble-angulo-esquema.svg: misma composición (las dos
       vistas en planta enfrentadas, la tab a la izquierda en azul y el doble
       ángulo a la derecha en verde) y mismos colores, con la leyenda estática
       reemplazada por la comparación verificación por verificación que la hoja
       calcula. -->
  <defs>
    <marker id="dae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="840" height="640" fill="#ffffff"/>
  <text x="420" y="24" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Misma viga, misma reacción, mismos pernos: lo único que cambia es la anatomía (vista en planta)</text>

  <!-- ================= IZQUIERDA: SHEAR TAB ================= -->
  <text x="215" y="52" font-size="12" text-anchor="middle" fill="#1f4e79" font-weight="bold">Shear tab — {{n_st}} plano de corte, {{n_et*t:mm}} mm de apoyo</text>

  <rect x="70" y="84" width="14" height="176" fill="#dfe5ec" stroke="#333" stroke-width="1.3"/>
  <text x="77" y="288" font-size="9" text-anchor="middle" fill="#555">columna</text>

  <rect x="140" y="160" width="230" height="9" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <text x="370" y="142" font-size="9.5" text-anchor="end" fill="#7a8ba0">alma de la viga, {{t_w:mm}} mm</text>

  <rect x="84" y="169" width="180" height="10" fill="#eef2f7" stroke="#333" stroke-width="1.4"/>
  <path d="M84,169 l0,10 -7,-5 z" fill="#c07a00"/>

  <rect x="196" y="144" width="9" height="52" fill="#333"/>
  <rect x="188" y="138" width="25" height="8" fill="#333"/>
  <rect x="188" y="194" width="25" height="8" fill="#333"/>
  <line x1="150" y1="169" x2="255" y2="169" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="272" y="212" font-size="10" fill="#c0392b" font-weight="bold">{{n_st}} plano de corte</text>

  <text x="150" y="238" font-size="10" fill="#333">plancha PL {{t:mm}}×{{b_pl:mm}} (A36)</text>
  <line x1="84" y1="256" x2="200" y2="256" stroke="#555" stroke-width="0.8" marker-start="url(#dae)" marker-end="url(#dae)"/>
  <text x="142" y="270" font-size="9.5" text-anchor="middle" fill="#555">a = {{a_t:mm}} mm</text>

  <text x="70" y="306" font-size="10" fill="#333">Gobierna la cadena: rotura en corte de la plancha</text>
  <rect x="70" y="313" width="290" height="17" fill="#eef2f7" stroke="#9bb0c6"/>
  <rect x="70" y="313" width="269" height="17" fill="#1f4e79"/>
  <text x="205" y="326" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="bold">{{u_rot}}</text>
  <text x="70" y="350" font-size="10" fill="#333">Perno extremo con la excentricidad (elástico)</text>
  <rect x="70" y="357" width="290" height="17" fill="#eef2f7" stroke="#9bb0c6"/>
  <rect x="70" y="357" width="290" height="17" fill="#c0392b"/>
  <text x="215" y="370" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="bold">NO alcanza — margen {{(1-u_exct)*100}} %</text>

  <!-- ================= DERECHA: DOBLE ÁNGULO ================= -->
  <text x="628" y="52" font-size="12" text-anchor="middle" fill="#1f6f4a" font-weight="bold">Doble ángulo — {{n_sa}} planos de corte, {{n_ea*t:mm}} mm de apoyo</text>

  <rect x="470" y="84" width="14" height="176" fill="#dfe5ec" stroke="#333" stroke-width="1.3"/>
  <text x="477" y="288" font-size="9" text-anchor="middle" fill="#555">columna</text>

  <rect x="540" y="160" width="230" height="9" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <text x="770" y="142" font-size="9.5" text-anchor="end" fill="#7a8ba0">alma de la viga, {{t_w:mm}} mm</text>

  <rect x="484" y="150" width="180" height="10" fill="#e8f0e8" stroke="#333" stroke-width="1.4"/>
  <rect x="484" y="169" width="180" height="10" fill="#e8f0e8" stroke="#333" stroke-width="1.4"/>
  <rect x="484" y="110" width="10" height="40" fill="#e8f0e8" stroke="#333" stroke-width="1.4"/>
  <rect x="484" y="179" width="10" height="40" fill="#e8f0e8" stroke="#333" stroke-width="1.4"/>
  <g fill="#333"><circle cx="477" cy="130" r="4.5"/><circle cx="477" cy="199" r="4.5"/></g>

  <rect x="596" y="134" width="9" height="72" fill="#333"/>
  <rect x="588" y="128" width="25" height="8" fill="#333"/>
  <rect x="588" y="204" width="25" height="8" fill="#333"/>
  <line x1="550" y1="160" x2="660" y2="160" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="550" y1="169" x2="660" y2="169" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="672" y="212" font-size="10" fill="#c0392b" font-weight="bold">{{n_sa}} planos de corte</text>

  <text x="550" y="238" font-size="10" fill="#333">2L 100×100×{{t:mm}} (A36), abrazan el alma</text>
  <line x1="484" y1="256" x2="590" y2="256" stroke="#555" stroke-width="0.8" marker-start="url(#dae)" marker-end="url(#dae)"/>
  <text x="537" y="270" font-size="9.5" text-anchor="middle" fill="#555">e = {{a_a:mm}} mm</text>

  <text x="470" y="306" font-size="10" fill="#333">Gobierna la cadena: rotura en corte de los ángulos</text>
  <rect x="470" y="313" width="290" height="17" fill="#eef2f7" stroke="#9bb0c6"/>
  <rect x="470" y="313" width="135" height="17" fill="#1f6f4a"/>
  <text x="537" y="326" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="bold">{{u_roa}}</text>
  <text x="470" y="350" font-size="10" fill="#333">Perno extremo con la excentricidad (elástico)</text>
  <rect x="470" y="357" width="290" height="17" fill="#eef2f7" stroke="#9bb0c6"/>
  <rect x="470" y="357" width="139" height="17" fill="#1f6f4a"/>
  <text x="539" y="370" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="bold">{{u_exca}}</text>

  <!-- ================= LA COMPARACIÓN, VERIFICACIÓN POR VERIFICACIÓN ================= -->
  <line x1="60" y1="392" x2="800" y2="392" stroke="#c8d2dd" stroke-width="1"/>
  <text x="60" y="408" font-size="9.5" fill="#888">La misma demanda V_u = {{V_u:tonf}} tonf, verificación por verificación</text>
  <text x="520" y="408" font-size="9.5" text-anchor="end" fill="#1f4e79" font-weight="bold">shear tab</text>
  <text x="800" y="408" font-size="9.5" text-anchor="end" fill="#1f6f4a" font-weight="bold">doble ángulo</text>

  <text x="60" y="426" font-size="9.5" fill="#333">Pernos a corte (J3-1)</text>
  <text x="520" y="426" font-size="9.5" text-anchor="end" fill="#333">{{Rd_pert:tonf}} tonf · {{u_pert}}</text>
  <text x="800" y="426" font-size="9.5" text-anchor="end" fill="#333">{{Rd_pera:tonf}} tonf · {{u_pera}}</text>

  <text x="60" y="443" font-size="9.5" fill="#333">Apoyo en el elemento de conexión (J3-6a/c)</text>
  <text x="520" y="443" font-size="9.5" text-anchor="end" fill="#333">{{Rd_apot:tonf}} tonf · {{u_apot}}</text>
  <text x="800" y="443" font-size="9.5" text-anchor="end" fill="#333">{{Rd_apoa:tonf}} tonf · {{u_apoa}}</text>

  <text x="60" y="460" font-size="9.5" fill="#333">Fluencia en corte del elemento (J4-3)</text>
  <text x="520" y="460" font-size="9.5" text-anchor="end" fill="#333">{{Rd_flt:tonf}} tonf · {{u_flt}}</text>
  <text x="800" y="460" font-size="9.5" text-anchor="end" fill="#333">{{Rd_fla:tonf}} tonf · {{u_fla}}</text>

  <text x="60" y="477" font-size="9.5" fill="#c0392b" font-weight="bold">Rotura en corte del elemento (J4-4) ← gobierna la cadena</text>
  <text x="520" y="477" font-size="9.5" text-anchor="end" fill="#c0392b" font-weight="bold">{{Rd_rot:tonf}} tonf · {{u_rot}}</text>
  <text x="800" y="477" font-size="9.5" text-anchor="end" fill="#c0392b" font-weight="bold">{{Rd_roa:tonf}} tonf · {{u_roa}}</text>

  <text x="60" y="494" font-size="9.5" fill="#333">Rotura en bloque (J4-5)</text>
  <text x="520" y="494" font-size="9.5" text-anchor="end" fill="#333">{{Rd_bct:tonf}} tonf · {{u_bct}}</text>
  <text x="800" y="494" font-size="9.5" text-anchor="end" fill="#333">{{Rd_bca:tonf}} tonf · {{u_bca}}</text>

  <text x="60" y="511" font-size="9.5" fill="#333">Flexión por excentricidad, rotura neta (J4)</text>
  <text x="520" y="511" font-size="9.5" text-anchor="end" fill="#333">{{Rd_mrot:tonf*m}} tonf·m · {{u_mrot}}</text>
  <text x="800" y="511" font-size="9.5" text-anchor="end" fill="#333">{{Rd_mroa:tonf*m}} tonf·m · {{u_mroa}}</text>

  <text x="60" y="528" font-size="9.5" fill="#333">Perno extremo con la excentricidad (elástico)</text>
  <text x="520" y="528" font-size="9.5" text-anchor="end" fill="#c0392b" font-weight="bold">{{Rd_b1t:tonf}} tonf · {{u_exct}}</text>
  <text x="800" y="528" font-size="9.5" text-anchor="end" fill="#333">{{Rd_b1a:tonf}} tonf · {{u_exca}}</text>

  <text x="60" y="546" font-size="9" fill="#888">Común a las dos, y por eso no baja: apoyo en el alma de la viga (J3-6a)</text>
  <text x="520" y="546" font-size="9" text-anchor="end" fill="#888">{{Rd_alm:tonf}} tonf · {{u_alm}}</text>
  <text x="800" y="546" font-size="9" text-anchor="end" fill="#888">{{Rd_alm:tonf}} tonf · {{u_alm}}</text>

  <!-- banda de valores: lo que la hoja concluye -->
  <line x1="60" y1="562" x2="800" y2="562" stroke="#c8d2dd" stroke-width="1"/>
  <text x="60" y="578" font-size="9.5" fill="#333">Demanda V_u = {{V_u:tonf}} tonf · {{n_b}} pernos Ø{{d_b:mm}} · s = {{s:mm}} mm · profundidad d_pl = {{d_pl:mm}} mm · viga W460×74, alma {{t_w:mm}} mm</text>
  <text x="60" y="595" font-size="9.5" fill="#1f6f4a">Duplicar el plano de corte y el elemento baja el uso que gobierna la cadena de {{u_rot}} a {{u_roa}}, hasta EMPATAR con el alma ({{u_alm}}, {{dif_emp}} % de diferencia)</text>
  <text x="60" y="612" font-size="9.5" fill="#c0392b" font-weight="bold">Y lo que la cadena escondía: el perno extremo de la tab queda con margen {{(1-u_exct)*100}} % — el del doble ángulo, en {{u_exca}}</text>
  <text x="60" y="629" font-size="9" fill="#888">El precio: {{razon}} veces el acero ({{m_tab:kg}} → {{m_ang:kg}} kg) y {{n_agt}} → {{n_aga}} agujeros en terreno.</text>
</svg>
