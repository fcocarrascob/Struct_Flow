<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="340" y="22" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Viento de NCh432:2025 — costaneras y largueros</text>
  <text x="340" y="38" font-size="9.5" text-anchor="middle" fill="#888">zona {{rot_zona}} · V = {{V_b:m/s}} m/s · I = {{I_w}} · K_zt = {{K_zt}} · K_e = {{K_e}} · {{rot_cerr}} · {{rot_fig}}</text>

  <!-- ═══ A · envolventes de (GC_p) contra el área efectiva ═══ -->
  <text x="20" y="64" font-size="11" fill="#1a63a8" font-weight="bold">A · Envolvente de (GC_p) contra el área efectiva</text>
  <text x="20" y="78" font-size="8.5" fill="#999">techo: la zona más desfavorable · muros: zonas 4 y 5{{f_mur > 0.95 ? "" : ", con −10 % (θ ≤ 10°)"}}</text>
  <line x1="70.0" y1="90" x2="70.0" y2="330" stroke="#e6e6e6"/>
  <text x="70.0" y="346" font-size="9" text-anchor="middle" fill="#666">0,1</text>
  <line x1="156.7" y1="90" x2="156.7" y2="330" stroke="#e6e6e6"/>
  <text x="156.7" y="346" font-size="9" text-anchor="middle" fill="#666">1</text>
  <line x1="243.3" y1="90" x2="243.3" y2="330" stroke="#e6e6e6"/>
  <text x="243.3" y="346" font-size="9" text-anchor="middle" fill="#666">10</text>
  <line x1="330.0" y1="90" x2="330.0" y2="330" stroke="#e6e6e6"/>
  <text x="330.0" y="346" font-size="9" text-anchor="middle" fill="#666">100</text>
  <line x1="70" y1="90.0" x2="330" y2="90.0" stroke="#e6e6e6"/>
  <text x="64" y="93.0" font-size="9" text-anchor="end" fill="#666">-4</text>
  <line x1="70" y1="136.2" x2="330" y2="136.2" stroke="#e6e6e6"/>
  <text x="64" y="139.2" font-size="9" text-anchor="end" fill="#666">-3</text>
  <line x1="70" y1="182.3" x2="330" y2="182.3" stroke="#e6e6e6"/>
  <text x="64" y="185.3" font-size="9" text-anchor="end" fill="#666">-2</text>
  <line x1="70" y1="228.5" x2="330" y2="228.5" stroke="#e6e6e6"/>
  <text x="64" y="231.5" font-size="9" text-anchor="end" fill="#666">-1</text>
  <line x1="70" y1="274.6" x2="330" y2="274.6" stroke="#999"/>
  <text x="64" y="277.6" font-size="9" text-anchor="end" fill="#666">0</text>
  <line x1="70" y1="320.8" x2="330" y2="320.8" stroke="#e6e6e6"/>
  <text x="64" y="323.8" font-size="9" text-anchor="end" fill="#666">+1</text>
  <rect x="70" y="90" width="260" height="240" fill="none" stroke="#333"/>
  <polyline points="{{ct_suc_px:svg}}" fill="none" stroke="#1a63a8" stroke-width="2"/>
  <polyline points="{{ct_pre_px:svg}}" fill="none" stroke="#c0392b" stroke-width="2"/>
  <polyline points="{{cm_suc_px:svg}}" fill="none" stroke="#1a63a8" stroke-width="1.6" stroke-dasharray="6 3"/>
  <polyline points="{{cm_pre_px:svg}}" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 3"/>
  <line x1="{{xc_px:svg}}" y1="90" x2="{{xc_px:svg}}" y2="330" stroke="#2e7d32" stroke-width="1.2"/>
  <line x1="{{xm_px:svg}}" y1="90" x2="{{xm_px:svg}}" y2="330" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="{{xc_px + 4:svg}}" y="102" font-size="9" fill="#2e7d32">costaneras</text>
  <text x="{{xm_px + 4:svg}}" y="318" font-size="9" fill="#2e7d32">largueros</text>
  <text x="200" y="362" font-size="9.5" text-anchor="middle" fill="#555">área efectiva A, m² (escala logarítmica)</text>
  <line x1="70" y1="380" x2="100" y2="380" stroke="#333" stroke-width="2"/>
  <text x="104" y="383" font-size="9" fill="#555">techo</text>
  <line x1="150" y1="380" x2="180" y2="380" stroke="#333" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="184" y="383" font-size="9" fill="#555">muro</text>
  <text x="230" y="383" font-size="9" fill="#1a63a8">succión</text>
  <text x="280" y="383" font-size="9" fill="#c0392b">presión</text>

  <!-- ═══ B · presiones de diseño ═══ -->
  <line x1="356" y1="56" x2="356" y2="380" stroke="#e4e4e4"/>
  <text x="370" y="64" font-size="11" fill="#1a63a8" font-weight="bold">B · Presiones de diseño, kgf/m²</text>

  <rect x="370" y="78" width="296" height="112" fill="#f6f8fa" stroke="#e4e4e4"/>
  <text x="382" y="98" font-size="10.5" fill="#222" font-weight="bold">Costaneras de techo</text>
  <text x="382" y="114" font-size="9.5" fill="#555">L = {{L_cos:m}} m · s = {{s_cos:m}} m · A = {{A_cos:m^2}} m²</text>
  <text x="382" y="132" font-size="9.5" fill="#555">(GC_p) = {{round(GCt_suc*100)/100}} ({{zona_cos}}) y +{{round(GCt_pre*100)/100}}</text>
  <text x="382" y="156" font-size="12" fill="#1a63a8" font-weight="bold">succión {{p_cos_suc:kgf/m^2}}</text>
  <text x="382" y="176" font-size="12" fill="#c0392b" font-weight="bold">presión +{{p_cos_pre:kgf/m^2}}</text>

  <rect x="370" y="202" width="296" height="112" fill="#f6f8fa" stroke="#e4e4e4"/>
  <text x="382" y="222" font-size="10.5" fill="#222" font-weight="bold">Largueros de muro</text>
  <text x="382" y="238" font-size="9.5" fill="#555">L = {{L_lar:m}} m · s = {{s_lar:m}} m · A = {{A_lar:m^2}} m²</text>
  <text x="382" y="256" font-size="9.5" fill="#555">(GC_p) = {{round(GCm_suc*100)/100}} (zona 5) y +{{round(GCm_pre*100)/100}}</text>
  <text x="382" y="280" font-size="12" fill="#1a63a8" font-weight="bold">succión {{p_lar_suc:kgf/m^2}}</text>
  <text x="382" y="300" font-size="12" fill="#c0392b" font-weight="bold">presión +{{p_lar_pre:kgf/m^2}}</text>

  <text x="370" y="336" font-size="9.5" fill="#555">q_h = {{q_h:kgf/m^2}} · K_d = {{K_d}} · GC_pi = ±{{round(GC_pi*1000)/1000}}</text>
  <text x="370" y="352" font-size="9.5" fill="#555">a = {{a_tec:m}} m en el techo y {{a_mur:m}} m en los muros</text>
  <text x="370" y="368" font-size="8.5" fill="#999">Ec. (19) · mínimo §9.2.2: {{p_min:kgf/m^2}} kgf/m² · + hacia la superficie</text>
</svg>
