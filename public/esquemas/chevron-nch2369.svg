<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 664" font-family="Segoe UI, Arial, sans-serif">
  <!-- Esquema paramétrico de la planilla `chevron-nch2369`.
       Derivado de /ejemplos/chevron-nch2369-dos-estados.svg (la figura del post,
       estática): misma composición de dos paneles, pero cada número lee la hoja.
       El viewBox se estiró hacia abajo para la banda de valores. -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a63a8"/>
    </marker>
  </defs>
  <rect width="880" height="664" fill="#ffffff"/>
  <text x="440" y="25" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El mismo paño, los dos estados: el que entrega el modelo y el que manda diseñar 8.6.6</text>

  <!-- ================= PANEL A — ANÁLISIS ELÁSTICO ================= -->
  <text x="40" y="55" font-size="12" fill="#2c7a4b" font-weight="bold">A · Análisis elástico</text>
  <text x="40" y="71" font-size="10" fill="#666">Las dos diagonales trabajan y apoyan la viga en el centro</text>

  <line x1="80" y1="110" x2="380" y2="110" stroke="#333" stroke-width="5"/>
  <line x1="80" y1="110" x2="80" y2="260" stroke="#333" stroke-width="3.5"/>
  <line x1="380" y1="110" x2="380" y2="260" stroke="#333" stroke-width="3.5"/>
  <line x1="80" y1="260" x2="230" y2="110" stroke="#2c7a4b" stroke-width="3.5"/>
  <line x1="380" y1="260" x2="230" y2="110" stroke="#2c7a4b" stroke-width="3.5"/>
  <path d="M72 260 l16 0 M74 265 l12 0" stroke="#555" stroke-width="1.6"/>
  <path d="M372 260 l16 0 M374 265 l12 0" stroke="#555" stroke-width="1.6"/>
  <path d="M230 110 l-9 15 l18 0 z" fill="#2c7a4b" opacity="0.85"/>
  <text x="376" y="136" font-size="9.5" text-anchor="end" fill="#2c7a4b" font-weight="bold">apoyo central</text>
  <g stroke="#555" stroke-width="1">
    <line x1="100" y1="88" x2="100" y2="105" marker-end="url(#ar)"/>
    <line x1="150" y1="88" x2="150" y2="105" marker-end="url(#ar)"/>
    <line x1="200" y1="88" x2="200" y2="105" marker-end="url(#ar)"/>
    <line x1="260" y1="88" x2="260" y2="105" marker-end="url(#ar)"/>
    <line x1="310" y1="88" x2="310" y2="105" marker-end="url(#ar)"/>
    <line x1="360" y1="88" x2="360" y2="105" marker-end="url(#ar)"/>
  </g>
  <text x="84" y="80" font-size="9.5" fill="#555">w = {{w:tonf/m}} tonf/m</text>
  <text x="86" y="152" font-size="9.5" fill="#555">L = {{L:m}} m · H = {{H:m}} m · {{grados}}°</text>

  <text x="40" y="316" font-size="10.5" fill="#333" font-weight="bold">Momento en la viga</text>
  <line x1="80" y1="340" x2="380" y2="340" stroke="#333" stroke-width="1.2"/>
  <path d="M80 340 L117 341 L155 341 L192 338 L230 338 L267 338 L305 341 L342 341 L380 340 Z"
        fill="#2c7a4b" opacity="0.35" stroke="#2c7a4b" stroke-width="1.2"/>
  <line x1="230" y1="338" x2="230" y2="300" stroke="#2c7a4b" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text x="236" y="300" font-size="11.5" fill="#2c7a4b" font-weight="bold">{{M_ela:tonf*m}} tonf·m</text>
  <text x="236" y="313" font-size="8.5" fill="#666">(a esta escala, casi una línea)</text>

  <rect x="40" y="368" width="340" height="30" rx="4" fill="#eaf6ef" stroke="#2c7a4b" stroke-width="1.1"/>
  <text x="210" y="388" font-size="11" text-anchor="middle" fill="#2c7a4b" font-weight="bold">Z requerido = {{Z_req:cm^3}} cm³ — cualquier perfil sirve</text>

  <!-- ================= PANEL B — 8.6.6 ================= -->
  <text x="460" y="55" font-size="12" fill="#c0392b" font-weight="bold">B · El estado que ordena 8.6.6</text>
  <text x="460" y="71" font-size="10" fill="#666">Una ya pandeó; la otra todavía no fluye. Y la viga no tiene apoyo central</text>

  <line x1="500" y1="110" x2="800" y2="110" stroke="#333" stroke-width="5"/>
  <line x1="500" y1="110" x2="500" y2="260" stroke="#333" stroke-width="3.5"/>
  <line x1="800" y1="110" x2="800" y2="260" stroke="#333" stroke-width="3.5"/>
  <path d="M500 260 Q600 208 650 110" fill="none" stroke="#c07a00" stroke-width="3.5"/>
  <line x1="800" y1="260" x2="650" y2="110" stroke="#c0392b" stroke-width="3.5"/>
  <path d="M492 260 l16 0 M494 265 l12 0" stroke="#555" stroke-width="1.6"/>
  <path d="M792 260 l16 0 M794 265 l12 0" stroke="#555" stroke-width="1.6"/>

  <text x="548" y="238" font-size="10.5" fill="#c07a00" font-weight="bold">0,3 P_ne = {{P_res:tonf}} tonf</text>
  <text x="504" y="278" font-size="8.5" fill="#8a6d20">capacidad residual — ya pandeó</text>
  <text x="768" y="238" font-size="10.5" text-anchor="end" fill="#c0392b" font-weight="bold">T_ye = {{T_ye:tonf}} tonf</text>
  <text x="796" y="278" font-size="8.5" text-anchor="end" fill="#8a2f24">capacidad esperada — aún no fluye</text>

  <line x1="650" y1="116" x2="650" y2="174" stroke="#c0392b" stroke-width="4" marker-end="url(#rd)"/>
  <text x="690" y="148" font-size="12" fill="#c0392b" font-weight="bold">{{V_cru:tonf}} tonf</text>
  <!-- Halo: la flecha del desequilibrio pasa justo por encima de este rótulo. -->
  <text x="712" y="161" font-size="8.5" fill="#8a2f24" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">= (T_ye − 0,3P_ne) · sen {{grados}}°</text>
  <line x1="655" y1="98" x2="740" y2="98" stroke="#1a63a8" stroke-width="2.4" marker-end="url(#bl)"/>
  <text x="748" y="102" font-size="9.5" fill="#1a63a8" font-weight="bold">N = {{N_cru:tonf}} tonf</text>

  <text x="460" y="316" font-size="10.5" fill="#333" font-weight="bold">Momento en la viga <tspan font-weight="normal" fill="#666">— misma escala que A</tspan></text>
  <line x1="500" y1="340" x2="800" y2="340" stroke="#333" stroke-width="1.2"/>
  <path d="M500 340 L537 364 L575 387 L612 409 L650 430 L687 409 L725 387 L762 364 L800 340 Z"
        fill="#c0392b" opacity="0.28" stroke="#c0392b" stroke-width="1.4"/>
  <line x1="650" y1="430" x2="712" y2="430" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text x="718" y="434" font-size="12.5" fill="#c0392b" font-weight="bold">{{M_cru:tonf*m}} tonf·m</text>

  <rect x="460" y="452" width="340" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/>
  <text x="630" y="472" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">Con el techo de 0,7R₁: M = {{M_dis:tonf*m}} tonf·m</text>

  <!-- ================= RAZÓN ================= -->
  <rect x="40" y="500" width="800" height="42" rx="5" fill="#fff8e6" stroke="#c07a00" stroke-width="1.2"/>
  <text x="60" y="519" font-size="12" fill="#c07a00" font-weight="bold">{{raz_cru}} ×</text>
  <text x="118" y="519" font-size="10.5" fill="#5a4a20">es la razón entre los dos momentos —antes de los techos de 8.6.6—. Tan grande porque en un chevron el modelo elástico casi</text>
  <text x="118" y="534" font-size="10.5" fill="#5a4a20">no le pone flexión a la viga: le entrega <tspan font-weight="bold">axial</tspan>. Con el techo de 0,7R₁ el momento baja a {{M_dis:tonf*m}} tonf·m y la razón a <tspan font-weight="bold">{{raz_dis}} ×</tspan>.</text>

  <!-- banda de valores vivos: lo que la hoja calcula, bajo el dibujo -->
  <line x1="40" y1="562" x2="840" y2="562" stroke="#c8d2dd" stroke-width="1"/>
  <text x="40" y="580" font-size="9.5" fill="#333">La diagonal la dimensiona la ductilidad: □ {{B_d:mm}}×{{B_d:mm}}×{{t_d:mm}} soldado, b/t = {{bt_d}} ≤ {{lam_md}} de la Tabla 9 · L_c/r = {{esb_d}} ≤ {{esb_max}} · uso en compresión {{u_d}}</text>
  <text x="40" y="596" font-size="9.5" fill="#c0392b">El de catálogo □ 200×200×5,0 no pasa por ninguna de las dos puertas: b/t = {{bt_x}} son {{u_btx}} veces el límite, y la exención lo deja en uso {{u_exen}}</text>
  <text x="40" y="612" font-size="9.5" fill="#1a63a8">Techo 1 de 8.6.6: T = mín(T_ye, 0,7R₁·P_E) = {{T_dis:tonf}} tonf → el desequilibrio cae a {{V_dis:tonf}} y el axial a {{N_dis:tonf}} tonf, un {{baja*100}} % menos de momento</text>
  <text x="40" y="628" font-size="9.5" fill="#333">La viga H 600×300×138,5: φP_n = {{Rd_pv:tonf}} tonf · φM_n = {{Rd_mv:tonf*m}} tonf·m con el alma NO compacta ({{htw}} &gt; {{lam_pw}} → F4 con R_pc = {{R_pc}})</text>
  <text x="40" y="644" font-size="9.5" fill="#c0392b" font-weight="bold">H1-1a: {{u_v}} ✓ — y la H 400×200×109,5 que sugiere el modelo elástico se va a {{u_w}} ✗</text>
</svg>
