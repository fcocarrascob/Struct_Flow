<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="700" fill="#ffffff"/>
  <text x="430" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Viga-columna W250×58, L = {{L:m}} m: P_u = {{P_u:tonf}} tonf + viento w_u = {{w_u:tonf/m}} tonf/m</text>

  <!-- ===================== ELEVACION (izquierda) ===================== -->
  <rect x="212" y="86" width="12" height="250" fill="#e8edf2" stroke="#333" stroke-width="1.4"/>
  <text x="236" y="128" font-size="10.5" fill="#333" font-weight="bold">W250×58</text>

  <path d="M 218 336 L 206 352 L 230 352 Z" fill="none" stroke="#333" stroke-width="1.4"/>
  <line x1="198" y1="352" x2="238" y2="352" stroke="#333" stroke-width="1.4"/>
  <circle cx="218" cy="86" r="4" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="246" y="356" font-size="9.5" fill="#666">biarticulada</text>

  <!-- carga axial -->
  <line x1="218" y1="54" x2="218" y2="78" stroke="#c0392b" stroke-width="2.2"/>
  <path d="M 218 82 L 213 72 L 223 72 Z" fill="#c0392b"/>
  <text x="230" y="62" font-size="11" fill="#c0392b" font-weight="bold">P_u = {{P_u:tonf}} tonf</text>

  <!-- viento distribuido -->
  <g stroke="#1a63a8" stroke-width="1.6">
    <line x1="160" y1="101" x2="200" y2="101"/>
    <line x1="160" y1="136" x2="200" y2="136"/>
    <line x1="160" y1="171" x2="200" y2="171"/>
    <line x1="160" y1="206" x2="200" y2="206"/>
    <line x1="160" y1="241" x2="200" y2="241"/>
    <line x1="160" y1="276" x2="200" y2="276"/>
    <line x1="160" y1="311" x2="200" y2="311"/>
    <line x1="160" y1="96" x2="160" y2="316"/>
  </g>
  <g fill="#1a63a8">
    <path d="M 208 101 L 198 96 L 198 106 Z"/>
    <path d="M 208 136 L 198 131 L 198 141 Z"/>
    <path d="M 208 171 L 198 166 L 198 176 Z"/>
    <path d="M 208 206 L 198 201 L 198 211 Z"/>
    <path d="M 208 241 L 198 236 L 198 246 Z"/>
    <path d="M 208 276 L 198 271 L 198 281 Z"/>
    <path d="M 208 311 L 198 306 L 198 316 Z"/>
  </g>
  <text x="152" y="186" font-size="10.5" fill="#1a63a8" text-anchor="end" font-weight="bold">w_u = {{w_u:tonf/m}} tonf/m</text>
  <text x="152" y="200" font-size="9.5" fill="#1a63a8" text-anchor="end">(viento del paño)</text>

  <!-- puntal fuera del plano -->
  <circle cx="218" cy="211" r="5" fill="#1c7c3c"/>
  <line x1="223" y1="211" x2="272" y2="211" stroke="#1c7c3c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="278" y="202" font-size="9.5" fill="#1c7c3c" font-weight="bold">puntal a media altura</text>
  <text x="278" y="215" font-size="9.5" fill="#1c7c3c">(fuera del plano):</text>
  <text x="278" y="228" font-size="9.5" fill="#1c7c3c">L_cy = L_b = {{L_bA:m}} m</text>
  <text x="278" y="244" font-size="9" fill="#888">L_p = {{L_p:m}} · L_r = {{L_r:m}} m</text>

  <!-- cota -->
  <!-- la vertical va en dos tramos: entera tacharía el rótulo del viento, que le queda encima -->
  <line x1="106" y1="86" x2="106" y2="174" stroke="#888" stroke-width="1"/>
  <line x1="106" y1="208" x2="106" y2="336" stroke="#888" stroke-width="1"/>
  <line x1="102" y1="86" x2="110" y2="86" stroke="#888"/>
  <line x1="102" y1="336" x2="110" y2="336" stroke="#888"/>
  <text x="98" y="254" font-size="10" fill="#888" text-anchor="end">{{L:m}} m</text>
  <text x="106" y="378" font-size="9" fill="#888">En el plano de flexión no hay puntal:</text>
  <text x="106" y="391" font-size="9" fill="#888">L_cx = L_c1 = {{L:m}} m.</text>

  <!-- ===================== DIAGRAMA DE MOMENTOS (derecha) ===================== -->
  <text x="650" y="62" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">El momento que entra a H1-1 no es el del análisis</text>
  <line x1="520" y1="86" x2="520" y2="296" stroke="#333" stroke-width="1.2"/>
  <!-- parabola de primer orden: flecha escalada a 120 px; anchos FIJOS a mano -->
  <path d="M 520 86 Q 680 191 520 296" fill="#eaf1f8" fill-opacity="0.7" stroke="#1a63a8" stroke-width="2"/>
  <!-- amplificada por B_1: 120 px x 1,34 = 161 px -->
  <path d="M 520 86 Q 734 191 520 296" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="602" y1="191" x2="624" y2="191" stroke="#c0392b" stroke-width="1.6"/>
  <path d="M 634 191 L 624 186 L 624 196 Z" fill="#c0392b"/>
  <text x="598" y="185" font-size="10" fill="#c0392b" text-anchor="end">+ P·δ</text>
  <text x="512" y="248" font-size="10.5" fill="#1a63a8" font-weight="bold" text-anchor="end">M_u = {{M_u:tonf*m}}</text>
  <text x="512" y="262" font-size="9.5" fill="#1a63a8" text-anchor="end">(1.er orden)</text>
  <text x="648" y="162" font-size="10.5" fill="#c0392b" font-weight="bold">M_r = B₁·M_u = {{M_r:tonf*m}} tonf·m</text>
  <text x="648" y="176" font-size="9.5" fill="#c0392b">B₁ = {{round(B_1,3)}} → infla el momento {{round(infla,1)}} %</text>

  <rect x="470" y="312" width="376" height="80" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="484" y="332" font-size="10.5" fill="#333">P_e1 = π²EI_x/L_c1² = {{P_e1:tonf}} tonf (Ec. A-8-5, con EI pleno:</text>
  <text x="484" y="348" font-size="10.5" fill="#333">método de la longitud efectiva, no análisis directo).</text>
  <text x="484" y="366" font-size="10.5" fill="#333">P_u es {{round(ratio,3)}} de esa carga de Euler. Y C_m = 1,0 no se cita:</text>
  <text x="484" y="382" font-size="10.5" fill="#333">sale de ψ = π²·5/48 − 1 = {{round(psi,3)}} ≈ 0 (Tabla C-A-8.1, fila 1).</text>

  <!-- ===================== EL PRESUPUESTO H1-1a ===================== -->
  <line x1="46" y1="418" x2="814" y2="418" stroke="#d5dbe2" stroke-width="1"/>
  <text x="60" y="442" font-size="11.5" fill="#222" font-weight="bold">El presupuesto de la Ec. H1-1a: P_r/P_c + (8/9)·M_r/M_c ≤ 1,0</text>
  <!-- escala 250 px por unidad de uso desde x=60; el umbral 1,0 va en segmentos, uno por
       banda de barra: una vertical continua tacharía los rótulos, que cruzan todo el ancho -->
  <g stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4">
    <line x1="310" y1="456" x2="310" y2="468"/>
    <line x1="310" y1="490" x2="310" y2="520"/>
    <line x1="310" y1="558" x2="310" y2="588"/>
  </g>
  <text x="310" y="452" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">1,0</text>

  <!-- A: con puntal · anchos: 0,546 y 0,389 a 250 px/uso -->
  <text x="60" y="474" font-size="10" fill="#1c7c3c" font-weight="bold">A) con puntal · φP_n = {{Rd_PA:tonf}} tonf · φM_n = {{Rd_MA:tonf*m}} tonf·m</text>
  <text x="60" y="487" font-size="9.5" fill="#888">C_b = {{round(C_bA,3)}} sobre el tramo de {{L_bA:m}} m; la recta F2-2 amplificada pasa M_p, así que manda el tope φM_p.</text>
  <rect x="60" y="494" width="136" height="20" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.6"/>
  <rect x="196" y="494" width="97" height="20" fill="#dbeadb" stroke="#1c7c3c" stroke-width="1.3"/>
  <text x="128" y="508" font-size="9.5" text-anchor="middle" fill="#1c7c3c">{{round(u_PA,2)}} axial</text>
  <text x="244" y="508" font-size="9.5" text-anchor="middle" fill="#1c7c3c">+{{round((8/9)*u_MA,2)}} flexión</text>
  <text x="330" y="509" font-size="11" fill="#1c7c3c" font-weight="bold">= {{round(u_A,3)}} ✓</text>

  <!-- B: sin puntal · anchos: 1,478 y 0,522 a 250 px/uso -->
  <text x="60" y="542" font-size="10" fill="#c0392b" font-weight="bold">B) sin puntal · φP_n = {{Rd_PB:tonf}} tonf (÷{{round(caida_P,2)}}) · φM_n = {{Rd_MB:tonf*m}} tonf·m (÷{{round(caida_M,2)}})</text>
  <text x="60" y="555" font-size="9.5" fill="#888">C_b baja a {{round(C_bB,3)}} sobre los {{L_bB:m}} m completos, y la esbeltez sube a {{round(lam_yB,0)}}: el pandeo pasa a ser elástico (E3-3).</text>
  <rect x="60" y="562" width="370" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <rect x="430" y="562" width="130" height="20" fill="#f8d7d3" stroke="#c0392b" stroke-width="1.3"/>
  <text x="245" y="576" font-size="9.5" text-anchor="middle" fill="#c0392b">{{round(u_PB,2)}} axial</text>
  <text x="495" y="576" font-size="9.5" text-anchor="middle" fill="#c0392b">+{{round((8/9)*u_MB,2)}} flexión</text>
  <text x="572" y="577" font-size="11" fill="#c0392b" font-weight="bold">= {{round(u_B,2)}} ✗ &#8212; el doble del presupuesto</text>

  <text x="60" y="604" font-size="9.5" fill="#888">Sin B₁ (momento de primer orden) el caso A daría {{round(u_sinB1,3)}}; sumar los usos amplificados sin el crédito 8/9 daría {{round(u_suma,3)}}.</text>

  <!-- ===================== BANDA DE VALORES ===================== -->
  <line x1="46" y1="622" x2="814" y2="622" stroke="#d5dbe2" stroke-width="1"/>
  <text x="46" y="644" font-size="11" fill="#333">Demanda: P_u = {{P_u:tonf}} tonf y M_u = {{M_u:tonf*m}} tonf·m de primer orden. Por separado cada verificación sobra — {{round(u_PA,2)}} a compresión, {{round(u_MA1,2)}} a flexión.</text>
  <text x="46" y="662" font-size="11" fill="#333">La variable que habla es el momento amplificado: B₁ = {{round(B_1,3)}} lleva M_u a M_r = {{M_r:tonf*m}} tonf·m, y son {{round((u_A - u_sinB1)*100,1)}} puntos de uso que el primer orden no ve.</text>
  <text x="46" y="680" font-size="11" fill="#c0392b" font-weight="bold">Gobierna la interacción (Ec. H1-1a), no ninguno de los dos sumandos: uso {{round(u_A,3)}} con puntal. Sin puntal se va al doble del presupuesto — un factor {{round(razon,2)}}.</text>
</svg>
