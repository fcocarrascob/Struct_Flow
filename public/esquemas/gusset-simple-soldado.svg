<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 465 424" font-family="Segoe UI, Arial, sans-serif">
  <!-- Esquema paramétrico de la planilla `gusset-simple-soldado`.
       Derivado de nudo-simple.svg: SOLO el panel A (soldado). Mismas
       coordenadas que el original; el recorte lo hace el viewBox, extendido
       hacia abajo para la banda de valores que lee la hoja. -->
  <defs>
    <marker id="bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a63a8"/>
    </marker>
    <clipPath id="clipA"><polygon points="131.2,96 412.8,96 185.7,318 50,182.3"/></clipPath>
  </defs>
  <rect x="0" y="28" width="465" height="424" fill="#ffffff"/>
  <text x="232" y="44" font-size="11.5" fill="#1a63a8" text-anchor="middle" font-weight="bold">SOLDADO — el detalle chileno típico</text>
  <rect x="58" y="50" width="370" height="46" fill="#dcd8d0" stroke="#666" stroke-width="1.2"/>
  <text x="66" y="68" font-size="10" fill="#555">viga — ala inferior</text>
  <polygon points="131.2,96 412.8,96 185.7,318 50,182.3" fill="#eef2f7" stroke="#333" stroke-width="1.6"/>
  <line x1="272" y1="96" x2="51.4" y2="316.6" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
  <circle cx="272" cy="96" r="4" fill="#c0392b"/>
  <polygon points="185.7,151.2 216.8,182.3 71.2,327.9 40.1,296.8" fill="#dfe5ec" fill-opacity="0.55" stroke="#333" stroke-width="1.6"/>
  <g clip-path="url(#clipA)">
  <polygon points="113.1,223.8 144.2,254.9 289.4,254.9 113.1,78.6" fill="none" stroke="#1a63a8" stroke-width="1.1" stroke-dasharray="5 3"/>
  <line x1="113.1" y1="78.6" x2="289.4" y2="254.9" stroke="#1a63a8" stroke-width="1.8" stroke-dasharray="5 3"/>
  </g>
  <polygon points="113.1,223.8 144.2,254.9 258.8,224.2 143.8,109.2" fill="#1a63a8" fill-opacity="0.20" stroke="#1a63a8" stroke-width="1.3"/>
  <line x1="143.8" y1="109.2" x2="258.8" y2="224.2" stroke="#1a63a8" stroke-width="3.4"/>
  <line x1="128.7" y1="239.3" x2="197" y2="171" stroke="#1a63a8" stroke-width="1.4" marker-end="url(#bl)"/>
  <line x1="185.7" y1="151.2" x2="113.1" y2="223.8" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="216.8" y1="182.3" x2="144.2" y2="254.9" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="185" y1="214.1" x2="241.9" y2="294.3" stroke="#c0392b" stroke-width="0.8"/>
  <text x="246" y="300" font-size="9.8" fill="#c0392b" font-weight="bold">4 filetes de {{pier:mm}} mm, l = {{l_w:cm}} cm</text>
  <line x1="204.5" y1="215.2" x2="243.5" y2="317.5" stroke="#1a63a8" stroke-width="0.8"/>
  <text x="246" y="324" font-size="10" fill="#1a63a8" font-weight="bold">dos bandas, no una</text>
  <text x="246" y="338" font-size="9.5" fill="#1a63a8">llena 30° → compresión (Com. J4.4)</text>
  <text x="246" y="351" font-size="9.5" fill="#1a63a8">punteada 45° → tracción (Com. J4.1)</text>
  <text x="246" y="364" font-size="9.5" fill="#c0392b">acá la de tracción se sale: el gusset la recorta</text>
  <line x1="86" y1="313.1" x2="61.8" y2="350.1" stroke="#222" stroke-width="0.8"/>
  <text x="58" y="356" font-size="9.8" fill="#222" font-weight="bold">□ {{B_t:mm}}×{{B_t:mm}}×{{t_t:mm}} ranurado</text>
  <text x="58" y="369" font-size="9.5" fill="#555">gusset t_g = {{t_g:mm}} mm</text>
  <line x1="272" y1="96" x2="310" y2="118.4" stroke="#c0392b" stroke-width="0.8"/>
  <text x="316" y="122" font-size="9.8" fill="#c0392b" font-weight="bold">PT sin excentricidad</text>

  <!-- banda de valores vivos: lo que la hoja calcula, bajo el dibujo -->
  <line x1="9" y1="390" x2="457" y2="390" stroke="#c8d2dd" stroke-width="1"/>
  <text x="9" y="406" font-size="9.5" fill="#333">Demanda T_r = {{T_r:tonf}} tonf en el eje → N = {{N_i:tonf}} y V = {{V_i:tonf}} tonf en la interfaz</text>
  <text x="9" y="422" font-size="9.5" fill="#1a63a8">Whitmore: la de 45° pide {{B_t + 2*l_w*tan(pi/4):cm}} cm y el contorno da {{w_disp:cm}} → w_t = {{w_t:cm}} cm · w_c = {{w_c:cm}} cm</text>
  <text x="9" y="438" font-size="9.5" fill="#c0392b" font-weight="bold">Gobierna la ROTURA DEL TUBO: φR_n = {{Rd_dro:tonf}} tonf → uso {{u_dro}}   (pandeo del gusset, uso {{u_pan}})</text>
</svg>
