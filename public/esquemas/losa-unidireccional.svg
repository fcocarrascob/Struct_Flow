  <text x="55" y="558" font-size="11" fill="#333">El tanteo de 17 cm reprueba por {{u_fl1}} veces, y tambi&#233;n contra el l&#237;mite m&#225;s blando de todos, &#8467;n/240 ({{u_fl1_240}}).</text>
  <text x="55" y="578" font-size="11" fill="#333">La variable que hace hablar al ejemplo: I_e/I_g pasa de {{round(r_Ie1*100, 1)}} % en 17 cm a {{round(r_Ie2*100, 1)}} % en 21 cm, y la secci&#243;n casi deja de fisurar.</text>
  <text x="55" y="598" font-size="11" fill="#333">Calculada con la secci&#243;n bruta, sin 24.2.3.5, esa misma losa de 17 cm dar&#237;a {{fl_tot1_g:mm}} mm y uso {{u_fl1_g}}: un factor {{factor_g}} del lado inseguro.</text>
  <text x="55" y="618" font-size="11" fill="#b02a1a" font-weight="bold">Gobierna la losa de 21 cm: {{gobierna}} &#8212; uso m&#225;ximo {{u_max}}.</text>
