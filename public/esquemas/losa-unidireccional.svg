  <text x="55" y="248" font-size="9.5" fill="#666">Corte a d de la cara, Tabla 22.5.5.1(c): V_u = {{V_u2:kN}} kN/m contra &#966;V_c = {{Rd_V2:kN}} kN/m,</text>
