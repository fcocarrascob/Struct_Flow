<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="system-ui, sans-serif">
  <!-- Esquema paramétrico de `llave-corte-generica`: planta del pedestal con las
       dos chapas y las distancias de borde que gobiernan el breakout, y elevación
       con la placa, el mortero, la parte efectiva de la llave y el perno. -->

  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Llave de corte bajo placa base — planta y elevación a escala</text>

  <!-- =============== PLANTA =============== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">PLANTA</text>

  <!-- Pedestal -->
  <rect x="{{px(-PED_X/2):svg}}" y="{{py(-PED_Y/2):svg}}" width="{{PED_X/(1 mm)*esc:svg}}" height="{{PED_Y/(1 mm)*esc:svg}}"
        fill="#f4f6f8" stroke="#333" stroke-width="1.6"/>

  <!-- Placa base, de ancho B_bp -->
  <rect x="{{px(-B_bp/2):svg}}" y="{{py(-B_bp/2):svg}}" width="{{B_bp/(1 mm)*esc:svg}}" height="{{B_bp/(1 mm)*esc:svg}}"
        fill="none" stroke="#9aa3ab" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Chapa que toma V_ux: orientada según Y, ancho bY_sl -->
  <rect x="{{px(0 mm) - t_px/2:svg}}" y="{{py(-bY_sl/2):svg}}" width="{{t_px:svg}}" height="{{bY_sl/(1 mm)*esc:svg}}"
        fill="{{col_chapa}}" stroke="none"/>
  <!-- Chapa que toma V_uy: orientada según X, ancho bX_sl, desplazada y_chapa -->
  <rect x="{{px(-bX_sl/2):svg}}" y="{{py(y_chapa) - t_px/2:svg}}" width="{{bX_sl/(1 mm)*esc:svg}}" height="{{t_px:svg}}"
        fill="{{col_chapa}}" stroke="none"/>

  <!-- Distancia de borde que gobierna el breakout en X -->
  <line x1="{{px(0 mm):svg}}" x2="{{px(PED_X/2):svg}}" y1="{{py(-bY_sl/2) - 10:svg}}" y2="{{py(-bY_sl/2) - 10:svg}}"
        stroke="{{col_cb}}" stroke-width="1.3"/>
  <line x1="{{px(PED_X/2):svg}}" x2="{{px(PED_X/2):svg}}" y1="{{py(-bY_sl/2) - 15:svg}}" y2="{{py(-bY_sl/2) - 5:svg}}" stroke="{{col_cb}}" stroke-width="1.3"/>
  <text x="{{px(PED_X/2) + 6:svg}}" y="{{py(-bY_sl/2) - 12:svg}}" font-size="10" fill="{{col_cb}}">c_a1,X = {{ca1_x:mm}} mm</text>

  <!-- Área de breakout en X, proyectada sobre el borde. El alto real es
       bY_sl + 3·c_a1 y suele salirse del pedestal: se dibuja recortado a él y el
       valor va rotulado. -->
  <rect x="{{px(t_sl/2):svg}}" y="{{py(-min(bY_sl + 3*ca1_x, PED_Y)/2):svg}}"
        width="{{ca1_x/(1 mm)*esc:svg}}" height="{{min(bY_sl + 3*ca1_x, PED_Y)/(1 mm)*esc:svg}}"
        fill="{{col_cb}}" fill-opacity="0.08" stroke="{{col_cb}}" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Cotas de planta -->
  <text x="{{px(0 mm):svg}}" y="{{py(PED_Y/2) + 16:svg}}" font-size="10.5" text-anchor="middle" fill="#222"
        stroke="#fff" stroke-width="3" paint-order="stroke">pedestal {{PED_X:mm}} × {{PED_Y:mm}} mm</text>
  <text x="{{px(-PED_X/2) - 8:svg}}" y="{{py(0 mm):svg}}" font-size="10" text-anchor="end" fill="{{col_chapa}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">chapas {{bY_sl:mm}} y {{bX_sl:mm}} × {{t_sl:mm}} mm</text>
  <text x="{{px(PED_X/2) + 6:svg}}" y="{{py(-bY_sl/2) + 6:svg}}" font-size="9.5" fill="{{col_cb}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">A_Vc,X = {{AVc_x/(1000 mm^2)}} ·10³ mm²</text>
  <text x="{{px(PED_X/2) + 6:svg}}" y="{{py(-bY_sl/2) + 22:svg}}" font-size="9.5" fill="{{col_cb}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">{{n_chapas}} chapa(s) por dirección</text>

  <!-- =============== ELEVACIÓN =============== -->
  <text x="40" y="{{ey(0 mm) - 46:svg}}" font-size="12" fill="#555" font-weight="bold">ELEVACIÓN (corte en X)</text>

  <!-- Pedestal -->
  <rect x="{{px(-PED_X/2):svg}}" y="{{ey(0 mm):svg}}" width="{{PED_X/(1 mm)*esc:svg}}" height="{{H_PED/(1 mm)*esc:svg}}"
        fill="#f4f6f8" stroke="#333" stroke-width="1.6"/>

  <!-- Mortero y placa base -->
  <rect x="{{px(-B_bp/2):svg}}" y="{{ey(0 mm) - t_gr/(1 mm)*esc:svg}}" width="{{B_bp/(1 mm)*esc:svg}}" height="{{max(2, t_gr/(1 mm)*esc):svg}}"
        fill="#e7eaed" stroke="#aaa" stroke-width="0.8"/>
  <rect x="{{px(-B_bp/2):svg}}" y="{{ey(0 mm) - (t_gr + t_bp)/(1 mm)*esc:svg}}" width="{{B_bp/(1 mm)*esc:svg}}" height="{{max(2, t_bp/(1 mm)*esc):svg}}"
        fill="#9aa3ab" stroke="none"/>

  <!-- Llave: la parte efectiva, 2·t_sl, y el resto en trazo fino -->
  <rect x="{{px(0 mm) - t_px/2:svg}}" y="{{ey(0 mm):svg}}" width="{{t_px:svg}}" height="{{h_sl/(1 mm)*esc:svg}}"
        fill="none" stroke="{{col_chapa}}" stroke-width="0.8" stroke-dasharray="3 2"/>
  <rect x="{{px(0 mm) - t_px/2:svg}}" y="{{ey(0 mm):svg}}" width="{{t_px:svg}}" height="{{max(2, hef_sl/(1 mm)*esc):svg}}"
        fill="{{col_brg}}" stroke="none"/>

  <!-- Aplastamiento sobre la cara efectiva -->
  <line x1="{{px(0 mm) + t_px/2 + 3:svg}}" x2="{{px(0 mm) + t_px/2 + 16:svg}}" y1="{{ey(hef_sl/2):svg}}" y2="{{ey(hef_sl/2):svg}}"
        stroke="{{col_brg}}" stroke-width="1.6"/>
  <text x="{{px(0 mm) + t_px/2 + 20:svg}}" y="{{ey(hef_sl/2) + 4:svg}}" font-size="10" fill="{{col_brg}}">h_ef,sl = {{hef_sl:mm}} mm · e = {{exc:mm}} mm</text>

  <!-- Perno de anclaje a c_sl del eje de la llave -->
  <line x1="{{px(csl_X):svg}}" x2="{{px(csl_X):svg}}" y1="{{ey(0 mm) - (t_gr + t_bp)/(1 mm)*esc:svg}}" y2="{{ey(h_ef):svg}}"
        stroke="{{col_perno}}" stroke-width="2.2"/>
  <line x1="{{px(csl_X) - 7:svg}}" x2="{{px(csl_X) + 7:svg}}" y1="{{ey(h_ef):svg}}" y2="{{ey(h_ef):svg}}" stroke="{{col_perno}}" stroke-width="3"/>
  <text x="{{px(csl_X) + 10:svg}}" y="{{ey(h_ef) - 4:svg}}" font-size="10" fill="{{col_perno}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">h_ef = {{h_ef:mm}} mm (mín. {{hef_req:mm}})</text>
  <text x="{{px(csl_X) + 10:svg}}" y="{{ey(0 mm) + 34:svg}}" font-size="10" fill="{{col_perno}}"
        stroke="#fff" stroke-width="3" paint-order="stroke">c_sl = {{csl_X:mm}} mm</text>

  <!-- Flecha del corte -->
  <line x1="{{px(-B_bp/2) - 36:svg}}" x2="{{px(-B_bp/2) - 6:svg}}" y1="{{ey(0 mm) - (t_gr + t_bp/2)/(1 mm)*esc:svg}}" y2="{{ey(0 mm) - (t_gr + t_bp/2)/(1 mm)*esc:svg}}"
        stroke="#1a63a8" stroke-width="2"/>
  <text x="{{px(-B_bp/2) - 36:svg}}" y="{{ey(0 mm) - (t_gr + t_bp/2)/(1 mm)*esc - 6:svg}}" font-size="10" fill="#1a63a8">V_ux = {{V_ux:kN}} kN</text>
  <text x="{{px(-PED_X/2) - 8:svg}}" y="{{ey(H_PED/2):svg}}" font-size="10" text-anchor="end" fill="#555"
        stroke="#fff" stroke-width="3" paint-order="stroke">H_PED = {{H_PED:mm}} mm</text>

  <!-- =============== COLUMNA DE RESULTADOS =============== -->
  <line x1="600" y1="60" x2="600" y2="520" stroke="#ddd" stroke-width="1"/>
  <text x="620" y="66" font-size="11.5" fill="#222" font-weight="bold">Estados límite</text>

  <text x="620" y="92" font-size="10.5" fill="#333">Aplastamiento X · Y</text>
  <text x="830" y="92" font-size="10.5" text-anchor="end" fill="{{cu(max(u_brgx, u_brgy))}}" font-weight="bold">{{u_brgx}} · {{u_brgy}}</text>
  <text x="620" y="112" font-size="10.5" fill="#333">Breakout de corte X · Y</text>
  <text x="830" y="112" font-size="10.5" text-anchor="end" fill="{{cu(max(u_cbx, u_cby))}}" font-weight="bold">{{u_cbx}} · {{u_cby}}</text>
  <text x="620" y="132" font-size="10.5" fill="#333">Chapa, interacción M–V X · Y</text>
  <text x="830" y="132" font-size="10.5" text-anchor="end" fill="{{cu(max(u_intx, u_inty))}}" font-weight="bold">{{u_intx}} · {{u_inty}}</text>
  <text x="620" y="152" font-size="10.5" fill="#333">Soldadura X · Y</text>
  <text x="830" y="152" font-size="10.5" text-anchor="end" fill="{{cu(max(u_soldx, u_soldy))}}" font-weight="bold">{{u_soldx}} · {{u_soldy}}</text>
  <text x="620" y="172" font-size="10.5" fill="#333">Placa, flexión local X · Y</text>
  <text x="830" y="172" font-size="10.5" text-anchor="end" fill="{{cu(max(u_bpx, u_bpy))}}" font-weight="bold">{{u_bpx}} · {{u_bpy}}</text>

  <text x="620" y="206" font-size="11.5" fill="#222" font-weight="bold">Geometría</text>
  <text x="620" y="228" font-size="10" fill="#555">t_bp ≥ t_sl (DG1 §4.3.3)</text>
  <text x="830" y="228" font-size="10" text-anchor="end" fill="#333">{{v_regla_espesor}}</text>
  <text x="620" y="246" font-size="10" fill="#555">embebido ≥ {{hef_req:mm}} mm</text>
  <text x="830" y="246" font-size="10" text-anchor="end" fill="#333">{{v_embebido}}</text>
  <text x="620" y="264" font-size="10" fill="#555">cabe en el pedestal</text>
  <text x="830" y="264" font-size="10" text-anchor="end" fill="#333">{{v_cabe_pedestal}}</text>
  <text x="620" y="282" font-size="10" fill="#555">psi_brg,sl = {{psi_x}} · {{psi_y}}</text>
  <text x="830" y="282" font-size="10" text-anchor="end" fill="#333">{{v_psi_positivo}}</text>
  <text x="620" y="300" font-size="10" fill="#555">aplastamiento aditivo</text>
  <text x="830" y="300" font-size="10" text-anchor="end" fill="#333">{{v_aditividad}}</text>

  <text x="620" y="334" font-size="11.5" fill="#222" font-weight="bold">Lo que entrega</text>
  <text x="620" y="356" font-size="10" fill="#555">excentricidad e = {{exc:mm}} mm</text>
  <text x="620" y="374" font-size="10" fill="#555">espesor de placa que pide: {{tbp_req:mm}} mm</text>
  <text x="620" y="392" font-size="10" fill="#555">si el breakout no cierra: {{n_ramas_x}} y {{n_ramas_y}} ramas ø{{db_est:mm}}</text>

  <!-- Franja de cierre -->
  <rect x="612" y="452" width="218" height="62" rx="4" fill="{{col_global}}" fill-opacity="0.10" stroke="{{col_global}}" stroke-width="1"/>
  <text x="622" y="470" font-size="9.5" fill="#777">Gobierna</text>
  <text x="622" y="486" font-size="9" fill="#333">{{gobierna}}</text>
  <text x="622" y="505" font-size="12" fill="{{col_global}}" font-weight="bold">u_max = {{u_max}}</text>
</svg>
