<svg xmlns="http://www.w3.org/2000/svg" viewBox="415 28 465 424" font-family="Segoe UI, Arial, sans-serif">
  <!-- Esquema paramétrico de la planilla `gusset-simple-apernado`.
       Derivado de nudo-simple.svg: SOLO el panel B (apernado). Mismas
       coordenadas que el original; el recorte lo hace el viewBox, extendido
       hacia abajo para la banda de valores que lee la hoja. -->
  <defs>
    <marker id="bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a63a8"/>
    </marker>
    <clipPath id="clipB"><polygon points="541.2,96 822.8,96 595.7,318 460,182.3"/></clipPath>
  </defs>
  <rect x="415" y="28" width="465" height="424" fill="#ffffff"/>
  <text x="647" y="44" font-size="11.5" fill="#2c7a4b" text-anchor="middle" font-weight="bold">APERNADO — junta de terreno (NCh2369 8.4.6)</text>
  <rect x="468" y="50" width="370" height="46" fill="#dcd8d0" stroke="#666" stroke-width="1.2"/>
  <text x="476" y="68" font-size="10" fill="#555">viga — ala inferior</text>
