  <line x1="526.4" y1="220.5" x2="485" y2="261.9" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="557.5" y1="251.6" x2="516.1" y2="293" stroke="#c0392b" stroke-width="2.6"/>
