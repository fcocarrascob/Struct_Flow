  <line x1="601.6" y1="114.6" x2="663.4" y2="176.4" stroke="#1a63a8" stroke-width="3.4"/>
  <line x1="595.2" y1="182.8" x2="628.3" y2="149.7" stroke="#1a63a8" stroke-width="1.4" marker-end="url(#bl)"/>
  <circle cx="623.2" cy="136.2" r="4.4" fill="#ffffff" stroke="#2c7a4b" stroke-width="1.9"/>
