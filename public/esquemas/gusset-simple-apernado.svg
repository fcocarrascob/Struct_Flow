  <circle cx="585.8" cy="173.5" r="4.4" fill="#ffffff" stroke="#2c7a4b" stroke-width="1.9"/>
  <circle cx="604.5" cy="192.2" r="4.4" fill="#ffffff" stroke="#2c7a4b" stroke-width="1.9"/>
  <line x1="639.5" y1="169.4" x2="686.8" y2="261.8" stroke="#1a63a8" stroke-width="0.8"/>
  <text x="690" y="268" font-size="9.8" fill="#1a63a8" font-weight="bold">entra con el gramil,</text>
  <text x="690" y="281" font-size="9.8" fill="#1a63a8" font-weight="bold">no en punta · acá las dos caben</text>
  <line x1="626.7" y1="177" x2="686.9" y2="299.7" stroke="#2c7a4b" stroke-width="0.8"/>
  <text x="690" y="306" font-size="9.8" fill="#2c7a4b" font-weight="bold">2 filas de 3 pernos Ø{{d_b:mm}}, en terreno</text>
  <text x="690" y="319" font-size="9.5" fill="#2c7a4b">gramil {{gramil:mm}} · paso {{paso:mm}} · borde {{e_b:mm}} mm</text>
  <line x1="527.9" y1="289.7" x2="683.3" y2="337.9" stroke="#a07a2c" stroke-width="0.8"/>
  <text x="690" y="340" font-size="9.8" fill="#a07a2c" font-weight="bold">2 planchas PL {{w_l:mm}}×{{t_l:mm}} a las caras</text>
  <text x="690" y="353" font-size="9.5" fill="#a07a2c">soldadas en taller → corte doble, sin ranura</text>
  <line x1="485.4" y1="323.7" x2="471.3" y2="349.8" stroke="#222" stroke-width="0.8"/>
  <text x="468" y="356" font-size="9.8" fill="#222" font-weight="bold">□ {{B_t:mm}}×{{B_t:mm}}×{{t_t:mm}}</text>
  <text x="468" y="369" font-size="9.5" fill="#555">gusset t_g = {{t_g:mm}} mm</text>

  <!-- banda de valores vivos: lo que la hoja calcula, bajo el dibujo -->
  <line x1="424" y1="390" x2="872" y2="390" stroke="#c8d2dd" stroke-width="1"/>
  <text x="424" y="406" font-size="9.5" fill="#333">Demanda T_r = {{T_r:tonf}} tonf — manda 0,7·R₁·P_E = {{base:tonf}} sobre el piso 0,5·T_ye = {{piso:tonf}} tonf</text>
  <text x="424" y="422" font-size="9.5" fill="#1a63a8">Whitmore: banda a 45° w_t = {{w_t:cm}} cm (tracción) · banda a 30° w_c = {{w_c:cm}} cm (compresión)</text>
  <text x="424" y="438" font-size="9.5" fill="#c0392b" font-weight="bold">Gobierna el PANDEO del gusset: φR_n = {{Rd_pan:tonf}} tonf → uso {{u_pan}}   (pernos, uso {{u_per}})</text>
