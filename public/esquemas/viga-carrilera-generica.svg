<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="system-ui, sans-serif">
  <!-- Esquema paramétrico de `viga-carrilera-generica`: sección compuesta con el
       eje neutro que el canal sube, y alzado del vano con el tren de dos ruedas
       en la posición crítica. -->

  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Viga carrilera — sección compuesta y tren de ruedas en la posición crítica</text>

  <!-- =============== SECCIÓN =============== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">SECCIÓN (monosimétrica)</text>

  <!-- Ala inferior, alma y ala superior -->
  <rect x="{{sx(-b_fb/2):svg}}" y="{{sy(t_fb):svg}}" width="{{b_fb/(1 mm)*esc:svg}}" height="{{max(2, t_fb/(1 mm)*esc):svg}}" fill="{{col_flex}}"/>
  <rect x="{{sx(-t_w/2):svg}}" y="{{sy(d - t_f):svg}}" width="{{max(1.5, t_w/(1 mm)*esc):svg}}" height="{{h_alma/(1 mm)*esc:svg}}" fill="{{col_alma}}"/>
  <rect x="{{sx(-b_f/2):svg}}" y="{{sy(d):svg}}" width="{{b_f/(1 mm)*esc:svg}}" height="{{max(2, t_f/(1 mm)*esc):svg}}" fill="{{col_flex}}"/>

  <!-- Canal-tapa, si lo hay: una lista vacía dibuja cero clones -->
  <rect data-repetir="canal_px" x="{{sx(-b_f/2):svg}}" y="{{sy(h_tot):svg}}" width="{{b_f/(1 mm)*esc:svg}}" height="{{max(2, (h_tot - d)/(1 mm)*esc):svg}}"
        fill="#1a63a8" fill-opacity="0.35" stroke="#1a63a8" stroke-width="0.8"/>

  <!-- Eje neutro -->
  <line x1="{{sx(-b_f/2) - 18:svg}}" x2="{{sx(b_f/2) + 18:svg}}" y1="{{sy(y_NA):svg}}" y2="{{sy(y_NA):svg}}" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="{{sx(b_f/2) + 22:svg}}" y="{{sy(y_NA) + 4:svg}}" font-size="10" fill="#c0392b">eje neutro y_NA = {{y_NA:mm}} mm</text>

  <!-- Cotas de la sección -->
  <text x="{{sx(0 mm):svg}}" y="{{sy(h_tot) - 10:svg}}" font-size="10" text-anchor="middle" fill="#555"
        stroke="#fff" stroke-width="3" paint-order="stroke">{{hay_canal == 1 ? "con canal-tapa" : "sin canal-tapa"}} · h_tot = {{h_tot:mm}} mm</text>
  <text x="{{sx(b_f/2) + 22:svg}}" y="{{sy(d) + 4:svg}}" font-size="10" fill="{{col_flex}}">ala sup. {{b_f:mm}} × {{t_f:mm}}</text>
  <text x="{{sx(b_f/2) + 22:svg}}" y="{{sy(t_fb) + 4:svg}}" font-size="10" fill="{{col_flex}}">ala inf. {{b_fb:mm}} × {{t_fb:mm}}</text>
  <text x="{{sx(b_f/2) + 22:svg}}" y="{{sy(d/2) + 4:svg}}" font-size="10" fill="{{col_alma}}">alma {{t_w:mm}} mm · h/t_w = {{lam_w}}</text>
  <!-- Cada módulo junto a la fibra a la que pertenece, no apilados sobre la cota
       del eje neutro: ahí S_xc se leía como rótulo del eje. -->
  <text x="{{sx(-b_f/2) - 22:svg}}" y="{{sy(d) + 18:svg}}" font-size="10" text-anchor="end" fill="#555">S_xc = {{S_xc/(1000 mm^3)}} ·10³ mm³</text>
  <text x="{{sx(-b_f/2) - 22:svg}}" y="{{sy(d) + 31:svg}}" font-size="8.5" text-anchor="end" fill="#888">fibra comprimida</text>
  <text x="{{sx(-b_f/2) - 22:svg}}" y="{{sy(t_fb) - 21:svg}}" font-size="10" text-anchor="end" fill="#555">S_xt = {{S_xt/(1000 mm^3)}} ·10³ mm³</text>
  <text x="{{sx(-b_f/2) - 22:svg}}" y="{{sy(t_fb) - 8:svg}}" font-size="8.5" text-anchor="end" fill="#888">fibra traccionada</text>

  <!-- =============== DETALLE DEL ALA SUPERIOR Y EL RIEL =============== -->
  <text x="395" y="70" font-size="11.5" fill="#555" font-weight="bold">DETALLE BAJO LA RUEDA</text>

  <!-- Riel: H_riel es dato, su ancho no, así que se dibuja proporcionado y solo
       se acota la altura. De él y del espesor del ala sale l_b (TR-13 §5.8.4). -->
  <rect x="{{rx(-0.4*H_riel):svg}}" y="{{ry(-H_riel - t_f):svg}}" width="{{0.8*H_riel/(1 mm)*esc_riel:svg}}" height="{{H_riel/(1 mm)*esc_riel:svg}}"
        fill="#c9ced3" stroke="#6d757d" stroke-width="1"/>
  <text x="{{rx(0.4*H_riel) + 5:svg}}" y="{{ry(-H_riel/2 - t_f) + 3:svg}}" font-size="8.5" fill="#6d757d">riel {{H_riel:mm}}</text>

  <!-- Ala superior de canto y arranque del alma -->
  <rect x="{{rx(-(l_b + 5*k_det)/2):svg}}" y="{{ry(-t_f):svg}}" width="{{(l_b + 5*k_det)/(1 mm)*esc_riel:svg}}" height="{{max(2, t_f/(1 mm)*esc_riel):svg}}"
        fill="{{col_flex}}"/>
  <rect x="{{rx(-t_w/2):svg}}" y="{{ry(0 mm):svg}}" width="{{max(1.5, t_w/(1 mm)*esc_riel):svg}}" height="{{2.5*k_det/(1 mm)*esc_riel:svg}}"
        fill="{{col_alma}}"/>

  <!-- l_b sobre la cara superior del ala -->
  <line x1="{{rx(-l_b/2):svg}}" x2="{{rx(l_b/2):svg}}" y1="{{ry(-t_f) - 5:svg}}" y2="{{ry(-t_f) - 5:svg}}" stroke="#c0392b" stroke-width="1.4"/>
  <text x="{{rx(0 mm):svg}}" y="{{ry(-H_riel - t_f) - 5:svg}}" font-size="8.5" text-anchor="middle" fill="#c0392b">l_b = 2·(riel + t_f) = {{l_b:mm}}</text>

  <!-- La dispersión hasta el alma: 2,5·k a cada lado en el interior, a uno solo
       cerca del extremo. Es la diferencia entre [J10-2] y [J10-3]. -->
  <path d="M {{rx(-l_b/2):svg}} {{ry(0 mm):svg}} L {{rx(-l_b/2 - 2.5*k_det):svg}} {{ry(2.5*k_det):svg}}"
        stroke="{{col_alma}}" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
  <path d="M {{rx(l_b/2):svg}} {{ry(0 mm):svg}} L {{rx(l_b/2 + 2.5*k_det):svg}} {{ry(2.5*k_det):svg}}"
        stroke="{{col_alma}}" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
  <line x1="{{rx(-l_b/2 - 2.5*k_det):svg}}" x2="{{rx(l_b/2 + 2.5*k_det):svg}}" y1="{{ry(2.5*k_det) + 6:svg}}" y2="{{ry(2.5*k_det) + 6:svg}}" stroke="{{col_alma}}" stroke-width="1"/>
  <text x="{{rx(0 mm):svg}}" y="{{ry(2.5*k_det) + 17:svg}}" font-size="8.5" text-anchor="middle" fill="{{col_alma}}">5k + l_b = {{5*k_det + l_b:mm}} (interior)</text>
  <line x1="{{rx(-l_b/2):svg}}" x2="{{rx(l_b/2 + 2.5*k_det):svg}}" y1="{{ry(2.5*k_det) + 24:svg}}" y2="{{ry(2.5*k_det) + 24:svg}}" stroke="#c0392b" stroke-width="1"/>
  <text x="{{rx(0 mm):svg}}" y="{{ry(2.5*k_det) + 35:svg}}" font-size="8.5" text-anchor="middle" fill="#c0392b">2,5k + l_b = {{2.5*k_det + l_b:mm}} (extremo, el que rige)</text>
  <text x="{{rx(0 mm):svg}}" y="{{ry(2.5*k_det) + 48:svg}}" font-size="8" text-anchor="middle" fill="#888">k = {{k_det:mm}} mm · §J10.2 y §J10.3</text>

  <!-- =============== ALZADO DEL VANO =============== -->
  <text x="40" y="408" font-size="12" fill="#555" font-weight="bold">ALZADO DEL VANO · dos ruedas en la posición crítica</text>

  <!-- Viga y apoyos -->
  <rect x="{{vx(0 mm):svg}}" y="450" width="{{L/(1 mm)*esc_v:svg}}" height="14" fill="#e7eaed" stroke="#555" stroke-width="1.2"/>
  <path d="M {{vx(0 mm):svg}} 464 l -8 14 l 16 0 Z" fill="#555"/>
  <path d="M {{vx(L):svg}} 464 l -8 14 l 16 0 Z" fill="#555"/>

  <!-- Ruedas: la crítica y la que la acompaña a a_ruedas -->
  <line x1="{{vx(x_crit):svg}}" x2="{{vx(x_crit):svg}}" y1="424" y2="448" stroke="#1a63a8" stroke-width="2.4"/>
  <line x1="{{vx(x_crit + a_ruedas):svg}}" x2="{{vx(x_crit + a_ruedas):svg}}" y1="424" y2="448" stroke="#1a63a8" stroke-width="2.4"/>
  <circle cx="{{vx(x_crit):svg}}" cy="444" r="5" fill="none" stroke="#1a63a8" stroke-width="1.6"/>
  <circle cx="{{vx(x_crit + a_ruedas):svg}}" cy="444" r="5" fill="none" stroke="#1a63a8" stroke-width="1.6"/>
  <text x="{{vx(x_crit):svg}}" y="418" font-size="10" text-anchor="middle" fill="#1a63a8">P_v = {{P_v:tonf}} tonf</text>
  <text x="{{vx(x_crit + a_ruedas):svg}}" y="418" font-size="10" text-anchor="middle" fill="#1a63a8">a = {{a_ruedas:mm}} mm</text>

  <!-- La posición FANTASMA del extremo: el §J10 no se verifica aquí sino con la
       rueda junto al apoyo, que es el caso de menos resistencia. Son dos
       posiciones distintas y el dibujo solo mostraba una. -->
  <line x1="{{vx(x_extremo):svg}}" x2="{{vx(x_extremo):svg}}" y1="430" y2="448" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="{{vx(x_extremo):svg}}" cy="444" r="4.5" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="390" y="428" font-size="8.5" fill="#c0392b">§J10 se verifica con la rueda en el EXTREMO,</text>
  <text x="390" y="440" font-size="8.5" fill="#c0392b">que es el caso de menos resistencia, no en x_crít</text>

  <!-- Cotas del vano -->
  <line x1="{{vx(0 mm):svg}}" x2="{{vx(L):svg}}" y1="494" y2="494" stroke="#888" stroke-width="0.8"/>
  <text x="{{vx(L/2):svg}}" y="508" font-size="10" text-anchor="middle" fill="#555">L = {{L:mm}} mm · L_b = {{L_b:mm}} mm</text>
  <text x="{{vx(x_crit):svg}}" y="484" font-size="9.5" text-anchor="middle" fill="#555">x_crít = {{x_crit:mm}} mm</text>
  <text x="{{vx(0 mm):svg}}" y="530" font-size="10" fill="{{col_serv}}">flecha vertical {{d_vert:mm}} mm ≤ L/{{den_vert}} = {{lim_vert:mm}} mm</text>

  <!-- =============== COLUMNA DE RESULTADOS =============== -->
  <line x1="600" y1="60" x2="600" y2="520" stroke="#ddd" stroke-width="1"/>
  <text x="620" y="66" font-size="11.5" fill="#222" font-weight="bold">Estados límite</text>

  <text x="620" y="92" font-size="10.5" fill="#333">Flexión eje fuerte (§F4)</text>
  <text x="830" y="92" font-size="10.5" text-anchor="end" fill="{{cu(u_flex)}}" font-weight="bold">{{u_flex}}</text>
  <text x="620" y="112" font-size="10.5" fill="#333">Flexión lateral</text>
  <text x="830" y="112" font-size="10.5" text-anchor="end" fill="{{cu(u_lat)}}" font-weight="bold">{{u_lat}}</text>
  <text x="620" y="132" font-size="10.5" fill="#333">Interacción H1</text>
  <text x="830" y="132" font-size="10.5" text-anchor="end" fill="{{cu(u_H1)}}" font-weight="bold">{{u_H1}}</text>
  <text x="620" y="152" font-size="10.5" fill="#333">Corte (§G2)</text>
  <text x="830" y="152" font-size="10.5" text-anchor="end" fill="{{cu(u_corte)}}" font-weight="bold">{{u_corte}}</text>
  <text x="620" y="172" font-size="10.5" fill="#333">Alma bajo la rueda: fluencia</text>
  <text x="830" y="172" font-size="10.5" text-anchor="end" fill="{{cu(u_wly)}}" font-weight="bold">{{u_wly}}</text>
  <text x="620" y="192" font-size="10.5" fill="#333">Alma bajo la rueda: aplastamiento</text>
  <text x="830" y="192" font-size="10.5" text-anchor="end" fill="{{cu(u_wlc)}}" font-weight="bold">{{u_wlc}}</text>
  <text x="620" y="212" font-size="10.5" fill="#333">Pandeo lateral del alma</text>
  <text x="830" y="212" font-size="10.5" text-anchor="end" fill="{{cu(u_wsb)}}" font-weight="bold">{{u_wsb}}</text>
  <text x="620" y="232" font-size="10.5" fill="#333">Flechas vertical y lateral</text>
  <text x="830" y="232" font-size="10.5" text-anchor="end" fill="{{cu(max(u_dvert, u_dhoriz))}}" font-weight="bold">{{u_dvert}} · {{u_dhoriz}}</text>
  <text x="620" y="252" font-size="10.5" fill="#333">Fatiga (Ap. 3)</text>
  <text x="830" y="252" font-size="10.5" text-anchor="end" fill="{{cu(u_fatiga)}}" font-weight="bold">{{u_fatiga}}</text>

  <text x="620" y="286" font-size="11.5" fill="#222" font-weight="bold">Alcance y validez</text>
  <text x="620" y="308" font-size="10" fill="#555">alma no esbelta (§F4)</text>
  <text x="830" y="308" font-size="10" text-anchor="end" fill="#333">{{v_alma_no_esbelta}}</text>
  <text x="620" y="326" font-size="10" fill="#555">alma compacta (caso 16 · TR-13 §5.8.2)</text>
  <text x="830" y="326" font-size="10" text-anchor="end" fill="#333">{{v_alma_compacta}}</text>
  <text x="620" y="340" font-size="8.5" fill="#888">λ_pw = {{lam_pw}} · h_c/h_p = {{h_p != 0 mm ? h_c/h_p : "— (PNA en el ala)"}}</text>
  <text x="620" y="356" font-size="10" fill="#555">C_v1 = {{C_v1}} · k_v = {{k_v}}</text>
  <text x="830" y="356" font-size="10" text-anchor="end" fill="#333">{{v_Cv1b}}</text>
  <text x="620" y="374" font-size="10" fill="#555">S_xt &lt; S_xc: aplica §F4.4</text>
  <text x="830" y="374" font-size="10" text-anchor="end" fill="#333">{{v_tfy_aplica}}</text>
  <text x="620" y="388" font-size="8.5" fill="#888">R_pc = {{R_pc}} · R_pt = {{R_pt}} · M_p/M_y = {{M_p/M_y_ext}}</text>
  <text x="620" y="404" font-size="9.5" fill="#777">{{wsb_estado}}</text>
  <text x="620" y="420" font-size="10" fill="#555">vida infinita a fatiga</text>
  <text x="830" y="420" font-size="10" text-anchor="end" fill="#333">{{v_vida_infinita}}</text>
  <text x="620" y="434" font-size="9.5" fill="#777">L_p = {{L_p:mm}} · L_r = {{L_r:mm}} mm</text>
  <text x="620" y="446" font-size="9" fill="#777">l_b = {{l_b:mm}} mm (TR-13 §5.8.4)</text>

  <!-- Franja de cierre -->
  <rect x="612" y="452" width="218" height="62" rx="4" fill="{{col_global}}" fill-opacity="0.10" stroke="{{col_global}}" stroke-width="1"/>
  <text x="622" y="470" font-size="9.5" fill="#777">Gobierna</text>
  <text x="622" y="486" font-size="9" fill="#333">{{gobierna}}</text>
  <text x="622" y="505" font-size="12" fill="{{col_global}}" font-weight="bold">u_max = {{u_max}}</text>
</svg>
