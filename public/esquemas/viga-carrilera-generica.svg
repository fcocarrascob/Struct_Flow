<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="system-ui, sans-serif">
  <!-- Esquema paramétrico de `viga-carrilera-generica`: sección compuesta con el
       eje neutro que el canal sube, y alzado del vano con el tren de dos ruedas
       en la posición crítica. -->

  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Viga carrilera — sección compuesta y tren de ruedas en la posición crítica</text>

  <!-- =============== SECCIÓN =============== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">SECCIÓN (monosimétrica)</text>

  <!-- Ala inferior, alma y ala superior -->
  <rect x="{{sx(-b_fb/2):svg}}" y="{{sy(t_fb):svg}}" width="{{b_fb/(1 mm)*esc:svg}}" height="{{max(2, t_fb/(1 mm)*esc):svg}}" fill="{{col_flex}}"/>
  <rect x="{{sx(-t_w/2):svg}}" y="{{sy(d - t_f):svg}}" width="{{max(1.5, t_w/(1 mm)*esc):svg}}" height="{{h_alma/(1 mm)*esc:svg}}" fill="{{col_alma}}"/>
  <rect x="{{sx(-b_f/2):svg}}" y="{{sy(d):svg}}" width="{{b_f/(1 mm)*esc:svg}}" height="{{max(2, t_f/(1 mm)*esc):svg}}" fill="{{col_flex}}"/>

  <!-- Canal-tapa, si lo hay: una lista vacía dibuja cero clones -->
  <rect data-repetir="canal_px" x="{{sx(-b_f/2):svg}}" y="{{sy(h_tot):svg}}" width="{{b_f/(1 mm)*esc:svg}}" height="{{max(2, (h_tot - d)/(1 mm)*esc):svg}}"
        fill="#1a63a8" fill-opacity="0.35" stroke="#1a63a8" stroke-width="0.8"/>

  <!-- Eje neutro -->
  <line x1="{{sx(-b_f/2) - 18:svg}}" x2="{{sx(b_f/2) + 18:svg}}" y1="{{sy(y_NA):svg}}" y2="{{sy(y_NA):svg}}" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="{{sx(b_f/2) + 22:svg}}" y="{{sy(y_NA) + 4:svg}}" font-size="10" fill="#c0392b">eje neutro y_NA = {{y_NA:mm}} mm</text>

  <!-- Cotas de la sección -->
  <text x="{{sx(0 mm):svg}}" y="{{sy(h_tot) - 10:svg}}" font-size="10" text-anchor="middle" fill="#555"
        stroke="#fff" stroke-width="3" paint-order="stroke">{{hay_canal == 1 ? "con canal-tapa" : "sin canal-tapa"}} · h_tot = {{h_tot:mm}} mm</text>
  <text x="{{sx(b_f/2) + 22:svg}}" y="{{sy(d) + 4:svg}}" font-size="10" fill="{{col_flex}}">ala sup. {{b_f:mm}} × {{t_f:mm}}</text>
  <text x="{{sx(b_f/2) + 22:svg}}" y="{{sy(t_fb) + 4:svg}}" font-size="10" fill="{{col_flex}}">ala inf. {{b_fb:mm}} × {{t_fb:mm}}</text>
  <text x="{{sx(b_f/2) + 22:svg}}" y="{{sy(d/2) + 4:svg}}" font-size="10" fill="{{col_alma}}">alma {{t_w:mm}} mm · h/t_w = {{lam_w}}</text>
  <text x="{{sx(-b_f/2) - 22:svg}}" y="{{sy(d/2) - 10:svg}}" font-size="10" text-anchor="end" fill="#555">S_xc = {{S_xc/(1000 mm^3)}} ·10³ mm³</text>
  <text x="{{sx(-b_f/2) - 22:svg}}" y="{{sy(d/2) + 8:svg}}" font-size="10" text-anchor="end" fill="#555">S_xt = {{S_xt/(1000 mm^3)}} ·10³ mm³</text>

  <!-- =============== ALZADO DEL VANO =============== -->
  <text x="40" y="408" font-size="12" fill="#555" font-weight="bold">ALZADO DEL VANO · dos ruedas en la posición crítica</text>

  <!-- Viga y apoyos -->
  <rect x="{{vx(0 mm):svg}}" y="450" width="{{L/(1 mm)*esc_v:svg}}" height="14" fill="#e7eaed" stroke="#555" stroke-width="1.2"/>
  <path d="M {{vx(0 mm):svg}} 464 l -8 14 l 16 0 Z" fill="#555"/>
  <path d="M {{vx(L):svg}} 464 l -8 14 l 16 0 Z" fill="#555"/>

  <!-- Ruedas: la crítica y la que la acompaña a a_ruedas -->
  <line x1="{{vx(x_crit):svg}}" x2="{{vx(x_crit):svg}}" y1="424" y2="448" stroke="#1a63a8" stroke-width="2.4"/>
  <line x1="{{vx(x_crit + a_ruedas):svg}}" x2="{{vx(x_crit + a_ruedas):svg}}" y1="424" y2="448" stroke="#1a63a8" stroke-width="2.4"/>
  <circle cx="{{vx(x_crit):svg}}" cy="444" r="5" fill="none" stroke="#1a63a8" stroke-width="1.6"/>
  <circle cx="{{vx(x_crit + a_ruedas):svg}}" cy="444" r="5" fill="none" stroke="#1a63a8" stroke-width="1.6"/>
  <text x="{{vx(x_crit):svg}}" y="418" font-size="10" text-anchor="middle" fill="#1a63a8">P_v = {{P_v:tonf}} tonf</text>
  <text x="{{vx(x_crit + a_ruedas):svg}}" y="418" font-size="10" text-anchor="middle" fill="#1a63a8">a = {{a_ruedas:mm}} mm</text>

  <!-- Cotas del vano -->
  <line x1="{{vx(0 mm):svg}}" x2="{{vx(L):svg}}" y1="494" y2="494" stroke="#888" stroke-width="0.8"/>
  <text x="{{vx(L/2):svg}}" y="508" font-size="10" text-anchor="middle" fill="#555">L = {{L:mm}} mm · L_b = {{L_b:mm}} mm</text>
  <text x="{{vx(x_crit):svg}}" y="484" font-size="9.5" text-anchor="middle" fill="#555">x_crít = {{x_crit:mm}} mm</text>
  <text x="{{vx(0 mm):svg}}" y="530" font-size="10" fill="{{col_serv}}">flecha vertical {{d_vert:mm}} mm ≤ L/{{den_vert}} = {{lim_vert:mm}} mm</text>

  <!-- =============== COLUMNA DE RESULTADOS =============== -->
  <line x1="600" y1="60" x2="600" y2="520" stroke="#ddd" stroke-width="1"/>
  <text x="620" y="66" font-size="11.5" fill="#222" font-weight="bold">Estados límite</text>

  <text x="620" y="92" font-size="10.5" fill="#333">Flexión eje fuerte (§F4)</text>
  <text x="830" y="92" font-size="10.5" text-anchor="end" fill="{{col_flex}}" font-weight="bold">{{u_flex}}</text>
  <text x="620" y="112" font-size="10.5" fill="#333">Flexión lateral</text>
  <text x="830" y="112" font-size="10.5" text-anchor="end" fill="{{col_flex}}" font-weight="bold">{{u_lat}}</text>
  <text x="620" y="132" font-size="10.5" fill="#333">Interacción H1</text>
  <text x="830" y="132" font-size="10.5" text-anchor="end" fill="{{col_flex}}" font-weight="bold">{{u_H1}}</text>
  <text x="620" y="152" font-size="10.5" fill="#333">Corte (§G2)</text>
  <text x="830" y="152" font-size="10.5" text-anchor="end" fill="{{col_alma}}" font-weight="bold">{{u_corte}}</text>
  <text x="620" y="172" font-size="10.5" fill="#333">Alma bajo la rueda: fluencia</text>
  <text x="830" y="172" font-size="10.5" text-anchor="end" fill="{{col_alma}}" font-weight="bold">{{u_wly}}</text>
  <text x="620" y="192" font-size="10.5" fill="#333">Alma bajo la rueda: aplastamiento</text>
  <text x="830" y="192" font-size="10.5" text-anchor="end" fill="{{col_alma}}" font-weight="bold">{{u_wlc}}</text>
  <text x="620" y="212" font-size="10.5" fill="#333">Pandeo lateral del alma</text>
  <text x="830" y="212" font-size="10.5" text-anchor="end" fill="{{col_alma}}" font-weight="bold">{{u_wsb}}</text>
  <text x="620" y="232" font-size="10.5" fill="#333">Flechas vertical y lateral</text>
  <text x="830" y="232" font-size="10.5" text-anchor="end" fill="{{col_serv}}" font-weight="bold">{{u_dvert}} · {{u_dhoriz}}</text>
  <text x="620" y="252" font-size="10.5" fill="#333">Fatiga (Ap. 3)</text>
  <text x="830" y="252" font-size="10.5" text-anchor="end" fill="{{col_fat}}" font-weight="bold">{{u_fatiga}}</text>

  <text x="620" y="286" font-size="11.5" fill="#222" font-weight="bold">Alcance y validez</text>
  <text x="620" y="308" font-size="10" fill="#555">alma no esbelta (§F4)</text>
  <text x="830" y="308" font-size="10" text-anchor="end" fill="#333">{{v_alma_no_esbelta}}</text>
  <text x="620" y="326" font-size="10" fill="#555">alma compacta (TR-13 §5.8.2)</text>
  <text x="830" y="326" font-size="10" text-anchor="end" fill="#333">{{v_alma_compacta}}</text>
  <text x="620" y="344" font-size="10" fill="#555">C_v1 = {{C_v1}} · k_v = {{k_v}}</text>
  <text x="830" y="344" font-size="10" text-anchor="end" fill="#333">{{v_Cv1b}}</text>
  <text x="620" y="362" font-size="10" fill="#555">S_xt &lt; S_xc: aplica §F4.4</text>
  <text x="830" y="362" font-size="10" text-anchor="end" fill="#333">{{v_tfy_aplica}}</text>
  <text x="620" y="380" font-size="9.5" fill="#777">{{wsb_estado}}</text>
  <text x="620" y="398" font-size="10" fill="#555">vida infinita a fatiga</text>
  <text x="830" y="398" font-size="10" text-anchor="end" fill="#333">{{v_vida_infinita}}</text>
  <text x="620" y="418" font-size="10" fill="#555">L_p = {{L_p:mm}} · L_r = {{L_r:mm}} mm</text>

  <!-- Franja de cierre -->
  <rect x="612" y="452" width="218" height="62" rx="4" fill="{{col_global}}" fill-opacity="0.10" stroke="{{col_global}}" stroke-width="1"/>
  <text x="622" y="470" font-size="9.5" fill="#777">Gobierna</text>
  <text x="622" y="486" font-size="9" fill="#333">{{gobierna}}</text>
  <text x="622" y="505" font-size="12" fill="{{col_global}}" font-weight="bold">u_max = {{u_max}}</text>
</svg>
